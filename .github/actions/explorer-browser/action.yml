name: Explorer browser regression
description: Build the static corpus explorer from the verified configuration report and run its browser tests.
inputs:
  github-pages:
    description: '"true" builds under the GitHub Pages base path.'
    required: true
  test-base-path:
    description: Base path the browser tests serve the export under ("" or /truth-core).
    required: true
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: latest
    - name: Install workspace dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Resolve Playwright version
      id: playwright
      shell: bash
      working-directory: apps/corpus-explorer
      run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
    # The browser build only changes with the Playwright version. The runner image already
    # ships Chrome's system libraries, so the slow apt step of `install --with-deps` is skipped.
    - name: Cache Playwright browsers
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
    - name: Install browser for frontier regression
      shell: bash
      run: bun run --cwd apps/corpus-explorer playwright install chromium
    - name: Download this workflow's verified configuration report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: configuration-explorer-report
        path: .cache
    - name: Build explorer
      shell: bash
      env:
        GITHUB_PAGES: ${{ inputs.github-pages }}
        TRUTH_CORE_CONFIGURATION_REPORT: .cache/configuration-explorer.json
        TRUTH_CORE_REQUIRE_CONFIGURATION_REPORT: "true"
      run: bun run build
    - name: Test frontier in the browser
      shell: bash
      env:
        TEST_BASE_PATH: ${{ inputs.test-base-path }}
        TRUTH_CORE_REQUIRE_CONFIGURATION_REPORT: "true"
      run: bun run --cwd apps/corpus-explorer test:browser
