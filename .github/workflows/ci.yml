name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-and-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Validate corpus metadata and source bindings
        run: python3 scripts/corpus.py check
      - name: Verify immutable primary-source witnesses
        run: python3 scripts/source_evidence.py verify
      - name: Exercise source materialization
        run: |
          python3 scripts/source_evidence.py materialize ARIST-PHYS-I-4 --output /tmp/aristotle-physics-i-4.txt
          python3 scripts/source_evidence.py materialize ARIST-CAT-V --output /tmp/aristotle-categories-v.txt
          python3 scripts/source_evidence.py materialize ARIST-MET-IV-1 --output /tmp/aristotle-metaphysics-iv-1.txt
          python3 scripts/source_evidence.py materialize PLATO-TIM-28 --output /tmp/plato-timaeus-28.txt

  corpus-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck explorer
        run: bun run typecheck
      - name: Test explorer
        run: bun run test
      - name: Lint explorer
        run: bun run lint
      - name: Build explorer
        run: bun run build
      - name: Build explorer for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: bun run build

  comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          # Build here: NanoDa exports the compiled library, and relying on the
          # lake cache written by the corpus-and-lean job races and misses.
          build: true
          test: false
      - name: Build pinned Comparator toolchain
        run: scripts/bootstrap-verifier.sh
      - name: Verify the built library with NanoDa
        run: scripts/verify-library.sh
      - name: Verify all advertised results
        run: scripts/verify-all.sh
