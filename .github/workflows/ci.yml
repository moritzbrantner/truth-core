name: Source delivery diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Capture exact downloader responses
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import socket
          import subprocess
          import sys
          import urllib.parse
          import urllib.request
          sys.path.insert(0, "scripts")
          import source_evidence as source
          out = Path("source-delivery-diagnostic")
          out.mkdir(exist_ok=True)
          base = "d44e2ddfcbac5cbf9aa4b86ea854216488e2bc7c"
          metadata = {"base_commit": base, "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(), "run_id": os.environ["GITHUB_RUN_ID"], "user_agent": source.USER_AGENT, "accept_encoding": "identity", "records": []}
          allowed = {"server", "date", "content-type", "content-length", "content-encoding", "last-modified", "etag", "vary", "via", "age", "cache-control", "x-cache", "cf-ray", "cf-cache-status"}
          original = urllib.request.urlopen
          current = None
          def observed_open(request, *args, **kwargs):
              response = original(request, *args, **kwargs)
              current["response"] = {"status": response.status, "final_url": response.geturl(), "headers": {k.lower(): v for k, v in response.headers.items() if k.lower() in allowed}}
              return response
          urllib.request.urlopen = observed_open
          try:
              for page in ("a3c", "a2c2"):
                  manifest_path = Path("corpus/passages/necessarybeing-" + page + ".json")
                  manifest_bytes = manifest_path.read_bytes()
                  snapshot = json.loads(manifest_bytes)["snapshot"]
                  url = snapshot["source_url"]
                  for attempt in range(1, 6):
                      current = {"page": page, "attempt": attempt, "utc": datetime.datetime.now(datetime.timezone.utc).isoformat(), "url": url, "expected": snapshot["sha256"], "manifest_sha256": hashlib.sha256(manifest_bytes).hexdigest()}
                      try:
                          current["dns"] = sorted({entry[4][0] for entry in socket.getaddrinfo(urllib.parse.urlsplit(url).hostname, 443, type=socket.SOCK_STREAM)})
                          body = source.download(url, page, attempts=1)
                          current["actual"] = source.sha256_bytes(body)
                          current["bytes"] = len(body)
                          current["matches"] = current["actual"] == current["expected"]
                          if not current["matches"]:
                              filename = page + "-" + str(attempt) + ".html"
                              (out / filename).write_bytes(body)
                              current["mismatch_body"] = filename
                          print(page, attempt, current["actual"], "MATCH" if current["matches"] else "MISMATCH", flush=True)
                      except Exception as error:
                          current["error_type"] = type(error).__name__
                          print(page, attempt, current["error_type"], flush=True)
                      metadata["records"].append(current)
                      (out / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          finally:
              urllib.request.urlopen = original
              metadata["verdict"] = "mismatch_captured" if any(r.get("matches") is False for r in metadata["records"]) else "no_current_reproduction" if all(r.get("matches") is True for r in metadata["records"]) else "incomplete_network_capture"
              (out / "metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PYTHON
      - name: Retain delivery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: source-delivery-diagnostic-${{ github.sha }}
          path: source-delivery-diagnostic/
          retention-days: 3
          if-no-files-found: error
