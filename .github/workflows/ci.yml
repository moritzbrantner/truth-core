name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full verification of main, so that a regression nothing on a PR selected still
  # turns a run red (GitHub notifies the workflow's owner of failed scheduled runs).
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR cancels its older run; runs on main (push, schedule, dispatch) get a
# unique group and always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-and-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR checks out its merge commit; HEAD^1 is the base the source verify compares to.
          fetch-depth: 2
      - name: Check the per-area import aggregators import every module, sorted
        run: scripts/root-imports.sh
      - name: Check generated docs tables and lists are up to date
        run: python3 scripts/docs_index.py
      # lean-toolchain pins the exact Lean version that the Mathlib release in
      # lake-manifest.json requires. `use-mathlib-cache` runs `lake exe cache get`
      # before `lake build`, so Mathlib is downloaded prebuilt rather than compiled;
      # lean-action also caches .lake between runs.
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          build: true
          test: false
          use-mathlib-cache: true
      - name: Install PDF source extraction
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate corpus metadata and source bindings
        run: python3 scripts/corpus.py check
      - name: Bind argument records to result theorem types
        run: python3 scripts/corpus.py bind-check
      - name: Test corpus tooling and media-span and web-snapshot evidence offline
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Report the premise frontier
        run: python3 scripts/corpus.py frontier --reaching-root
      # On a PR, refetch only the passages whose manifests the PR adds or changes (every
      # passage when the verifier changed) and still validates every manifest offline. A live
      # page that drifts then turns main and the nightly run red without blocking unrelated PRs.
      - name: Verify immutable primary-source witnesses
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/source_evidence.py verify --base HEAD^1 --head HEAD
          else
            python3 scripts/source_evidence.py verify
          fi
      - name: Exercise source materialization
        run: |
          python3 scripts/source_evidence.py materialize ARIST-PHYS-I-4 --output /tmp/aristotle-physics-i-4.txt
          python3 scripts/source_evidence.py materialize ARIST-CAT-V --output /tmp/aristotle-categories-v.txt
          python3 scripts/source_evidence.py materialize ARIST-MET-IV-1 --output /tmp/aristotle-metaphysics-iv-1.txt
          python3 scripts/source_evidence.py materialize ARIST-MET-IV-7 --output /tmp/aristotle-metaphysics-iv-7.txt
          python3 scripts/source_evidence.py materialize PLATO-TIM-28 --output /tmp/plato-timaeus-28.txt
          python3 scripts/source_evidence.py materialize AQUINAS-ST-I-Q2-A3 --output /tmp/aquinas-st-i-q2-a3.txt
          python3 scripts/source_evidence.py materialize CREED-C381 --output /tmp/creed-c381.txt
          python3 scripts/source_evidence.py materialize AQUINAS-ST-I-Q48-A3 --output /tmp/aquinas-st-i-q48-a3.txt
          python3 scripts/source_evidence.py materialize VATICAN-I-DEI-FILIUS-CH3 --output /tmp/vatican-i-dei-filius-ch3.txt
          python3 scripts/source_evidence.py materialize AQUINAS-ST-I-Q4-A2 --output /tmp/aquinas-st-i-q4-a2.txt
          python3 scripts/source_evidence.py materialize ARIST-MET-II-1 --output /tmp/aristotle-metaphysics-ii-1.txt
          python3 scripts/source_evidence.py materialize AQUINAS-ST-I-Q13-A8 --output /tmp/aquinas-st-i-q13-a8.txt

  corpus-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck explorer
        run: bun run typecheck
      - name: Test explorer
        run: bun run test
      - name: Lint explorer
        run: bun run lint

  # The two browser regressions need different static exports (root path and the GitHub Pages
  # base path), so they build and test in parallel instead of one after the other.
  # They run only when comparator-plan reports a changed explorer input; otherwise both checks
  # report as skipped, which a required check accepts. They are two jobs sharing one composite action
  # (.github/actions/explorer-browser), not a matrix: a skipped matrix job reports one check under its unexpanded
  # name, so its per-leg checks could never be required. A certified build needs the
  # configuration report that comparator-library verifies with Lean and the Comparator, so
  # they wait for it rather than repeat that toolchain setup in each job.
  corpus-explorer-browser-root:
    needs: [comparator-plan, comparator-library]
    if: needs.comparator-plan.outputs.explorer == 'true'
    name: corpus-explorer (browser, root path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/explorer-browser
        with:
          github-pages: "false"
          test-base-path: ""

  corpus-explorer-browser-pages:
    needs: [comparator-plan, comparator-library]
    if: needs.comparator-plan.outputs.explorer == 'true'
    name: corpus-explorer (browser, Pages base path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/explorer-browser
        with:
          github-pages: "true"
          test-base-path: /truth-core

  # On a PR, verify only the results the diff can affect (scripts/affected_results.py); on main,
  # nightly and manual runs, verify every result. The selection is recomputed in each job from
  # the same commit, so it needs no artifact hand-off.
  comparator-plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      count: ${{ steps.select.outputs.count }}
      shards: ${{ steps.select.outputs.shards }}
      shard_count: ${{ steps.select.outputs.shard_count }}
      library_changed: ${{ steps.select.outputs.library_changed }}
      explorer: ${{ steps.explorer.outputs.explorer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR checks out its merge commit; HEAD^1 is the base it is tested against.
          fetch-depth: 2
      - name: Select results to verify
        id: select
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/affected_results.py select --base HEAD^1 --head HEAD
          else
            python3 scripts/affected_results.py select --all
          fi
      # The browser jobs run only when the explorer's code can have changed
      # (affected_results.py EXPLORER_INPUT_PATTERNS): on a PR against its base, on a push
      # to main against the previous tip; nightly and manual runs always run them.
      - name: Decide whether the explorer browser jobs run
        id: explorer
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/affected_results.py explorer --base HEAD^1 --head HEAD
          elif [[ "$EVENT" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
            && git fetch --quiet --no-tags --depth=1 origin "$BEFORE"; then
            python3 scripts/affected_results.py explorer --base "$BEFORE" --head HEAD
          else
            python3 scripts/affected_results.py explorer --all
          fi

  # Always produce one live configuration bundle; full library verification stays scoped.
  comparator-library:
    needs: comparator-plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          # Build here: NanoDa exports the compiled library, and relying on the
          # lake cache written by the corpus-and-lean job races and misses.
          build: ${{ needs.comparator-plan.outputs.library_changed == 'true' }}
          test: false
          # Fetch prebuilt Mathlib oleans (`lake exe cache get`) before building.
          use-mathlib-cache: true
      # The pinned lean4export/landrun/nanoda builds and the comparator's Cargo target only change
      # with their pins, so later runs restore them and the bootstrap's builds become no-ops.
      # lean4export must be built for the exact Lean version pinned in lean-toolchain
      # (a mismatch fails with "incompatible header"), so the key carries that version.
      - name: Resolve Lean version
        id: lean
        run: echo "version=$(lean --version | head -n 1 | tr -cs '[:alnum:].' '_')" >> "$GITHUB_OUTPUT"
      - name: Cache Comparator toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/truth-core-verifier
          key: verifier-${{ runner.os }}-${{ steps.lean.outputs.version }}-${{ hashFiles('lean-toolchain', 'scripts/verifier-pins.env', 'scripts/bootstrap-verifier.sh', 'verifier/Cargo.lock', 'verifier/Cargo.toml', 'verifier/src/**') }}
          restore-keys: verifier-${{ runner.os }}-${{ steps.lean.outputs.version }}-
      - name: Build Comparator toolchain
        run: scripts/bootstrap-verifier.sh
      - name: Produce this workflow's verified configuration explorer report
        run: python3 scripts/corpus.py configuration-report --output .cache/configuration-explorer.json
      - name: Upload the verified configuration report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: configuration-explorer-report
          path: .cache/configuration-explorer.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Test Comparator lambda annotation boundary
        if: needs.comparator-plan.outputs.library_changed == 'true'
        run: |
          cargo test --locked --manifest-path verifier/Cargo.toml
          python3 verifier/tests/test_lambda_binders.py ~/.cache/truth-core-verifier/rust-target/release/truth-core-comparator
      - name: Verify every TruthCore declaration and its dependencies with NanoDa
        if: needs.comparator-plan.outputs.library_changed == 'true'
        run: scripts/verify-library.sh
      # The full check adds only imported declarations that no TruthCore declaration uses. Those
      # are fixed by the toolchain, Mathlib and NanoDa pins and by the set of modules TruthCore
      # imports from outside, so a marker keyed by exactly these records that it passed once.
      - name: Key the full-library NanoDa check
        if: needs.comparator-plan.outputs.library_changed == 'true'
        id: full-key
        run: echo "imports=$(python3 scripts/affected_results.py external-imports | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the full-library NanoDa marker
        if: needs.comparator-plan.outputs.library_changed == 'true'
        id: full-marker
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/truth-core-nanoda-full
          key: nanoda-full-${{ runner.os }}-${{ steps.lean.outputs.version }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json', 'scripts/verifier-pins.env', 'scripts/verify-library.sh') }}-${{ steps.full-key.outputs.imports }}
      - name: Verify everything TruthCore imports with NanoDa (once per pin)
        if: needs.comparator-plan.outputs.library_changed == 'true' && steps.full-marker.outputs.cache-hit != 'true'
        run: |
          scripts/verify-library.sh --full
          mkdir -p ~/.cache/truth-core-nanoda-full
          echo "full NanoDa check passed at ${GITHUB_SHA}" > ~/.cache/truth-core-nanoda-full/passed

  comparator-shard:
    name: comparator (shard ${{ matrix.shard }})
    needs: comparator-plan
    if: needs.comparator-plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.comparator-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          # verify-all.sh builds exactly the Challenge and Solution modules of its shard.
          build: false
          test: false
          use-mathlib-cache: true
      - name: Resolve Lean version
        id: lean
        run: echo "version=$(lean --version | head -n 1 | tr -cs '[:alnum:].' '_')" >> "$GITHUB_OUTPUT"
      - name: Cache Comparator toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/truth-core-verifier
          key: verifier-${{ runner.os }}-${{ steps.lean.outputs.version }}-${{ hashFiles('lean-toolchain', 'scripts/verifier-pins.env', 'scripts/bootstrap-verifier.sh', 'verifier/Cargo.lock', 'verifier/Cargo.toml', 'verifier/src/**') }}
          restore-keys: verifier-${{ runner.os }}-${{ steps.lean.outputs.version }}-
      - name: Build Comparator toolchain
        run: scripts/bootstrap-verifier.sh
      - name: Select results to verify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            python3 scripts/affected_results.py select --base HEAD^1 --head HEAD --output "$RUNNER_TEMP/results.txt"
          else
            python3 scripts/affected_results.py select --all --output "$RUNNER_TEMP/results.txt"
          fi
      - name: Verify this shard of the selected results
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.comparator-plan.outputs.shard_count }}
        run: scripts/verify-all.sh --results-file "$RUNNER_TEMP/results.txt" --shard "$SHARD"

  # Stable aggregate: the live report producer always succeeds; optional shards
  # follow the plan. A skipped producer cannot certify an explorer build.
  comparator:
    needs: [comparator-plan, comparator-library, comparator-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check comparator jobs
        env:
          PLAN: ${{ needs.comparator-plan.result }}
          LIBRARY: ${{ needs.comparator-library.result }}
          SHARDS: ${{ needs.comparator-shard.result }}
          MODE: ${{ needs.comparator-plan.outputs.mode }}
          COUNT: ${{ needs.comparator-plan.outputs.count }}
        run: |
          echo "plan=$PLAN ($MODE, $COUNT results) library=$LIBRARY shards=$SHARDS"
          [[ "$PLAN" == success && "$LIBRARY" == success ]] || exit 1
          for result in "$LIBRARY" "$SHARDS"; do
            [[ "$result" == success || "$result" == skipped ]] || exit 1
          done
          if [[ "$MODE" == full ]]; then
            [[ "$LIBRARY" == success && "$SHARDS" == success ]] || exit 1
          fi
