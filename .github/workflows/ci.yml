name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-and-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Validate corpus metadata
        run: python3 scripts/corpus.py check

  corpus-explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck explorer
        run: bun run typecheck
      - name: Test explorer
        run: bun run test
      - name: Lint explorer
        run: bun run lint
      - name: Build explorer
        run: bun run build

  comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - uses: dtolnay/rust-toolchain@stable
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
      - name: Build pinned Comparator toolchain
        run: scripts/bootstrap-verifier.sh
      - name: Verify the built library with NanoDa
        run: scripts/verify-library.sh
      - name: Verify all advertised results
        run: scripts/verify-all.sh
