name: Koons opener comparison diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compare two opener paths with a two-request budget
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import datetime
          import http.client
          import json
          import os
          from pathlib import Path
          import socket
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          sys.path.insert(0, 'scripts')
          import source_evidence as source
          out = Path('opener-diagnostic')
          out.mkdir()
          snapshot = json.loads(Path('corpus/passages/koons-defeasible-reasoning-reply-oppy.json').read_text())['snapshot']
          url, expected = snapshot['wayback_url'], snapshot['wayback_sha256']
          meta = {'commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                  'run_id': os.environ['GITHUB_RUN_ID'], 'request_budget': 2, 'requests': 0,
                  'url': url, 'expected_sha256': expected, 'user_agent': source.USER_AGENT,
                  'accept_encoding': 'identity', 'proxy_environment_present': {
                      k: k in os.environ for k in ('http_proxy','https_proxy','all_proxy','no_proxy',
                                                  'HTTP_PROXY','HTTPS_PROXY','ALL_PROXY','NO_PROXY')},
                  'records': []}
          current = None
          def audit(event, args):
              if event == 'urllib.Request':
                  if meta['requests'] >= 2 or current['requests'] >= 1:
                      raise urllib.error.URLError('diagnostic request budget exhausted; no redirect followup')
                  meta['requests'] += 1
                  current['requests'] += 1
          sys.addaudithook(audit)
          original_begin = http.client.HTTPResponse.begin
          def observed_begin(response):
              result = original_begin(response)
              current['responses'].append({'status': response.status, 'headers': {
                  k: response.getheader(k) for k in ('content-type','content-length','content-encoding')}})
              return result
          http.client.HTTPResponse.begin = observed_begin
          original_open = urllib.request.urlopen
          class Redirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  current['redirect_observed'] = True
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          for label in ('default-urlopen', 'fresh-redirects-opener'):
              current = {'label': label, 'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                         'requests': 0, 'responses': [], 'redirect_observed': False}
              try:
                  host = urllib.parse.urlsplit(url).hostname
                  current['dns'] = sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
                  if label == 'fresh-redirects-opener':
                      opener = urllib.request.build_opener(Redirects())
                      urllib.request.urlopen = opener.open
                  body = source.download(url, label, attempts=1)
                  current.update(actual_sha256=source.sha256_bytes(body), bytes=len(body))
                  current['matches'] = current['actual_sha256'] == expected
                  if not current['matches']:
                      (out / (label + '.bin')).write_bytes(body)
              except Exception as error:
                  current.update(error_type=type(error).__name__, error=str(error))
              finally:
                  urllib.request.urlopen = original_open
              meta['records'].append(current)
              (out / 'metadata.json').write_text(json.dumps(meta,indent=2)+'\n')
              print(label, current.get('actual_sha256', current.get('error_type')), current.get('matches'))
          http.client.HTTPResponse.begin = original_begin
          PYTHON
      - name: Retain bounded comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: koons-opener-comparison-${{ github.run_attempt }}
          path: opener-diagnostic
          retention-days: 3
