name: Deploy corpus explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # A Pages export can outlast the interval between research merges. Let the
  # running deployment publish; GitHub replaces superseded pending runs.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # Pages is a separate workflow, so produce its own current-input report.
      # No previous CI run or cached pass marker stands in for this verification.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          auto-config: false
          build: false
          test: false
          use-mathlib-cache: true
      - name: Resolve Lean version
        id: lean
        run: echo "version=$(lean --version | head -n 1 | tr -cs '[:alnum:].' '_')" >> "$GITHUB_OUTPUT"
      - name: Cache Comparator toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/truth-core-verifier
          key: verifier-${{ runner.os }}-${{ steps.lean.outputs.version }}-${{ hashFiles('lean-toolchain', 'scripts/verifier-pins.env', 'scripts/bootstrap-verifier.sh', 'verifier/Cargo.lock', 'verifier/Cargo.toml', 'verifier/src/**') }}
          restore-keys: verifier-${{ runner.os }}-${{ steps.lean.outputs.version }}-
      - name: Build Comparator toolchain
        run: scripts/bootstrap-verifier.sh
      - name: Produce this workflow's verified configuration explorer report
        run: python3 scripts/corpus.py configuration-report --output .cache/configuration-explorer.json
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Build static corpus explorer
        env:
          GITHUB_PAGES: "true"
          TRUTH_CORE_CONFIGURATION_REPORT: .cache/configuration-explorer.json
          TRUTH_CORE_REQUIRE_CONFIGURATION_REPORT: "true"
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/corpus-explorer/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
