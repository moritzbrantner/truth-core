[[edge]]
premises = ["STMT-ESSE-LIMITED-ONLY-THROUGH-RECEPTION"]
conclusion = "STMT-RECEIVED-PERFECTION-IS-LIMITED-BY-RECIPIENT"
kind = "bridge"
status = "rejected"
note = "Not derivable: a generalization from the esse instance to every perfection does not follow from the instance, and the direction is the converse (limited -> received, not received -> limited). Kept instead as two open statements, each with a supports relation: STMT-RECEIVED-PERFECTION-IS-LIMITED-BY-RECIPIENT (from the q.7 a.1/a.2 claim) and STMT-PERFECTION-LIMITED-ONLY-THROUGH-RECEPTION (from the q.7 a.1 only-through-reception claim, which restricts the warrant to esse). See ATTEMPT-CAUSAL-MAPS-BATCH1-REJECTED-EDGES."

[[edge]]
premises = ["STMT-CAUSE-HAS-WHAT-IT-GIVES", "STMT-PERFECTION-CAUSED-IN-ANOTHER-IS-RECEIVED-IN-IT", "STMT-RECEIVED-PERFECTION-IS-LIMITED-BY-RECIPIENT", "STMT-PERFECTION-LIMITED-ONLY-THROUGH-RECEPTION", "STMT-CAUSE-HAS-PERFECTION-NOT-AS-RECEIVED-IN-EFFECT", "STMT-UNLIMITED-POSSESSION-EXCEEDS-LIMITED"]
conclusion = "STMT-CAUSE-OF-QUALITY-IN-ANOTHER-IS-MORE-SUCH"
kind = "derivation"
status = "certified"
note = "Certified as CAUSE-OF-QUALITY-MORE-SUCH-FROM-RECEPTION-LIMITS. The map's 'unlimited by that recipient' step needed both directions of the reception/limitation link, relativized to the limiter, and the effect's reception of what is caused in it as a sixth premise. Does not use STMT-PERFECTIONS-OF-EFFECT-PREEXIST-IN-CAUSE, so no cycle with PERFECTION-PREEXISTENCE-FROM-CAUSAL-TRANSFER."

[[edge]]
premises = ["STMT-PERFECTIONS-OF-EFFECT-PREEXIST-IN-CAUSE"]
conclusion = "STMT-CAUSE-HAS-WHAT-IT-GIVES"
kind = "derivation"
status = "rejected"
note = "Scope: q.4 a.2 constrains only causes of a thing's being; the unrestricted principle would need every cause of a perfection to be a cause of being (the heater is not). The scoped version is certified in the next edge; the unrestricted one stays an open premise supported by the q.4 a.2 claim."

[[edge]]
premises = ["STMT-PERFECTIONS-OF-EFFECT-PREEXIST-IN-CAUSE", "STMT-CAUSED-PERFECTION-IS-HAD-BY-EFFECT"]
conclusion = "STMT-CAUSE-OF-BEING-HAS-WHAT-IT-GIVES"
kind = "derivation"
status = "certified"
note = "Certified as CAUSE-OF-BEING-HAS-WHAT-IT-GIVES-FROM-PREEXISTENCE (the weak, cause-of-being version)."
