scope = "Same Profile, selected relation and selected world as J1 and the rival; two mutually accessible worlds, three concrete candidates."
coverage = "One explicitly populated interpretation; it shows compatibility of the rival as recorded (contingent support at some admitted world) with the weakened premise, not survival of either."
