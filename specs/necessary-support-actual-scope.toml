target_statement_id = "Existing concrete supporters at the selected world of NECESSARY_2 concreta are NECESSARY_2"
rival_statement_id = "Some necessary concretum is supported somewhere by a concretum absent from an accessible world"
sense_definition_id = "No contingent concrete supporter of a necessary concretum at the selected world"
outcome = "model-witnessed"
