next_step = "Assess the actual-world form of the replaceable-support rival: it needs a concrete necessary whole actually sustained by constituents that might not have existed, with a defended identity criterion (docs/notes/underived-essence-identity.md, Replaceable support). No independent justification for it, and no independent warrant for the selected-world instance, is recorded."

