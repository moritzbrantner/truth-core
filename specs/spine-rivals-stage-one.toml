[[statement]]
id = "Every world sees some world and the selected world does not see itself"
lean = "ActualIrreflexiveSerial"
paraphrase = "Rival framework commitment, unattributed: accessibility is serial (every world accesses some world) and the selected world does not access itself. Replacement account: the relation is read as what lies ahead or what would be ideal, as in temporal-future or deontic readings, not as alethic possibility, so what is the case need not count as accessible. Stronger than the negation of actual reflexivity by the seriality conjunct."
definitions = ["735d59a6-61de-5e43-bcf6-4ff64bceb90d", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]

[[statement]]
id = "Every world sees itself, yet two possibilities of one world need not see each other"
lean = "ReflexiveNonEuclidean"
paraphrase = "Rival framework commitment, unattributed: every world accesses itself, and some world accesses two worlds of which the first does not access the second. Replacement account: metaphysical possibility is relative and not transitive, motivated by arguments from series of small changes in a thing's origin or constitution; the logic of metaphysical modality is then T rather than S5. Stronger than the negation of the Euclidean premise by the reflexivity conjunct."
definitions = ["f8948e28-b13a-5244-95f1-41a05cd4fff2", "6f7a4ccc-10de-52fb-af44-41dcb793d8c9"]
disambiguations = ["7181df76-d6ed-5226-a34b-08910ddbe6a0"]

[[statement]]
id = "Existence is presence now, and something was present at another time but is not present now"
lean = "PresentistGap"
paraphrase = "Rival framework commitment, unattributed: an individual exists in a history exactly when it is present at that history's designated now, and some individual is present at a time of a history without being present at its now. Replacement account: presentism about existence, on which what was present earlier and is no longer present does not exist. Stronger than the negation of presence-to-existence."
definitions = ["DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-COUNT-TEMPORAL-HISTORY-PRESENCE", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]

[[statement]]
id = "Contingent concrete things exist and no possible history is one in which they begin"
lean = "EternalContingencyAt"
paraphrase = "Rival framework commitment, unattributed: some concrete individual is contingent at the selected world, and no history accessible from it satisfies the supplied beginning predicate. Replacement account: contingent concrete reality is beginningless in every possible history, as on eternal-world and steady-state views. Stronger than the negation of the possible beginning by the first conjunct."
definitions = ["6343c7e8-8c65-5f32-8765-e52c0579fdbb", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]

[[statement]]
id = "A beginning of contingent reality is possible and no possible beginning has an external cause"
lean = "BruteBeginningsOnlyAt"
paraphrase = "Rival framework commitment, unattributed: some accessible history satisfies the supplied beginning predicate with a contingent concrete individual, and no accessible history has such a beginning together with an existing concrete cause of the contingent totality outside all contingent concrete individuals. Replacement account: beginnings of contingent reality are brute; nothing outside it could have produced it. Classically the exact negation of the causal-opportunity premise."
definitions = ["6343c7e8-8c65-5f32-8765-e52c0579fdbb", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "beb654a7-e204-5f4c-a7b4-45e886ba7109"]

[[statement]]
id = "Survival models of the rivals of five stage-one premises of the modal spine"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete. (1) Three worlds under a forward-looking frame in which nothing sees the selected world: the frame is serial and Euclidean, not reflexive at the selected world; presence-to-existence, inert emptiness and the possible contingent-free past hold; nothing exists at the selected world. (2) The same assignment under a reflexive frame in which the selected world sees a second world and the second sees a third: not Euclidean, reflexive at the selected world, the same three premises hold and nothing exists at the selected world. (3) Two mutually accessible worlds where existence is presence at time 1, one individual present only at time 0 and another from time 1 on: presence-to-existence fails, inert emptiness and the possible contingent-free past hold, and no individual exists at both worlds. (4) Two mutually accessible worlds each with its own contingent individual and no beginning anywhere: the causal-opportunity premise holds vacuously and no individual exists at both worlds. (5) The existing brute-only scenario: a beginning is possible, no possible beginning has an external cause, and no individual exists at both worlds. Statements about five finite interpretations only."
definitions = ["Concrete-empty moment of a history", "Inert emptiness: a concrete-empty moment is followed only by concrete-empty moments", "Contingent concrete things absent at a moment and present at a later one"]

[[argument]]
id = "Stage-one rival survival controls checked"
theorem = "controls"
premises = []
conclusion = "Survival models of the rivals of five stage-one premises of the modal spine"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit two- and three-world interpretations checked by case analysis"
meaning = "Each of the five rivals is jointly satisfiable with the other premises of the consuming stage-one theorem while that theorem's conclusion fails: groups 1 to 3 against InertEmptiness.necessaryConcrete, groups 4 and 5 against LocalFramePossibleExternalCause.necessaryConcrete. So neither frame premise, nor presence-to-existence, nor the possible beginning, nor the causal opportunity is redundant, and none of the five rivals is excluded by the remaining premises. No rival is refuted or established, and each model concerns one interpretation only."

