# Direct target registrations are deferred; the two Lean lemmas remain intact.
# See docs/notes/epistemic-authority.md for their identities and reopening conditions.
[batch]
definitions = ["d13c0241-320a-5d56-8927-341e46063e05"]
vocab = "TruthCore.Logic.EpistemicAuthority"
results = "TruthCore.Results.Logic.EpistemicAuthority"

[[statement]]
id = "Some ordinary-role belief reason has force at its subject's actual preference"
lean = "ActualForceConcession"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05"]
paraphrase = "OPEN analyst premise, attribution deferred: some subject, consideration and content p are such that the consideration is an attributed ordinary-role reason for believing p and has pro tanto force for that subject at the subject's actual supplied preference. The goal-relative rival grants this whenever an accuracy-valuing subject has favoring evidence. No preference independence, overriding duty or factivity is asserted."

[[statement]]
id = "Belief answerability: force for believing does not vary across supplied preferences"
lean = "BeliefAnswerability"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "881687eb-aed5-47f8-a2fd-a1a7a8a11525"]
paraphrase = "OPEN analyst bridge, attribution deferred: for every subject, consideration and content p, if the consideration has pro tanto force for believing p at one supplied preference alternative, it has that force at every supplied preference alternative, other coordinates fixed. Restricted to belief; asserts no force by itself; not an ontic sufficient-reason principle."

[[statement]]
id = "Goal-relative epistemic force for a supplied accuracy aim"
lean = "GoalRelativeForce"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "e85e9d25-0d45-4a95-a580-d3c2f7ad1f88"]
paraphrase = "OPEN analyst rival account, attribution deferred: for the supplied accuracy-aim predicate, a consideration has pro tanto force for an attitude at a supplied preference exactly when it plays the ordinary epistemic role and that preference satisfies the aim. Holds for every subject, consideration, attitude and supplied preference."

[[statement]]
id = "Some supplied preference alternative lacks the accuracy aim"
lean = "IndifferenceAvailable"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "e85e9d25-0d45-4a95-a580-d3c2f7ad1f88"]
paraphrase = "OPEN analyst premise, attribution deferred: at least one supplied preference alternative does not satisfy the supplied accuracy-aim predicate (an accuracy-indifferent profile is in the comparison class)."

[[statement]]
id = "Every supplied preference alternative includes the accuracy aim"
lean = "ConstitutiveAim"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "00afca5b-f719-41b6-8ea5-a273d9ec9b6f"]
paraphrase = "OPEN analyst premise, attribution deferred: every supplied preference alternative satisfies the supplied accuracy-aim predicate. The constitutive-aim reply motivates this premise, but its claim that the aim belongs to belief as such rather than to the believer's desires is an unencoded interpretation. The formal condition is only universal aim satisfaction; it excludes aim-lacking profiles from the comparison class."

[[statement]]
id = "No ordinary-role epistemic reason keeps force across every supplied preference"
lean = "NoPreferenceIndependentReason"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05"]
paraphrase = "In the frame, there is no subject, consideration and attitude such that the consideration is an attributed ordinary-role reason with pro tanto force at every supplied preference alternative. Negation of the preference-independent existential; it does not deny ordinary-role reasons or actual-preference force."

[[statement]]
id = "Epistemic authority finite omission controls"
lean = "Controls"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "881687eb-aed5-47f8-a2fd-a1a7a8a11525", "e85e9d25-0d45-4a95-a580-d3c2f7ad1f88"]
paraphrase = "Six explicit finite interpretations: a goal-relative frame satisfying thin F6, consideration presentation, the ordinary-role definition, the actual-force concession, the goal-relative account and an indifference alternative but neither answerability nor a preference-independent reason; the same evidence with an actually indifferent subject whose ordinary reason lacks actual force; a forceless frame with answerability but no concession or conclusion; an independent frame satisfying concession, answerability and the conclusion; the independent frame with the accuracy aim, which has an indifference alternative and the conclusion without goal-relative force; and the independent frame with an aim met by every preference, which has goal-relative force, the constitutive aim and the conclusion without an indifference alternative."

[[argument]]
id = "Goal-relative force with indifference excludes preference-independent reasons"
theorem = "goalRelativeExcludesAuthority"
premises = ["Goal-relative epistemic force for a supplied accuracy aim", "Some supplied preference alternative lacks the accuracy aim"]
conclusion = "No ordinary-role epistemic reason keeps force across every supplied preference"
rule = "Universal instantiation at the indifferent preference"
meaning = "Conditional analyst argument, attribution deferred: if force at a preference requires the accuracy aim and some supplied preference lacks it, no reason has force at every supplied preference. Composed with the answerability argument in a separate checked theorem, the actual-force concession, answerability, the goal-relative account and an indifference alternative cannot all hold in one frame. Each premise fails in a finite control while the other holds."

[[argument]]
id = "Epistemic authority finite controls"
theorem = "controls"
premises = []
conclusion = "Epistemic authority finite omission controls"
rule = "Finite counterinterpretations"
meaning = "Explicit Unit-subject finite frames reusing the existing count/reassurance profiles. They witness that thin F6, presentation and the ordinary-role definition are jointly satisfiable with the goal-relative account, an indifference alternative and the absence of any preference-independent reason, that each premise of the answerability argument can fail while the other holds, and (controls 5 and 6) that each premise of the goal-relative exclusion can fail while the other holds, control 6 with the all-preferences aim also witnessing nonvacuity of the constitutive-aim argument. Analyst interpretations, not actual normative facts or possibility claims."

[[statement]]
id = "Some ordinary-role belief reason belongs to a subject whose actual preference has the aim"
lean = "AimedOrdinaryBelief"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "e85e9d25-0d45-4a95-a580-d3c2f7ad1f88"]
paraphrase = "OPEN analyst premise, attribution deferred: some subject, consideration and content p are such that the consideration is an attributed ordinary-role reason for believing p and the subject's actual supplied preference satisfies the supplied accuracy-aim predicate."

[[statement]]
id = "Concession, answerability, goal-relative force and indifference are jointly unsatisfiable"
lean = "AuthorityRivalBundleInconsistent"
definitions = ["d13c0241-320a-5d56-8927-341e46063e05", "881687eb-aed5-47f8-a2fd-a1a7a8a11525", "e85e9d25-0d45-4a95-a580-d3c2f7ad1f88"]
paraphrase = "For every frame and supplied accuracy-aim predicate, the actual-force concession, belief answerability, goal-relative force for that aim and an indifference alternative for that aim do not all hold. Says which bundle is inconsistent, not which member to reject."

[[argument]]
id = "Goal-relative force grants the actual-force concession for aiming subjects"
theorem = "concessionFromGoalRelative"
premises = ["Goal-relative epistemic force for a supplied accuracy aim", "Some ordinary-role belief reason belongs to a subject whose actual preference has the aim"]
conclusion = "Some ordinary-role belief reason has force at its subject's actual preference"
rule = "Goal-relative force introduction at the actual preference"
meaning = "Conditional analyst argument, attribution deferred: under goal-relative force, an ordinary belief reason of a subject whose actual preference has the aim has force at that preference. Checks that the rival account grants the concession premise of the answerability argument; it does not establish that any subject has such a reason."

[[argument]]
id = "Concession, answerability, goal-relativism and indifference bundle exclusion"
theorem = "authorityRivalBundleInconsistent"
premises = []
conclusion = "Concession, answerability, goal-relative force and indifference are jointly unsatisfiable"
rule = "Composition of the answerability and goal-relative exclusion theorems"
meaning = "Checked exclusion: composes the answerability argument with the goal-relative exclusion. At least one of the four members fails in any frame; the theorem does not select which. Analyst formulation, attribution deferred."
