# Act's simple priority over potency, weakened to the routes' use: at a first
# being. Analyst formulations, attribution deferred. Registers the strong
# reading -> first-being instance as a strength order, rederives "no component
# is the first being" from the weak version, and gives a route to the first
# being's pure actuality that bypasses act priority, from composition (q.3 a.7).
# The proof applies each premise only at a supposed first being; three of its
# premises are stated universally, so first-being instances would suffice. No
# premise says that an idle potency of a being other than a first one has a
# prior being in act. Controls: strictness (cold stone), omission of each
# composition premise, and the equivalence of the weak version with the q.3
# a.1 conclusion given non-overlap.

[batch]
vocab = "TruthCore.Causality.ActPriorityAtFirst"
results = "TruthCore.Results.Causality.ActPriorityAtFirst"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being"
lean = "FirstBeingActPriority"
paraphrase = "Open premise, analyst formulation, unattributed: whatever first being (no being other than it is simply prior to it) is in potency in a respect is simply posterior to some being in act in that respect. Since nothing other than a first being is simply prior to it, the witness is the first being itself: the statement says that a first being's potencies are in act in the same respect, and carries no priority over other beings. It is the instance at first beings of act priority for the independent potency parameter (the same body as STMT-ACT-SIMPLY-PRIOR-TO-POTENCY on the independently supplied InPotency). Given same-respect non-overlap it is equivalent to STMT-FIRST-BEING-IS-IN-NO-WAY-IN-POTENCY; it is not an independent act-priority principle."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-SIMPLE-PRIORITY", "DEF-FIRST-BEING"]

[[statement]]
id = "Whatever is in act in some respect and in POTENCY_2 in some respect is composite"
lean = "ActAndPotencyMakeComposite"
paraphrase = "Open premise, analyst formulation, unattributed: whatever is in act in some respect and in potency in some respect is composite. InPotency is the free POTENCY_2 parameter and presupposes real passive potency; Composite is the inclusive SIMPLE_4 sense (without composition of any kind), so that STMT-COMPOSITE-HAS-A-UNITING-CAUSE covers act-potency composition. The thought: a being whose actual being leaves a capacity unrealized has two principles, what it actually is and what it can be but is not. ST I q.3 a.7 co., fourth reason, states the converse (every composite has potency and act), not this direction. The restriction to beings in act in some respect keeps pure potency out: prime matter, in potency and in act in no respect, is not composite. This is where the dipolar rival presses: it grants the composition and denies that such a composite needs a cause."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-SIMPLE"]

[[statement]]
id = "Every first being is in act in some respect"
lean = "FirstBeingIsInSomeAct"
paraphrase = "Open premise, analyst formulation, unattributed: whatever first being (no being other than it is simply prior to it) is in act in some respect. Its denial is a first principle in act in nothing, the shape of the potency-first cosmologies (Night, the seed) that ST I q.4 a.1 ad 2 answers."
definitions = ["DEF-ACT", "DEF-FIRST-BEING", "DEF-SIMPLE-PRIORITY"]

[[statement]]
id = "Cold stone, composition omissions and first-being act priority facts"
lean = "Control.Certificate"
paraphrase = "Closed controls over Bool beings (true a ground, false a stone) and Bool respects (true esse, false heat). (1) Cold stone: act priority at first beings, non-overlap, every first being in act in some respect, act and potency make composite, every composite has a distinct cause of its being, causing another's perfection is efficient causing, efficient causes are prior, the ground is a first being and the stone is in potency to heat, while act's simple priority over every potency fails: the stone has a simply prior ground but nothing is in act in heat. (2) Dropping any one of the five composition-route premises (first being in act, act and potency make composite, composite has a cause, causing another's perfection is efficient causing, efficient causes are prior) leaves the other four and non-overlap while a first stone is in potency to heat with nothing in act in heat, so first-being act priority fails. (3) For every carrier: the strong reading implies the first-being version; the first-being version with non-overlap gives that a first being is in potency in no respect; that conclusion gives the first-being version back; the strong reading, non-overlap and a bridge from simple priority between distinct beings to a relation G give every being in potency a distinct G-predecessor in act in that respect; and non-overlap is needed for the second fact. Statements about these interpretations and implications only."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-SIMPLE-PRIORITY", "DEF-FIRST-BEING", "DEF-SIMPLE"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being, from independent act priority"
theorem = "weakOfStrong"
premises = ["Act priority for the independent potency parameter"]
conclusion = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being"
axioms = []
rule = "Instantiation: the potency bearer is taken to be a first being"
meaning = "Act's simple priority over every potency of the independently supplied potency parameter (IndependentPriority, the transparent wrapper of the STMT-ACT-SIMPLY-PRIOR-TO-POTENCY body) gives it for the potencies of first beings. Registered as a strength order (the strong reading strengthens its first-being instance); strictness is witnessed by Control.ColdStone. An instance, not a new derivation; no premise is established."

[[argument]]
id = "No component is the first being, from act priority at a first being"
theorem = "noComponentFirstOfWeak"
premises = ["STMT-COMPONENT-IS-POTENTIAL-OR-PARTICIPATED", "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being", "STMT-NOTHING-IN-ACT-AND-POTENCY-IN-SAME-RESPECT", "STMT-PARTICIPATED-HAS-OTHER-CAUSE", "STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT"]
conclusion = "STMT-NO-COMPONENT-IS-FIRST-BEING"
axioms = []
rule = "Case split on the kind of component; act priority is applied only to the component supposed first"
meaning = "The existing ComponentFirstness.noComponentFirst with act's simple priority replaced by its first-being instance. A component supposed first is in potency in some respect or participated. If in potency, act priority at a first being gives a being in act in that respect simply prior to it; firstness makes that being the component itself, against non-overlap. If participated, it has a distinct cause of its being, which is prior to it as efficient cause, against firstness. As in the existing noComponentFirst, one CausesIn parameter feeds both STMT-PARTICIPATED-HAS-OTHER-CAUSE and STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT; adding STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT does not bridge it, because the participation record links the external-esse-cause sense of 'causing an effect' while its type uses the plain CausesIn, and relinking it breaks the existing argument's links (recorded defect, follow-up). The proof used the strong reading only at the supposed first component, so the weak version suffices. Conditional consequence only; no premise is established."

[[argument]]
id = "A first being is in POTENCY_2 in no respect, from composition"
theorem = "firstBeingNoPotencyOfComposition"
premises = ["Every first being is in act in some respect", "Whatever is in act in some respect and in POTENCY_2 in some respect is composite", "STMT-COMPOSITE-HAS-A-UNITING-CAUSE", "STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT", "STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT"]
sense_bridges = [
  { term = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE", from = "2478812d-d2cd-4182-8ad0-d27a4bdb9ff2", to = "018d4f0a-2276-42a7-b20d-b0fe6c9c3714", statement_id = "STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT" },
]
strong_version_needed = { "Whatever is in act in some respect and in POTENCY_2 in some respect is composite" = "The route takes act in some respect (STMT 8288ff1e), not act in being; the restriction to act in being suffices only with STMT-ACTUALITY-ONLY-INSOFAR-AS-BEING or the Theta.8 incorruptibility premise, which this route does not assume (see firstBeingNoPotencyOfThetaEight)." }
conclusion = "STMT-FIRST-BEING-IS-IN-NO-WAY-IN-POTENCY"
axioms = []
rule = "Reductio at the supposed first being: act in some respect with potency in another gives composition, composition a distinct cause of being, the bridge an efficient cause, the efficient cause priority, against firstness"
meaning = "A route to the first being's pure actuality that bypasses act priority and non-overlap. A first being is in act in some respect; if it were in potency in some respect it would be composite (act and potency make composite), so it would have a cause of its being other than itself (ST I q.3 a.7 reading), which by the bridge from causing another's perfection to efficient causing causes it efficiently, and so is simply prior to it (ST I q.2 a.3 reading), against firstness. The proof applies each premise only at a supposed first being; three premises are stated universally, so first-being instances would suffice. It uses no claim that idle potencies of other beings have prior beings in act, and no reduction or grounding premise. It relocates the question to whether a first being can be an uncaused composite (the existing uncaused-composite rival). Conditional consequence only; no premise is established."

[[argument]]
id = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being, from composition"
theorem = "weakOfComposition"
premises = ["Every first being is in act in some respect", "Whatever is in act in some respect and in POTENCY_2 in some respect is composite", "STMT-COMPOSITE-HAS-A-UNITING-CAUSE", "STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT", "STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT"]
sense_bridges = [
  { term = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE", from = "2478812d-d2cd-4182-8ad0-d27a4bdb9ff2", to = "018d4f0a-2276-42a7-b20d-b0fe6c9c3714", statement_id = "STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT" },
]
strong_version_needed = { "Whatever is in act in some respect and in POTENCY_2 in some respect is composite" = "The route takes act in some respect (STMT 8288ff1e), not act in being; the restriction to act in being suffices only with STMT-ACTUALITY-ONLY-INSOFAR-AS-BEING or the Theta.8 incorruptibility premise, which this route does not assume (see firstBeingNoPotencyOfThetaEight)." }
conclusion = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being"
axioms = []
rule = "Reductio at the supposed first being, as in firstBeingNoPotencyOfComposition; the first-being version then holds vacuously"
meaning = "The first-being version of act priority from the same five premises: by firstBeingNoPotencyOfComposition a first being is in potency in no respect, so the first-being version holds vacuously. Each of the five premises is needed (Control.CompositionOmissions). The proof applies each premise only at a supposed first being; no premise says that an idle potency of a being other than a first one has a prior being in act. Conditional consequence only; no premise is established."

[[argument]]
id = "Cold stone, composition omissions and first-being act priority facts, checked"
theorem = "controls"
premises = []
conclusion = "Cold stone, composition omissions and first-being act priority facts"
axioms = []
rule = "Explicit two-being interpretations checked by case analysis, and general implications"
meaning = "Controls for the first-being version of act priority. Control.ColdStone witnesses that the strong reading strictly strengthens the first-being version, jointly with non-overlap and the five composition-route premises. Control.CompositionOmissions shows that each of the five composition premises is needed. Control.Facts proves the strength order, the equivalence of the first-being version with the q.3 a.1 conclusion given non-overlap (and that non-overlap is needed for that direction), and that the strong reading with non-overlap and a simple-priority-to-G bridge gives every being in potency a distinct G-predecessor in act in that respect. Model-witnessed and general implications only; no interpretation is claimed metaphysically possible."

