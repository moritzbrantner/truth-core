# #1629: De ente c.3 [69874] (Baur/Koch; Leonine c.4), from a really distinct
# esse to a cause of being other than the thing. A sibling support route for the
# existing q.3 a.4 statement STMT-DISTINCT-ESSE-REQUIRES-EXTERNAL-CAUSE
# (33ad148b): "caused" plus no-self-causation gives "caused by another", and
# De ente's disjunction supplies "caused" only through the efficiency sense
# bridge. Conservation (#1604/#1616) and the efficient-cause-in-any-respect
# premise c0d99549 (#1626) are not used.

[batch]
vocab = "TruthCore.Latin.Aquinas.DeEnte"
results = "TruthCore.Results.Aquinas.DeEnte.ExtrinsicSource"

[[statement]]
id = "Whatever belongs to a thing is from its nature (NATURE_SOURCE_1) or from another"
lean = "NatureOrExtrinsicSourceReading"
paraphrase = "For every x and every respect r that x actually has (InAct x r), x's having r is caused from the principles of x's own nature in some unspecified mode (NATURE_SOURCE_1), or some being c other than x causes x's having r (CausesIn c x r, c distinct from x). Reading of De ente c.3 [69874] (Baur/Koch numbering; Leonine c.4), 'omne quod convenit alicui vel est causatum ex principiis naturae suae ... vel advenit ab aliquo principio extrinseco'. 'Extrinsic' is read only as distinctness from x, not as non-constituency, and the extrinsic principle is encoded as a being; the disjunction is not exclusive and says nothing about time, conservation or modality."
definitions = ["b5ca3837-c09d-4fa0-8fe7-95ca1a2559ff", "DEF-CAUSE-OF-PERFECTION"]
disambiguations = ["87ac7ae0-4235-4d08-bdf6-bc367251c6bd"]

[[statement]]
id = "A distinct esse from its nature (NATURE_SOURCE_1) is caused by its quiddity (NATURE_SOURCE_2)"
lean = "NatureSourcedDistinctEsseIsEfficient"
paraphrase = "OPEN analyst bridge, attribution deferred: for every x that actually exists with esse distinct from its essence (DistinctEsseAt), if x's esse is caused from the principles of x's nature in the unspecified sense NATURE_SOURCE_1, then x's own quiddity efficiently causes x's esse (NATURE_SOURCE_2). It is the sense bridge that lets the literal De ente disjunction meet the rejection, which concerns only efficient causation ('dico sicut a causa efficiente'; the qualifier itself suggests that non-efficient causation of esse is in view). Strongest standing rival: a nature can be a formal, non-efficient principle of its own subject's esse (the standard Thomist gloss, not the passage's words; the passage's 'forma dat esse materiae' concerns form and matter); FormalNatureControl shows only that the two senses are independent primitives. Says nothing about beings whose esse is their essence."
definitions = ["b5ca3837-c09d-4fa0-8fe7-95ca1a2559ff", "4d6a0f0e-637a-4f1c-bf86-ac082b139de5", "DEF-Q3A4-ACTUAL-DISTINCT-ESSE", "DEF-ESSE"]
disambiguations = ["87ac7ae0-4235-4d08-bdf6-bc367251c6bd"]

[[statement]]
id = "Every actual distinct esse is caused by its quiddity (NATURE_SOURCE_2) or by another"
lean = "DistinctEsseNatureOrOtherCause"
paraphrase = "OPEN analyst premise, the weakest exhaustiveness in De ente's vocabulary: for every x that actually exists with esse distinct from its essence, either x's own quiddity efficiently causes x's esse (NATURE_SOURCE_2) or some c other than x causes x's esse (CausesIn c x esse, the tenseless cause of being). Restricted to esse and to distinct-esse beings. With the self-causation reading it entails the vocabulary-free premise that every actual distinct esse has some cause of being. Brute esse, a non-efficient intrinsic account, and a non-causal global or structural explanation all reject it. Derived from the literal De ente disjunction only through the efficiency bridge."
definitions = ["4d6a0f0e-637a-4f1c-bf86-ac082b139de5", "DEF-Q3A4-ACTUAL-DISTINCT-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE"]
disambiguations = ["87ac7ae0-4235-4d08-bdf6-bc367251c6bd"]

[[statement]]
id = "Every actual distinct esse has some cause of being"
lean = "DistinctEsseHasSomeCause"
paraphrase = "OPEN analyst premise, attribution deferred: for every x that actually exists with esse distinct from its essence (DistinctEsseAt), some c causes x's esse (CausesIn c x esse, the tenseless cause of being, mode not fixed by the type). It does not say that c is other than x. It is the exact extra premise that turns 'not self-caused' into 'caused by another': with no self-causation the cause is distinct. Brute esse rejects it; a non-causal intrinsic or structural account rejects it unless its explainer is counted as a being that causes x's esse. Its De ente decomposition is the efficiently read nature-or-other exhaustiveness plus the self-causation reading."
definitions = ["DEF-Q3A4-ACTUAL-DISTINCT-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE"]

[[statement]]
id = "If a thing's quiddity efficiently causes (NATURE_SOURCE_2) its esse, the thing causes its own esse"
lean = "QuiddityCausingEsseIsSelfCausationReading"
paraphrase = "For every x: if x's own form or quiddity efficiently causes x's esse (NATURE_SOURCE_2), then x causes its own esse (CausesIn x x esse). Reading of De ente c.3 [69874]: esse cannot be caused by the form or quiddity of the thing as by an efficient cause, 'quia sic aliqua res esset sui ipsius causa et aliqua res seipsam in esse produceret'. Only this conditional is read; that nothing causes its own being is a separate statement."
definitions = ["4d6a0f0e-637a-4f1c-bf86-ac082b139de5", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE"]
disambiguations = ["87ac7ae0-4235-4d08-bdf6-bc367251c6bd"]

[[statement]]
id = "Another being in act that causes a thing's being is a q.3 a.4 external cause of its esse"
lean = "OtherActualCauseOfBeingIsExternalEsseCause"
paraphrase = "For every x and c: if c is distinct from x, c is in act as to being, and c causes x's being (CausesIn c x esse, CAUSING_AN_EFFECT_3), then x has an external cause of esse in the q.3 a.4 sense (HasExternalEsseCause, CAUSING_AN_EFFECT_2). It holds by the Lean definition of HasExternalEsseCause and adds only distinctness and actuality: the q.3 a.4 reading of that cause as efficient is carried in prose, not in the type, so this bridge does not make any cause of being efficient. It is recorded so that the passage between the two cause senses is explicit."
definitions = ["DEF-CAUSE-OF-PERFECTION", "DEF-EXTERNAL-CAUSE-OF-ESSE", "DEF-ESSE"]

[[statement]]
id = "De ente extrinsic-source controls: five premise omissions and one nonvacuity case"
lean = "ExtrinsicSourceControls"
paraphrase = "Closed finite controls on interpretations over Bool (two beings, two principles, one respect), in each of which false actually exists with esse distinct from its essence. (1) Brute esse: nothing causes anything and nothing is from its nature; the literal De ente disjunction, the weak exhaustiveness, some-cause and the external-cause conclusion fail while the self-causation reading, no-self-causation, actuality of causes of being and the efficiency bridge hold. (2) Formal nature: false's esse is from its nature (NATURE_SOURCE_1) but not efficiently caused by its quiddity, and nothing causes anything; the literal disjunction, self-causation reading, no-self-causation and actuality of causes of being hold, while the efficiency bridge, weak exhaustiveness, some-cause and conclusion fail. 'Formal' is a label: fromNature is an unconstrained primitive, so this shows that the two nature senses are independent, not a model of formal causation. (3) Self-cause: false causes its own esse; only no-self-causation fails among the inputs, and the conclusion fails. (4) Unrealized quiddity: false's quiddity efficiently causes its esse without false causing it; the self-causation reading and some-cause fail, and the conclusion fails. (5) Nonactual cause: true, not in act, causes false's esse; only actuality of causes of being fails, and the conclusion fails. (6) Nonvacuity: every input holds and true, in act, causes false's esse. Statements about these interpretations only: they show which premises the conclusion needs, not that brute or formally sourced esse is possible or plausible."
definitions = ["b5ca3837-c09d-4fa0-8fe7-95ca1a2559ff", "4d6a0f0e-637a-4f1c-bf86-ac082b139de5", "DEF-Q3A4-ACTUAL-DISTINCT-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-EXTERNAL-CAUSE-OF-ESSE", "DEF-ESSE"]
disambiguations = ["87ac7ae0-4235-4d08-bdf6-bc367251c6bd"]

[[argument]]
id = "Distinct esse has another actual cause of being, from being caused and no self-causation"
theorem = "distinctEsseExternalFromCaused"
premises = [
  "Every actual distinct esse has some cause of being",
  "STMT-NOTHING-CAUSES-ITS-OWN-BEING",
  "4ccb319f-9b7e-41fd-a560-d4affa25816b",
  "Another being in act that causes a thing's being is a q.3 a.4 external cause of its esse",
]
conclusion = "STMT-DISTINCT-ESSE-REQUIRES-EXTERNAL-CAUSE"
axioms = []
sense_bridges = [
  { term = "CAUSING_AN_EFFECT", from = "CAUSING_AN_EFFECT_3", to = "CAUSING_AN_EFFECT_2", statement_id = "Another being in act that causes a thing's being is a q.3 a.4 external cause of its esse" },
]
rule = "For an arbitrary actual distinct-esse x take its cause c; c is not x since nothing causes its own being; c is in act as to being; the definitional sense bridge yields HasExternalEsseCause"
meaning = "Non-transcription conditional derivation, for the same witness and the same q.3 a.4 profile: every actual x whose esse differs from its essence has its esse caused by another being that is in act as to being. This is the exact passage from 'not self-caused' to 'caused by another': the only extra premise beyond no-self-causation and the actuality of causes of being is that every actual distinct esse has some cause of being. The conclusion certifies a distinct (c distinct from x, not non-constituent) cause of being in the DEF-CAUSE-OF-PERFECTION sense that is in act as to being; the q.3 a.4 statement's 'efficiently' is its prose reading, not an extra condition of the type. Sibling support option for STMT-DISTINCT-ESSE-REQUIRES-EXTERNAL-CAUSE beside the q.3 a.4 transcription af503cd7; it shares that route's underlying commitment to causal coverage of distinct esse, so it is not independent corroboration of it. The cause is tenseless (CausesIn c x esse): no conservation, present sustaining, world-indexed existence, concreteness, uniqueness or God identification follows. A real distinction is the input DistinctEsseAt; no argument for it is used."

[[argument]]
id = "Every distinct esse has some cause, from De ente's exhaustiveness and self-causation"
theorem = "distinctEsseCausedFromDeEnte"
premises = [
  "Every actual distinct esse is caused by its quiddity (NATURE_SOURCE_2) or by another",
  "If a thing's quiddity efficiently causes (NATURE_SOURCE_2) its esse, the thing causes its own esse",
]
conclusion = "Every actual distinct esse has some cause of being"
axioms = []
rule = "Case split on the weak exhaustiveness: the quiddity horn gives the thing itself as cause by the self-causation reading; the other horn gives the other cause"
meaning = "The De ente decomposition of the extra premise: the efficiently read nature-or-other exhaustiveness (NATURE_SOURCE_2) and the De ente self-causation reading give every actual distinct esse some cause of being (possibly the thing itself, which no-self-causation then excludes downstream). Composed with the step from caused to caused by another, this reconstructs the De ente c.3 [69874] inference (Baur/Koch; Leonine c.4) as three sourced or open inputs plus the efficiency bridge one level up."

[[argument]]
id = "Distinct esse is from its quiddity or another, from De ente's disjunction and bridge"
theorem = "distinctEsseExhaustionFromDeEnte"
premises = [
  "Whatever belongs to a thing is from its nature (NATURE_SOURCE_1) or from another",
  "A distinct esse from its nature (NATURE_SOURCE_1) is caused by its quiddity (NATURE_SOURCE_2)",
]
conclusion = "Every actual distinct esse is caused by its quiddity (NATURE_SOURCE_2) or by another"
axioms = []
sense_bridges = [
  { term = "NATURE_SOURCE", from = "NATURE_SOURCE_1", to = "NATURE_SOURCE_2", statement_id = "A distinct esse from its nature (NATURE_SOURCE_1) is caused by its quiddity (NATURE_SOURCE_2)" },
]
rule = "Instantiate the literal disjunction at esse for an actual distinct-esse x; the nature horn passes through the efficiency bridge, the other horn is kept"
meaning = "Conditional derivation of the weak exhaustiveness from the literal De ente disjunction (NATURE_SOURCE_1, every respect) and the OPEN efficiency sense bridge, for the same profile and nature-source vocabulary. The disjunction alone does not give it: in FormalNatureControl the disjunction holds and the weak exhaustiveness fails, because the two nature senses are independent primitives. The source states the disjunction; the bridge is the analyst's."

[[argument]]
id = "Another actual cause of being is a q.3 a.4 external cause of esse, by definition"
theorem = "otherActualCauseOfBeingIsExternalEsseCause"
premises = []
conclusion = "Another being in act that causes a thing's being is a q.3 a.4 external cause of its esse"
axioms = []
sense_bridges = [
  { term = "CAUSING_AN_EFFECT", from = "CAUSING_AN_EFFECT_3", to = "CAUSING_AN_EFFECT_2", statement_id = "Another being in act that causes a thing's being is a q.3 a.4 external cause of its esse", role = "conclusion" },
]
rule = "Unfold HasExternalEsseCause and supply the witness"
meaning = "Premise-free: for every q.3 a.4 profile, a distinct being in act as to being that causes x's being (CAUSING_AN_EFFECT_3) witnesses x's external cause of esse (CAUSING_AN_EFFECT_2). This holds by the Lean definition of HasExternalEsseCause and adds only distinctness and actuality; it does not make any cause of being efficient, since that reading of the q.3 a.4 sense is carried in prose, not in the type. Recorded as the explicit sense bridge."

[[argument]]
id = "De ente extrinsic-source controls"
theorem = "extrinsicSourceControls"
premises = []
conclusion = "De ente extrinsic-source controls: five premise omissions and one nonvacuity case"
axioms = []
sense_mixing_control = true
rule = "Explicit finite interpretations on Bool with case analysis"
meaning = "Closed controls for the De ente extrinsic-source route. Each open input fails in one interpretation and the conclusion fails there: the literal disjunction together with the weak exhaustiveness and some-cause (brute esse), the efficiency bridge with the weak exhaustiveness and some-cause downstream of it (formal nature, a label for an unconstrained non-efficient nature source), no-self-causation (self-cause), the self-causation reading with some-cause downstream (unrealized quiddity) and the actuality of causes of being (nonactual cause); one interpretation satisfies every input and the conclusion. These witness logical underdetermination under the encoded predicates only; they are not evidence that brute or formally sourced esse is possible or plausible."
