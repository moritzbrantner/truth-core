[[statement]]
id = "Positive two-form capacity context selection and sensor replay controls"
lean = "Controls"
paraphrase = "A non-intellectual receiver has both Boolean foreign forms available without matter. A context-relative codebook tracks both with one intrinsic state. Sensor and replay agree on actual diagonal inputs, but differ when the object changes with recorded value held fixed. These are structural surrogates without a cognition predicate or an account of understanding."
