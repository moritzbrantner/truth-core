meaning = "Explicit joint positive capacity witness and constant-state context model; diagonal agreement is separated from an off-diagonal intervention."

[[statement]]
id = "Reference fixed independently of correctness permits error and competing anchors"
lean = "ReferenceControls"
paraphrase = "An explicitly supplied reference map can persist with incorrect content. Distinct reference maps can also yield equally correct contents under a nondiscriminating target condition. Hence accuracy alone does not select among source, exemplar or constitutive anchoring proposals. These maps model only structural roles; their semantic and causal adequacy remains open."
definitions = []
