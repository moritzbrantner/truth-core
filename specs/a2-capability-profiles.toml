[[statement]]
id = "A2 capability profile comparisons and omission controls"
lean = "Certificate"
definitions = ["63beb159-2c53-434b-8241-f1d9ffcaec42", "0d2eb15b-b7df-42dd-baa2-e855f6476315"]
disambiguations = ["18495e19-0770-5154-8a92-6da075222bc7"]
paraphrase = "Analyst A2 profiles: for any relation outgoing capability implies incoming-or-outgoing capability. Guarded accessible exercise and productive stimulus-response dispositions imply one another only under explicit realization and attribution bridges. Broad coverage denial transfers to outgoing coverage denial with an explicit coverage assumption for incoming-only candidates. Finite Bool controls separate both domains, refute unconditional denial transfer in each profile, witness unexercised disposition, omit each cross-profile bridge, and jointly satisfy both bridges. No source meaning is completed or root premise discharged."

[[statement]]
id = "Normal productive trials realize guarded accessible exercise"
lean = "Realization"
definitions = ["63beb159-2c53-434b-8241-f1d9ffcaec42", "0d2eb15b-b7df-42dd-baa2-e855f6476315"]
disambiguations = ["18495e19-0770-5154-8a92-6da075222bc7"]
paraphrase = "OPEN cross-profile bridge on one fixed process and Ontic standpoint: every response in an unmasked, unfinked stimulus trial supplies guarded accessible exercise for the same ordered pair. This is not assumed true for every process or ontology."

[[statement]]
id = "Guarded accessible exercise attributes a productive disposition"
lean = "Attribution"
definitions = ["63beb159-2c53-434b-8241-f1d9ffcaec42", "0d2eb15b-b7df-42dd-baa2-e855f6476315"]
disambiguations = ["18495e19-0770-5154-8a92-6da075222bc7"]
paraphrase = "OPEN reverse cross-profile bridge on one fixed process and Ontic standpoint: every guarded accessible exercise supplies productive disposition for the same ordered pair. It is independent of realization and does not follow merely from a causal edge."

