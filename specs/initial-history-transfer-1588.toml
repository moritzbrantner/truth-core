[[statement]]
id = "Restricted and complete-description possibility transfer"
lean = "TransferRefinement"
definitions = ["7c9bfc4c-dfb3-4f13-b0f8-e2a1ab0dc505", "978b9b69-3707-52e4-9205-127e9a5ebe77"]
disambiguations = ["da25d281-9924-559c-bb21-0c3f9de50011"]
paraphrase = "For every candidate-description carrier, frames E and M, description P and origin w: if every E-successor of w satisfying P is an M-successor, then E-possibility of P at w yields M-possibility of P at w. For a complete description naming one candidate v, diamond transfer from E to M is equivalent to the single inclusion of the E-edge from w to v in M. Analyst formulation, attribution deferred; no claim about which profile is metaphysically adequate."

[[argument]]
id = "Restricted and complete-description possibility transfer checked"
theorem = "transferRefinement"
premises = []
conclusion = "Restricted and complete-description possibility transfer"
axioms = []
rule = "Witness transfer through restricted inclusion; singleton description"
meaning = "Refines the #438 all-predicate law: one description needs only inclusion on its own witnesses, and a complete description needs exactly one access edge. Full IncludedAt remains exact only for transfer of every predicate. Establishes no possibility claim about actual histories."

[[statement]]
id = "Rigid initial profile, bearer omission and transfer are jointly inconsistent"
lean = "RigidTriad"
definitions = ["7c9bfc4c-dfb3-4f13-b0f8-e2a1ab0dc505", "9f7c8d83-3d48-4c57-b5bb-625b01bedc51", "978b9b69-3707-52e4-9205-127e9a5ebe77"]
disambiguations = ["da25d281-9924-559c-bb21-0c3f9de50011"]
paraphrase = "For every typed history profile whose own frame is the M profile, every E frame, selected world a and bearer b: if the profile is rigid at a and b is initial at a, and some E-successor of a lacks b, then E-successors lacking b are NOT all M-successors of a. Equivalently: rigid initial preservation, E-admissibility of a history omitting the actual initial bearer, and restricted inclusion for such histories cannot all hold. Which member fails is not decided. Analyst formulation, attribution deferred."

[[argument]]
id = "Rigid initial profile, bearer omission and transfer triad checked"
theorem = "rigidTriad"
premises = []
conclusion = "Rigid initial profile, bearer omission and transfer are jointly inconsistent"
axioms = []
rule = "Rigid preservation and initial-to-presence soundness applied at an included witness"
meaning = "Incompatible triad: under the rigid M profile any E-admitted history without the actual initial bearer is M-inadmissible. Restricted inclusion over all such histories is only a sufficient strengthening; an E-based case for an alternative start needs just one M-accessible bearer-omitting E-admitted history (the edge of the edge-check result), which the rigid profile also denies. Conditional on internal hypotheses; neither refutes fixed-history necessity nor establishes it."

[[statement]]
id = "Rigid initial profile with full inclusion gives an E-necessary initial bearer"
lean = "RigidInclusionNecessity"
definitions = ["7c9bfc4c-dfb3-4f13-b0f8-e2a1ab0dc505", "9f7c8d83-3d48-4c57-b5bb-625b01bedc51", "978b9b69-3707-52e4-9205-127e9a5ebe77"]
disambiguations = ["da25d281-9924-559c-bb21-0c3f9de50011"]
paraphrase = "For every typed history profile with M as its frame, every E frame and selected world a: if the profile is rigid at a and every E-successor of a is an M-successor, then some bearer initial at a exists at every E-successor of a. Composes the #535 propagation with the #438 box-transfer law. Analyst formulation, attribution deferred."

[[argument]]
id = "Rigid initial profile with full inclusion E-necessity checked"
theorem = "rigidInclusionNecessity"
premises = []
conclusion = "Rigid initial profile with full inclusion gives an E-necessary initial bearer"
axioms = []
rule = "Imported propagate and box_transfer_iff"
meaning = "If full transfer inclusion is granted together with the rigid profile, some actual initial bearer is present in every E-admitted history: granting inclusion does not by itself remove fixed-history necessity. An access premise, not E-admissibility alone, carries the comparison."

[[statement]]
id = "Initial history transfer 1588 finite model"
lean = "Model"
definitions = ["7c9bfc4c-dfb3-4f13-b0f8-e2a1ab0dc505", "9f7c8d83-3d48-4c57-b5bb-625b01bedc51", "978b9b69-3707-52e4-9205-127e9a5ebe77"]
disambiguations = ["da25d281-9924-559c-bb21-0c3f9de50011"]
paraphrase = "Structural surrogate, not a cosmology. One explicit four-history model (0 actual; 1 same initial bearer, different later observation; 2 same initial description, different initial bearer; 3 different description and bearer), with only initial bearers existing and three equivalence frames: E universal, rigid M sharing the initial bearer, qualitative M sharing the initial description. Under rigid M: the profile is rigid at 0, the later observation varies, bearer 0 is M-necessary but not E-necessary, M is included in E but not conversely, and the bearer-omitting and description-changing alternatives are E-possible and not M-possible. Under qualitative M: same description at all M-successors, not rigid, bearer 0 not necessary, bearer omission M-possible, description change not M-possible; inclusion restricted to same-description bearer omissions holds while inclusion on all bearer omissions and full inclusion fail, and transfer of the same-description omission succeeds. History 2 differs from 0 only by its primitive bearer label, so every separation using it presupposes bearer-distinct qualitative duplicates (OPEN; anti-haecceitist individuation would identify 0 and 2); the history-3 description-change separation does not. Finite formal interpretation only; no metaphysical possibility or chance is asserted."

[[argument]]
id = "Initial history transfer 1588 finite model checked"
theorem = "model"
premises = []
conclusion = "Initial history transfer 1588 finite model"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Finite decision over four histories and three bearers"
meaning = "Nonvacuity and omission controls in a structural surrogate: a concrete E-admissible, M-inadmissible initial-history description under the rigid reading; the weaker qualitative reading admits bearer omission; restricted inclusion is strictly weaker than full inclusion yet sufficient for its description. The bearer-omission separations presuppose bearer-distinct qualitative duplicates (OPEN). Model facts only."

[[statement]]
id = "Rigid initial profile denies the single bearer-omission edge"
lean = "EdgeChecks"
definitions = ["7c9bfc4c-dfb3-4f13-b0f8-e2a1ab0dc505", "9f7c8d83-3d48-4c57-b5bb-625b01bedc51", "978b9b69-3707-52e4-9205-127e9a5ebe77"]
disambiguations = ["da25d281-9924-559c-bb21-0c3f9de50011"]
paraphrase = "For every typed history profile with M as its frame, every E frame, world a and bearer b: if the profile is rigid at a and b is initial at a, then NO E-successor of a that lacks b is an M-successor of a (the single bearer-omission edge fails). In the four-history structural surrogate, the qualitative profile has that edge (via history 2) while failing restricted inclusion on all bearer omissions (via history 3), and the rigid profile lacks the edge. The surrogate separation presupposes bearer-distinct qualitative duplicates (OPEN). Analyst formulation, attribution deferred."

[[argument]]
id = "Rigid initial profile denies the single bearer-omission edge checked"
theorem = "edgeChecks"
premises = []
conclusion = "Rigid initial profile denies the single bearer-omission edge"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Rigid soundness and preservation at an M-accessible witness; finite decision for the surrogate"
meaning = "Binds the discriminating premise in its existential form: one E-admitted, M-accessible history lacking the actual initial bearer. The rigid profile denies exactly this edge; restricted inclusion over all such histories is a sufficient strengthening that the qualitative surrogate profile also fails. No warrant for or against the edge is established."
