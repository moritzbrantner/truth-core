[batch]
vocab = "TruthCore.Causality.LogicalNecessityProfiles"
results = "TruthCore.Results.Causality.LogicalNecessityProfiles"

[[statement]]
id = "K validity of the selected formula"
lean = "AllFrameKValidity"
paraphrase = "NECESSARY_14: the selected modal formula holds on all frames over small world types, all valuations and all worlds."
definitions = ["560fae51-532f-46d8-81e8-6f4386e10a34"]

[[statement]]
id = "Full validity of the selected formula on its frame"
lean = "SelectedFrameValidity"
paraphrase = "NECESSARY_13: the selected formula holds at every valuation/world of the explicitly supplied frame."
definitions = ["ea0a177a-b3a7-4559-946d-d9401ba1c6e3"]

[[statement]]
id = "Stated-theory consequence of the selected formula"
lean = "TheoryRelativeEntailment"
paraphrase = "NECESSARY_15: in the same frame, every valuation/world satisfying every formula of the stated local theory satisfies the selected formula."
definitions = ["3be2906f-9f8e-4dff-b523-41de89c6000d"]

[[statement]]
id = "Theory admitted on the selected accessible cone"
lean = "TheoryOnCone"
paraphrase = "OPEN admission bridge: every formula selected by the stated theory holds at the selected point and all its accessible successors, equivalently every theory formula is true and Kripke-boxed there. Combined with NECESSARY_15 consequence for the same theory, frame and formula, this licenses selected-interpretation NECESSARY_8 box truth. No frame law or equality of the two senses is assumed."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3"]

[[statement]]
id = "Same-bearer existence dictionary for the selected formula"
lean = "ExistenceDictionary"
paraphrase = "OPEN dictionary bridge: at every world of the same Ontic frame, the selected formula in the selected valuation holds exactly when the same rigid candidate n exists. Thus selected-interpretation NECESSARY_8 boxing of that formula transfers to NECESSARY_2 box-existence of this same bearer, retaining the identical frame and accessible worlds. This is an explicit assumption, not an identification of arbitrary formula meanings with existence."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3"]

[[statement]]
id = "Independent root facts of the dictionary bearer"
lean = "RootFactsForBearer"
paraphrase = "OPEN: this same dictionary bearer n independently has the existing RootFacts: actual concrete ungrounded root, God, uniqueness as God and the primitive HasClassicalAttributes field. Linking the existing classical-attributes bundle records its open one-way sufficiency boundary, not an equivalence or an eliminator yielding all nine attributes."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3", "DEF-ACTUAL-ROOT", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-ONE-GOD", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE"]

[[statement]]
id = "Selected formula true and boxed in its interpretation"
lean = "TrueAndBox"
paraphrase = "The same formula holds at the selected world and every accessible world in one fixed frame and valuation. Its box clause uses NECESSARY_8 as the raw Kripke Box operator applied to v maps to Holds F V v phi; no KB symmetry, domain, comprehension or classical-host commitment is inherited."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3", "DEF-QML-KB-NECESSITY"]

[[statement]]
id = "Joint model for the stated local theory"
lean = "JointModel"
paraphrase = "There is a valuation/world of this same frame satisfying every formula of the stated local theory. This is semantic nonvacuity, not real-world truth."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3"]

[[statement]]
id = "Joint theory does not entail falsum"
lean = "NoFalsumConsequence"
paraphrase = "The stated local theory does not semantically entail falsum on this frame."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3"]

[[statement]]
id = "Logical-profile strictness and admission controls"
lean = "Fixture.Controls"
paraphrase = "Finite same-formula witnesses: K-to-frame and frame-to-theory implications are strict; true-and-box alone gives no validity or empty-theory entailment; inconsistent theory entails everything and lacks a joint model; actual-only theory admission misses box truth. The inhabited Unit root fixture jointly satisfies atom theory, cone admission, same-bearer dictionary and independent RootFacts. A separate selected false valuation refutes entailment-to-truth without admission."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3", "3be2906f-9f8e-4dff-b523-41de89c6000d", "560fae51-532f-46d8-81e8-6f4386e10a34", "ea0a177a-b3a7-4559-946d-d9401ba1c6e3", "DEF-KANT-MODAL-NECESSITY", "DEF-NECESSARY-IN-SENSE", "DEF-ACTUAL-ROOT", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-ONE-GOD", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE"]

[[argument]]
id = "K validity weakens to selected-frame validity"
theorem = "kToFrame"
senses = {NECESSARY = "NECESSARY_14"}
premises = ["K validity of the selected formula"]
conclusion = "Full validity of the selected formula on its frame"
rule = "Universal specialization, explicit semantic consequence and finite models"
meaning = "Specialize the all-small-frame universal to the same selected frame and formula. Exact strong-only-premise result."
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_14", to = "NECESSARY_13", statement_id = "Full validity of the selected formula on its frame", role = "conclusion"}]

[[argument]]
id = "Selected-frame validity weakens to theory consequence"
theorem = "frameToTheory"
senses = {NECESSARY = "NECESSARY_13"}
premises = ["Full validity of the selected formula on its frame"]
conclusion = "Stated-theory consequence of the selected formula"
rule = "Universal specialization, explicit semantic consequence and finite models"
meaning = "Full validity holds also under any local theory antecedent on the same frame. Exact strong-only-premise result."
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_13", to = "NECESSARY_15", statement_id = "Stated-theory consequence of the selected formula", role = "conclusion"}]

[[argument]]
id = "Theory consequence gives admitted true-and-box"
theorem = "theoryToTrueAndBox"
senses = {NECESSARY = "NECESSARY_15"}
premises = ["Stated-theory consequence of the selected formula", "Theory admitted on the selected accessible cone"]
conclusion = "Selected formula true and boxed in its interpretation"
rule = "Universal specialization, explicit semantic consequence and finite models"
meaning = "Apply NECESSARY_15 local consequence at the selected point and every accessible point using the explicit cone admission bridge: every theory formula is true and raw Kripke-boxed there. The derived conclusion gives actual truth and NECESSARY_8 box truth for the same formula. NECESSARY_8 denotes only Box F (fun v => Holds F V v phi) w, definitionally the Holds box clause; none of the sourced KB embedding commitments is imported. Cone admission does not identify theory consequence with unrestricted validity or with box truth in unadmitted interpretations."
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_15", to = "NECESSARY_8", statement_id = "Theory admitted on the selected accessible cone", role = "premise"}, {term = "NECESSARY", from = "NECESSARY_15", to = "NECESSARY_8", statement_id = "Selected formula true and boxed in its interpretation", role = "conclusion"}]

[[argument]]
id = "Joint satisfiability excludes falsum consequence"
theorem = "jointModelNotFalsum"
premises = ["Joint model for the stated local theory"]
conclusion = "Joint theory does not entail falsum"
rule = "Universal specialization, explicit semantic consequence and finite models"
meaning = "Evaluate a purported falsum consequence at the joint theory witness."

[[argument]]
id = "Stated-theory existence bridge to the box K root"
theorem = "theoryToRoot"
senses = {NECESSARY = "NECESSARY_15"}
premises = ["Stated-theory consequence of the selected formula", "Theory admitted on the selected accessible cone", "Same-bearer existence dictionary for the selected formula", "Independent root facts of the dictionary bearer"]
conclusion = "STMT-NECESSARY-ROOT-BOX-K"
rule = "Universal specialization, explicit semantic consequence and finite models"
meaning = "Use local consequence at each accessible point, translate the same formula through the explicit dictionary for the same bearer, retain independent RootFacts and introduce that bearer as the box K root. Actual-point theory admission in the chosen cone guard also ensures a joint model; the box part of this proof consumes only the successor conjunct. No actual or divine witness follows from a nonempty carrier. The premise bridges are cone admission NECESSARY_15 to raw same-formula NECESSARY_8 boxing, then the pointwise existence dictionary NECESSARY_8 to NECESSARY_2 for the same bearer. They assert these precise conversion conditions, not any bridge to the Frame carrier misclassified as NECESSARY_11. No premise is discharged."
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_15", to = "NECESSARY_8", statement_id = "Theory admitted on the selected accessible cone", role = "premise"}, {term = "NECESSARY", from = "NECESSARY_8", to = "NECESSARY_2", statement_id = "Same-bearer existence dictionary for the selected formula", role = "premise"}, {term = "NECESSARY", from = "NECESSARY_15", to = "NECESSARY_2", statement_id = "STMT-NECESSARY-ROOT-BOX-K", role = "conclusion"}]

[[argument]]
id = "Logical necessity profile controls checked"
theorem = "controls"
sense_mixing_control = true
premises = []
conclusion = "Logical-profile strictness and admission controls"
rule = "Universal specialization, explicit semantic consequence and finite models"
meaning = "Direct finite interpretation proofs; no formal claim of metaphysical possibility or premise truth."

