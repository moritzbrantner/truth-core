[[statement]]
id = "Logical-profile dictionary and root-facts omission controls"
lean = "Fixture.OmissionControls"
paraphrase = "A valid identity formula, admitted theory and independent actual root facts coexist with a bearer absent at its accessible successor when the existence dictionary is omitted. A separate dictionary-correct admitted atom theory on the same populated ontology gives no God when independent RootFacts is omitted. These are finite non-entailment controls, not universal rival refutations."
definitions = ["699dde60-3c47-4bae-957b-4d696f0e90c3", "3be2906f-9f8e-4dff-b523-41de89c6000d", "560fae51-532f-46d8-81e8-6f4386e10a34", "ea0a177a-b3a7-4559-946d-d9401ba1c6e3", "DEF-KANT-MODAL-NECESSITY", "DEF-NECESSARY-IN-SENSE", "DEF-ACTUAL-ROOT", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-ONE-GOD", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE"]

[[argument]]
id = "Logical-profile dictionary and root-facts omissions checked"
theorem = "omissionControls"
sense_mixing_control = true
premises = []
conclusion = "Logical-profile dictionary and root-facts omission controls"
rule = "Explicit finite semantic counterinterpretations"
meaning = "Omitting the existence dictionary allows a valid identity formula but no box-existent root. Omitting independent RootFacts allows a dictionary-correct admitted atom theory but no God witness. The first model retains an actual root with all divine fields stipulated; its failure concerns only box-existence. The second changes only the supplied divine predicate to False. No reality claim is made."
