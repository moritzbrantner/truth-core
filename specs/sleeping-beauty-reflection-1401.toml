[[statement]]
id = "Predictable amnesia defeats unrestricted future deference"
lean = "AmnesiaControl"
paraphrase = "In the same fair two-coin-world model, a world-revealing present report gives Heads conditional one or zero; a later erased report gives one half in both worlds. Conditioning now on both present knowledge and that known future one-half report preserves one or zero, while conditioning on the future report alone yields one half. The erased report cannot reconstruct the revealing report; the reverse reconstruction exists. Thus unrestricted future-credence deference fails in this explicit loss-of-information control even with each credence calculated by ordinary report conditioning. No claim of Beauty applicability follows."
definitions = ["6a579758-e59a-4a6c-9244-2062deb4c1e7"]

[[argument]]
id = "Predictable amnesia defeats unrestricted future deference by explicit controls"
theorem = "amnesiaControl"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Predictable amnesia defeats unrestricted future deference"
rule = "Explicit fair-report conditioning and squared-error comparison"
meaning = "In the same fair two-coin-world model, a world-revealing present report gives Heads conditional one or zero; a later erased report gives one half in both worlds. Conditioning now on both present knowledge and that known future one-half report preserves one or zero, while conditioning on the future report alone yields one half. The erased report cannot reconstruct the revealing report; the reverse reconstruction exists. Thus unrestricted future-credence deference fails in this explicit loss-of-information control even with each credence calculated by ordinary report conditioning. No claim of Beauty applicability follows. Proposed connection to epistemic warrant remains UNBUILT; reviewable synthesis in docs/notes/sleeping-beauty-1401.md."

[[statement]]
id = "First Monday report calibration control"
lean = "FirstMondayCalibration"
paraphrase = "For a fair coin experiment and exactly one designated first-Monday assessment per experiment, every constant forecast report r has Heads conditional one half. A constant one-third report is therefore not calibrated for this designated cohort. The constant Sunday and constant first-Monday coin reports structurally retain one another in this reduced two-world model. This monitor control does not assume its information or reference class is Beauty's centered evidence."
definitions = ["6a579758-e59a-4a6c-9244-2062deb4c1e7"]

