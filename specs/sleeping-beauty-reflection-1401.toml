id = "Losing independent private information preserves coin credence by explicit controls"
theorem = "irrelevantLossControl"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Losing independent private information preserves coin credence"
rule = "Explicit four-state independent-bit conditioning"
meaning = "In four equal-probability states consisting of a fair coin and an independent fair Boolean private bit, the coin conditional on either observed bit value is one half. Erasing the bit also gives coin conditional one half, even though no reconstruction of the bit from the erased report exists. Thus structural information loss alone does not imply a change in this target credence or failure of this reflection instance. Proposed warrant connection remains UNBUILT; no unrestricted reflection theorem is inferred."
