# Stage two of the modal spine: typed sibling readings for the last two Dei
# Filius primitives. IMMENSE_2 (infinite and causes the being of everything
# else) is contained in the nine with no premise (infinity is one of them; the
# creator conjunct is contained by definition in supreme goodness).
# INCOMPREHENSIBLE_2 (infinite and comprehended by no caused intellect, with the
# explicitly identified primitive relation Comprehends) follows from the nine and
# two new bridges (what is caused is not INFINITE_1, after q.7 a.2; a finite
# intellect does not comprehend an INFINITE_1 being, after q.12 a.7). Two sense
# bridges (IMMENSE_2 -> IMMENSE_1, INCOMPREHENSIBLE_2 -> INCOMPREHENSIBLE_1), each
# strictly weaker than the old bridge it replaces, give the restated sufficiency
# (5fbea2f5) and the Dei Filius root (c0f4a346) further routes for these two
# conjuncts. Analyst formulations, attribution deferred.

[batch]
vocab = "TruthCore.Causality.DeiFiliusImmenseIncomprehensible"
results = "TruthCore.Results.Causality.DeiFiliusImmenseIncomprehensible"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is IMMENSE_2"
lean = "NineAreImmenseAsInfiniteCauseOfAll"
paraphrase = "Whatever is simple, universally perfect, supremely good, such that whatever is GOD_4 is it (IsTheOneGod: uniqueness only), infinite, altogether immutable, eternal, and has intellect and will is IMMENSE_2: it is INFINITE_1 and causes the being of every other being in act as to being. Derived with no premise (nineAreImmenseAsInfiniteCauseOfAll): infinity is one of the nine, and the creator conjunct is contained by definition in supreme goodness, so this is a definitional unfolding, not an independent warrant. IMMENSE_2 is not IMMENSE_1 (the primitive immensity of the Dei Filius attributes): place, containment, measure, presence by power and by knowledge, and immediacy of presence are not typed."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "92c03350-6809-497d-b123-2ffb11c0e0c1", "641c767b-4289-4d92-b900-da7ad603d282"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "3fc3ee02-c3cc-4a61-9724-914d9d07b0dd"]

[[statement]]
id = "Whatever is IMMENSE_2 is IMMENSE_1"
lean = "InfiniteCauseOfAllIsImmense"
paraphrase = "Open sense bridge, analyst formulation, unattributed. Whatever is INFINITE_1 and causes the being of every other being in act as to being (IMMENSE_2) is measured or contained by no place and present to everything that is (IMMENSE_1, the primitive Primitives.Immense). After ST I q.8 a.1-3: God is in all things as an agent is present to that on which it acts, in every place by giving it being, and present to all by essence as the cause of their being. IMMENSE_2 types only causing being (tenselessly), which q.8 a.3 gives as the ground of presence by essence. The bridge carries what IMMENSE_2 leaves untyped: place, containment and measure; presence by power and by knowledge (the other two modes of q.8 a.3); the q.8 a.1 contact principle (an agent is joined to that on which it acts), which turns causing being into being present; sustaining as against merely originating causation (conservation, q.104 a.1), which makes the presence present now, since CausesIn ... esse is tenseless (DEF-CAUSE-OF-PERFECTION); and immediacy of presence. Its antecedent does not say that the being is incorporeal, so 'contained by no place' rests on infinity alone in this bridge. Objections. (a) Existential inertia, SUBSTANTIVE: target this bridge, read with CausesIn as originating causation; mechanism: if things, once caused, persist without concurrent sustaining causation, an originating cause of the being of all need not now be present to anything; independent justification: Schmid 2021 (pinned and read in the corpus, attempt conservation-existential-inertia-rival and docs/eternity-dependence-connection.md) explains persistence by earlier existence plus the absence of destructive causal change; relevance: the bridge itself carries the sustaining step. It is a rival framework, not an established counterexample; Feser 2021 (also read) contests past-state sufficiency, and on the sustaining reading the dispute moves to conservation (q.104 a.1), which stays open. (b) The lead that an immaterial being cannot be present anywhere because presence requires location targets a spatial reading of presence that this bridge does not use (presence here is through causing being, q.8 a.1-2); no independent justification for it is on file, so it is a lead, not an objection. Strictly weaker than 'Whatever causes the being of everything else is IMMENSE_1' (its antecedent adds infinity; Control part 2: a cause of the being of all that is not infinite satisfies this bridge vacuously and falsifies the old one)."
definitions = ["641c767b-4289-4d92-b900-da7ad603d282", "bf2f30d1-609f-4b23-b819-786d877b949c", "DEF-INFINITE", "92c03350-6809-497d-b123-2ffb11c0e0c1"]
disambiguations = ["3fc3ee02-c3cc-4a61-9724-914d9d07b0dd", "DISAMB-IN-ACT", "DISAMB-INFINITY"]

[[statement]]
id = "Whatever has its being caused by another is not INFINITE_1"
lean = "CausedIsNotInfinite"
paraphrase = "Open bridge, analyst formulation, unattributed. Whatever has its being caused by some other being (CausesIn c x esse for some c other than x) is not INFINITE_1 (not unreceived subsistent being). After ST I q.7 a.2 and its ad 1 (it is against the nature of a made thing to be absolutely infinite): anything besides God has its being received into a distinct receiving potency, and so limited. It carries the step from caused being to received being, which the typed vocabulary does not connect (INFINITE_1 is an abstract predicate constrained only by sufficient-condition premises such as 'What is its own subsistent being is INFINITE_1'). It does not over-generate against infinities secundum quid (q.7 a.2: relative infinity of created things), which are not INFINITE_1. SCOPE CONDITION, an explicit domain stipulation binding every premise that shares this Being and CausesIn (recorded in definition 80dea550): elements of Being are individuated by their act of being, so things numerically one in esse are one element. The divine persons share one numerically identical esse, so they are not distinct elements and cannot be represented as such; the Son's being from the Father is no instance of CausesIn c x esse with c distinct from x, and that esse is not received into a distinct receiving potency. Read without this stipulation, with the processions as instances, the bridge would conflict with the case's own Trinitarian commitment that the Son is infinite. (That q.33 a.1 ad 1 prefers 'principle' to 'cause' is only a terminological aside: the reply notes that the Greeks say 'cause'.) Control part 5: without it (both beings infinite), a being with the nine is comprehended by a caused intellect and is not INCOMPREHENSIBLE_2."
definitions = ["DEF-INFINITE", "80dea550-60c1-447a-83bf-d3f27ea0b2a8"]
disambiguations = ["DISAMB-INFINITY"]

[[statement]]
id = "No intellect that is not INFINITE_1 comprehends an INFINITE_1 being"
lean = "FiniteIntellectDoesNotComprehendInfinite"
paraphrase = "Open bridge, analyst formulation, unattributed. For every g and x: if g is INFINITE_1, x has intellect (HAS_INTELLECT_1) and x is not INFINITE_1, then x does not comprehend g (Comprehends, the primitive relation of definition 4afe4ab4: knowing as perfectly as knowable). After ST I q.12 a.7: God is infinitely knowable, being infinite act, and no created intellect knows him infinitely, since its power of knowing, even raised by the light of glory, is finite. The bridge reads 'finite intellect' as an intellect whose being is not INFINITE_1, so it also carries the step from finite being to finite power of knowing. It says nothing about whether such an intellect knows g truly (q.12 a.7 ad 1: the blessed attain God without comprehending him) and nothing about g's knowing itself. Lead, not an objection: finite minds grasp quantitative infinities through finite principles (a definition fixes the natural numbers); its relevance to INFINITE_1 (unlimited act) is not shown, and it is weaker than it looks, since incompleteness cuts toward finite minds not knowing the natural numbers as perfectly as they are knowable. Control part 4: without it, a being with the nine can be comprehended by a caused intellect and is not INCOMPREHENSIBLE_2."
definitions = ["DEF-INFINITE", "DEF-HAS-INTELLECT", "4afe4ab4-f8cc-4120-b284-f1f0140e76c1"]
disambiguations = ["DISAMB-INFINITY", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is INCOMPREHENSIBLE_2"
lean = "NineAreIncomprehensibleToCausedIntellects"
paraphrase = "Whatever is simple, universally perfect, supremely good, such that whatever is GOD_4 is it (uniqueness only), infinite, altogether immutable, eternal, and has intellect and will is INCOMPREHENSIBLE_2: it is INFINITE_1, and no intellect whose being some other being causes comprehends it (the primitive relation Comprehends). Derived from the infinity of the nine (nineAreIncomprehensibleToCausedIntellects; no other of the nine is used) with the two open bridges 'Whatever has its being caused by another is not INFINITE_1' and 'No intellect that is not INFINITE_1 comprehends an INFINITE_1 being'. INCOMPREHENSIBLE_2 is not INCOMPREHENSIBLE_1: the identification of Comprehends with knowing as perfectly as knowable, and creation from nothing, are not typed. It is not unknowability, by the form of its definition: only Comprehends is negated, and no knowing relation is typed."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "94ebe0d2-7cf9-4360-87ce-61c598b4e666", "80dea550-60c1-447a-83bf-d3f27ea0b2a8", "4afe4ab4-f8cc-4120-b284-f1f0140e76c1"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "d63d0696-e5fb-4c85-932e-812989c83b29"]

[[statement]]
id = "Whatever is INCOMPREHENSIBLE_2 is INCOMPREHENSIBLE_1"
lean = "InfiniteUncomprehendedIsIncomprehensible"
paraphrase = "Open sense bridge, analyst formulation, unattributed. Whatever is INFINITE_1 and comprehended by no intellect whose being some other being causes (INCOMPREHENSIBLE_2) is known by no created intellect as perfectly as it is knowable (INCOMPREHENSIBLE_1, the primitive Primitives.Incomprehensible). After ST I q.12 a.7. It carries what INCOMPREHENSIBLE_2 leaves untyped: that the primitive Comprehends is knowing as perfectly as knowable, and that every created intellect (from nothing) is among the caused intellects. Both sides negate comprehension only, so neither conflicts with the cataphatic teaching that God can be known with certainty by natural reason (Dei Filius ch. 2, DS 3004); a radically apophatic thesis (God is not known at all) is stronger than either side and is not a premise here. Taken alone, strictly weaker than 'Whatever is INFINITE_1 is INCOMPREHENSIBLE_1'; but given infinity, this bridge together with 'Whatever has its being caused by another is not INFINITE_1' and 'No intellect that is not INFINITE_1 comprehends an INFINITE_1 being' entails that old bridge for any comprehension relation, causing relation and intellect predicate. So the new route breaks the old commitment into finer premises; it is not a weaker total commitment. Strictness of this bridge alone: weaker than 'Whatever is INFINITE_1 is INCOMPREHENSIBLE_1' (its antecedent adds that no caused intellect comprehends g; Control part 3: an infinite being comprehended by a caused intellect satisfies this bridge vacuously and falsifies the old one)."
definitions = ["94ebe0d2-7cf9-4360-87ce-61c598b4e666", "c4cf79f1-60a9-498a-944b-aeb7dfb56573", "DEF-INFINITE", "80dea550-60c1-447a-83bf-d3f27ea0b2a8", "4afe4ab4-f8cc-4120-b284-f1f0140e76c1"]
disambiguations = ["d63d0696-e5fb-4c85-932e-812989c83b29", "DISAMB-INFINITY"]

[[statement]]
id = "Controls for the typed IMMENSE_2 and INCOMPREHENSIBLE_2 readings"
lean = "Control.Controls"
paraphrase = "Closed controls on interpretations with two beings (Bool; only true causes and is GOD_4; both have intellect and will), one respect in which everything is in act, and no potency: (1) nonvacuity: with true alone infinite and comprehending everything, both new bridges hold, and true has the nine, IMMENSE_2 and INCOMPREHENSIBLE_2 while comprehending itself (this shows only that INCOMPREHENSIBLE_2 allows self-comprehension; that it is not unknowability follows from the form of its definition); (2) with nothing infinite or IMMENSE_1: 'Whatever is IMMENSE_2 is IMMENSE_1' holds and 'Whatever causes the being of everything else is IMMENSE_1' fails; (3) with true alone infinite, everything comprehending everything and nothing INCOMPREHENSIBLE_1: 'Whatever is INCOMPREHENSIBLE_2 is INCOMPREHENSIBLE_1' holds and 'Whatever is INFINITE_1 is INCOMPREHENSIBLE_1' fails; (4) everything comprehends everything: the caused-is-not-infinite bridge holds, true has the nine and is not INCOMPREHENSIBLE_2; (5) both beings infinite, everything comprehends everything: the finite-intellect bridge holds, true has the nine and is not INCOMPREHENSIBLE_2; (6) sense mixing: with nothing IMMENSE_1 or INCOMPREHENSIBLE_1, true has the nine and is IMMENSE_2 and INCOMPREHENSIBLE_2. Statements about these interpretations only."
definitions = ["641c767b-4289-4d92-b900-da7ad603d282", "94ebe0d2-7cf9-4360-87ce-61c598b4e666", "bf2f30d1-609f-4b23-b819-786d877b949c", "c4cf79f1-60a9-498a-944b-aeb7dfb56573", "4afe4ab4-f8cc-4120-b284-f1f0140e76c1", "80dea550-60c1-447a-83bf-d3f27ea0b2a8"]
disambiguations = ["3fc3ee02-c3cc-4a61-9724-914d9d07b0dd", "d63d0696-e5fb-4c85-932e-812989c83b29"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Whatever has the nine is IMMENSE_2, by unfolding the nine"
theorem = "nineAreImmenseAsInfiniteCauseOfAll"
premises = []
conclusion = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is IMMENSE_2"
axioms = []
rule = "Projection of the infinity conjunct and unfolding of supreme goodness at esse"
meaning = "Let g have the nine. g is INFINITE_1 (one of the nine). Its supreme goodness includes causing every perfection of every other being, so in particular the being of every other being in act as to being: g is creator of all (contained by definition, not independently derived). Hence g is IMMENSE_2. A definitional unfolding with no premise; the conclusion is IMMENSE_2, not IMMENSE_1."

[[argument]]
id = "Whatever has the nine is INCOMPREHENSIBLE_2, from finite caused intellects"
theorem = "nineAreIncomprehensibleToCausedIntellects"
premises = ["Whatever has its being caused by another is not INFINITE_1", "No intellect that is not INFINITE_1 comprehends an INFINITE_1 being"]
conclusion = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is INCOMPREHENSIBLE_2"
axioms = []
rule = "Projection of the infinity conjunct, then the two bridges at each caused intellect"
meaning = "Let g have the nine; g is INFINITE_1 (one of the nine). Let x be an intellect whose being some other being causes. By the first premise x is not INFINITE_1; by the second, an intellect that is not INFINITE_1 does not comprehend the INFINITE_1 being g. Hence no caused intellect comprehends g, and g is INCOMPREHENSIBLE_2. Only the infinity conjunct of the nine is used. Conditional consequence; both premises stay open, and the conclusion is INCOMPREHENSIBLE_2, not INCOMPREHENSIBLE_1. Why two premises rather than the single weaker one the step needs (no caused intellect comprehends an INFINITE_1 being): the split separates two independently assessable claims with different warrants and different rivals (caused being is not unreceived being, q.7 a.2; finite power cannot know the infinite as much as it is knowable, q.12 a.7), so each can be derived or refuted on its own; the single weaker premise follows from the two."

