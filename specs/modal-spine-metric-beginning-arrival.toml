[[statement]]
id = "Possibly, some contingent thing is present at some moment"
lean = "PossiblyPopulated"
paraphrase = "OPEN analyst possibility premise, attribution deferred: some history accessible from the selected world has a moment at which some contingent concrete individual is present. No beginning, duration, emptiness or cause is mentioned. It is implied, among others, by actual contingent presence under actual reflexivity and by the possibility premises A3 and A3 prime b; those implications are not registered here. 'Concrete' is the supplied Concrete parameter; the Lean type does not enforce the esse reading."
definitions = ["978d416c-650f-4845-a839-47ce82822bac", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Possibly, contingent reality began a finite time ago (BEGINS_2)"
lean = "PossiblyBeginsFiniteDuration"
paraphrase = "OPEN analyst premise B1 in sense BEGINS_2, attribution deferred: some history accessible from the selected world has a moment at which a contingent concrete individual is present, and in that history every moment at which a contingent concrete individual is present has a past of finite duration on the supplied clock (readings at or before it bounded below). It does NOT say there is a first moment: a populated history whose time is open below and of finite duration, as in standard FLRW cosmology, satisfies it. It says nothing about an empty moment or a cause. Duration is read on the supplied clock: the Lean type allows any order-preserving real coordinate (CLOCK_2); the intended reading is the physically privileged duration (CLOCK_1). 'Concrete' is the supplied Concrete parameter."
definitions = ["1972f626-2de1-4d89-b1d0-46645eabe884", "7c05f92b-907d-4c9b-b219-fc4054c9912b", "375676b0-a295-4a17-a9e4-3db23319d517", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Possibly, contingent reality began at a first moment (BEGINS_1)"
lean = "PossiblyBeginsFirstMoment"
paraphrase = "OPEN analyst premise B1 in sense BEGINS_1, attribution deferred: some history accessible from the selected world has a moment at which a contingent concrete individual is present, and in that history every moment at which a contingent concrete individual is present has a past with a first moment (some moment at or before it has no earlier moment). The first moment need not be populated; nothing is said about what is present at it or about a cause. 'Concrete' is the supplied Concrete parameter."
definitions = ["816c7ad5-354c-4b80-88f7-1b5ba3e5f446", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "If a finite-duration beginning is possible, possibly one has an external cause"
lean = "FiniteDurationCausalOpportunity"
paraphrase = "OPEN analyst premise B2 in sense BEGINS_2, attribution deferred: if some history accessible from the selected world began a finite time ago (in sense BEGINS_2, with a contingent concrete individual existing there), then some accessible history began a finite time ago, has a contingent concrete individual, and has an existing concrete individual, numerically distinct from every contingent concrete individual there, standing in the supplied totality-cause relation there. The totality-cause relation is a parameter, not Ontic.Causes between individuals; the cause is not required to be earlier than anything or present at any moment. Under rigid identity and classical accessibility such an external candidate is a necessary concrete individual of that history (ExternalCandidateNecessity), so the premise, given B1 in the same sense, contains the possibility of a necessary concrete individual. Duration is read with CLOCK_1. 'Concrete' is the supplied Concrete parameter."
definitions = ["77254d4d-c318-40a3-b2a1-5c922632f011", "1972f626-2de1-4d89-b1d0-46645eabe884", "6343c7e8-8c65-5f32-8765-e52c0579fdbb", "cc57aee5-58b7-531d-bcd6-60105efe5c79", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "375676b0-a295-4a17-a9e4-3db23319d517", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]

[[statement]]
id = "Sense, independence and nonvacuity controls for Arrival B in the finite-duration sense"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete. (1) In the beginningless integer history GrimReaperPatchwork.Control.pivot with the identity clock, contingent concrete things are possibly present and no accessible history began a finite time ago. (2) In MetricGrimReaper.Control.openBelow (positive real times, identity clock; every individual exists and is present at every moment of world true, nothing exists at world false): B1 holds in sense BEGINS_2 and fails in sense BEGINS_1; B2 in sense BEGINS_2 fails for the empty totality-cause relation; and for every grounding relation no concrete individual is necessary at either world. (3) In openBelowSource (the same with one more individual existing at both worlds and present at no moment, the totality cause at world true): B1 and B2 in sense BEGINS_2, Euclidean access and reflexivity at world true hold, and for every grounding relation a concrete individual is necessary at world true. These are statements about these interpretations only."
definitions = ["978d416c-650f-4845-a839-47ce82822bac", "816c7ad5-354c-4b80-88f7-1b5ba3e5f446", "1972f626-2de1-4d89-b1d0-46645eabe884", "77254d4d-c318-40a3-b2a1-5c922632f011", "DEF-KANT-MODAL-CONTINGENCY"]

[[argument]]
id = "Possible finite-duration beginning from metrically finite populated pasts"
theorem = "possiblyBeginsFiniteDurationOfMetricallyFinite"
premises = ["4365c3c5-d39b-405c-97a9-a4f7e43c628f", "Possibly, some contingent thing is present at some moment"]
conclusion = "Possibly, contingent reality began a finite time ago (BEGINS_2)"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Take the accessible populated history; the metric conclusion bounds every populated moment's past there"
meaning = "Non-transcription conditional support option for B1 in sense BEGINS_2, connecting the metric Grim Reaper to Arrival B. The possibility premise supplies an accessible history v and a moment at which a contingent concrete individual is present in v. Metrically finite populated pasts (4365c3c5, derived from the open spaced Reaper premises by MetricGrimReaper.populatedPastsMetricallyFiniteOfPatchwork) bound the past of every populated moment of every accessible history, in particular of v, so v began a finite time ago. Any preorder of moments and any real clock; the intended clock is CLOCK_1. The conclusion is NOT a first moment: in MetricBeginningArrival control 2 it holds with no begun populated moment. The possibility premise alone does not give it (control 1). Both premises are OPEN. Nothing is attributed to Koons or Pruss. No premise is established."

[[argument]]
id = "A possible first-moment beginning is a possible finite-duration beginning"
theorem = "possiblyFiniteDurationOfFirstMoment"
premises = ["Possibly, contingent reality began at a first moment (BEGINS_1)"]
conclusion = "Possibly, contingent reality began a finite time ago (BEGINS_2)"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_bridges = [{term = "BEGINS", from = "BEGINS_1", to = "BEGINS_2", statement_id = "Possibly, contingent reality began a finite time ago (BEGINS_2)", role = "conclusion"}]
rule = "In linear time the first moment's clock reading bounds the past below (MetricGrimReaper.metricallyFiniteOfBegun)"
meaning = "Strength order between the two senses of B1 (linear time, any real clock): a possible beginning at a first moment is a possible beginning a finite time ago, because in linear time a past with a first moment has finite duration. The converse fails: MetricBeginningArrival control 2 (positive real times) satisfies B1 in sense BEGINS_2 and not in sense BEGINS_1. This is the only passage between the senses; it runs from BEGINS_1 to BEGINS_2. No premise is established."

[[argument]]
id = "Stage-one conclusion from a finite-duration beginning with an external cause"
theorem = "necessaryConcreteOfFiniteDurationBeginning"
premises = ["Any two successors of the selected world are mutually accessible", "STMT-ACTUAL-MODAL-REFLEXIVITY", "Possibly, contingent reality began a finite time ago (BEGINS_2)", "If a finite-duration beginning is possible, possibly one has an external cause"]
conclusion = "STMT-NECESSARY-CONCRETE-AT"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_bridges = [{term = "NECESSARY", from = "NECESSARY_11", to = "NECESSARY_2", statement_id = "STMT-NECESSARY-CONCRETE-AT", role = "conclusion"}]
transcription = "instantiation"
rule = "Instantiate ActualEuclidean.externalNecessaryConcrete at the Scenario whose beginning predicate is BEGINS_2"
meaning = "Instantiation of the verified Arrival B (ActualEuclidean.externalNecessaryConcrete, Euclidean access at the selected world only) at the Scenario built from the history with beginning predicate BEGINS_2; the Scenario's concrete individual necessary at w is the conclusion's, with the profile's grounding relation an arbitrary parameter. A BEGINS_2 beginning with a contingent concrete individual present is a Scenario beginning; causal opportunity gives an accessible history with an existing concrete external totality-cause, necessary there by ExternalCandidateNecessity, and carried to w by Euclidean access and reflexivity at w. It puts Arrival B in a definite sense on the route to STMT-NECESSARY-CONCRETE-AT, with B1 in that sense derivable from the metric Grim Reaper. B2 in sense BEGINS_2 does the decisive work: with B1 it already gives the possibility of a necessary concrete individual (possiblyNecessaryOfFiniteDurationOpportunity), and the Reaper premises with B1 do not reach the conclusion without it (control 2). All four premises are OPEN; no premise truth, uniqueness, causal role at w or divine attribute is established."

[[argument]]
id = "Possibly a necessary being, from a finite-duration beginning and external cause"
theorem = "possiblyNecessaryOfFiniteDurationOpportunity"
premises = ["Possibly, contingent reality began a finite time ago (BEGINS_2)", "If a finite-duration beginning is possible, possibly one has an external cause"]
conclusion = "d2d7cf61-efd0-4bc0-93f6-2232402e8627"
axioms = ["propext", "Classical.choice", "Quot.sound"]
transcription = "instantiation"
rule = "Apply causal opportunity to the possible beginning; the external candidate is necessary in its history (LocalFramePossibleExternalCause.necessaryOfExternalCandidate)"
meaning = "Discloses what B1 and B2 in sense BEGINS_2 already carry, with no frame condition: causal opportunity applied to the possible beginning yields an accessible history v with an existing concrete individual distinct from every contingent concrete individual of v; under rigid identity and classical accessibility it is absent from no world accessible from v (ExternalCandidateNecessity), so possibly a necessary concrete individual exists (d2d7cf61). A rival who denies that a necessary concrete individual is possible therefore rejects B2 in this sense (given B1) outright; the arrival does not discriminate against that rival, as noted for the parameter-sense B2 and for A3 prime a with A3 prime b. Both premises are OPEN. No premise is established."

[[argument]]
id = "Finite-duration Arrival B controls checked"
theorem = "controls"
premises = []
conclusion = "Sense, independence and nonvacuity controls for Arrival B in the finite-duration sense"
sense_mixing_control = true
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit interpretations with integer and positive real times and identity clocks, checked with the metric lemmas and the external-candidate theorem"
meaning = "Control 1: the possibility premise without metrically finite populated pasts does not give B1 in sense BEGINS_2. Control 2: on an open-below finite populated history (the order and metric shape of FLRW cosmic time) B1 holds in sense BEGINS_2 but not BEGINS_1, so the senses differ and the strength order is strict; there B2 in sense BEGINS_2 fails for the empty totality-cause relation and no concrete individual is necessary, so B1 with the frame premises does not give the conclusion without B2 (and, by MetricGrimReaper control 2, the spaced Reaper premises hold there for every register frame). Control 3: the full premise bundle of the finite-duration arrival is jointly satisfiable on an open-below finite history, with the conclusion. Model claims concern these interpretations only."

