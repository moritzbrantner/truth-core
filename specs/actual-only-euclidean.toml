[batch]
vocab = "TruthCore.Causality.ActualOnlyEuclidean"
results = "TruthCore.Results.Causality.ActualOnlyEuclidean"
definitions = ["Euclidean access at the selected world only", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]

[[statement]]
id = "Whatever a successor of the selected world accesses, the selected world accesses"
lean = "TransitiveAt"
paraphrase = "OPEN analyst premise, attribution deferred: local axiom 4 at the selected world w. If w accesses v and v accesses z, then w accesses z. Under the alethic reading, whatever is possibly possible relative to the actual history is possible relative to it. Nothing is said about chains starting at other worlds."
definitions = ["Euclidean access at the selected world only", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]

[[statement]]
id = "Every successor of the selected world has Euclidean access"
lean = "EuclideanOnSuccessors"
paraphrase = "For every world v accessible from the selected world w, any two worlds accessible from v access one another (local axiom 5 holds at each successor of w)."
definitions = ["Euclidean access at the selected world only", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]

[[statement]]
id = "Surrogate controls locating local versus global Euclidean access"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls on three worlds (actual, near, far); STRUCTURAL SURROGATES that encode no rival's grounding of access. (1) On the frame clustered (actual and near see each other and themselves, near also sees far, far sees only itself), Euclidean access at actual holds, transitivity at actual fails, and near is not Euclidean. (2) On the frame appendix (every world sees itself, far also sees actual), Euclidean access, transitivity and reflexivity at actual hold, actual does not see far, and the frame is not Euclidean. Statements about these finite frames only."
definitions = ["Euclidean access at the selected world only", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]

[[argument]]
id = "Local axioms 5 and 4 at the selected world give axiom 5 at its successors"
theorem = "euclideanOnSuccessors"
premises = ["1b1462e6-c285-448c-87e2-3053bc05a341", "Whatever a successor of the selected world accesses, the selected world accesses"]
conclusion = "Every successor of the selected world has Euclidean access"
axioms = []
rule = "For successor v and its successors a, b: transitivity at w makes a, b successors of w; Euclidean access at w relates them"
meaning = "Frame-theoretic locator for the dialectical value of Euclidean access at the actual world (F2'), not a route step. With transitivity at w the successor set of w is closed, so (with reflexivity at w) the subframe generated by w is Euclidean. Hence a view accepting F2' but rejecting global Euclidean access must, for modal truth at w, deny local axiom 4 at w, or reject Euclidean access only at worlds w cannot reach. No premise is established; both are OPEN frame conditions."

[[argument]]
id = "Surrogate controls for local versus global Euclidean access checked"
theorem = "controls"
premises = []
conclusion = "Surrogate controls locating local versus global Euclidean access"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit three-world frames, checked by case analysis"
meaning = "Witnesses that each escape route is realizable as a frame condition: clustered realizes F2' with local axiom 4 failing at actual (as the theorem forces once a successor is non-Euclidean); appendix realizes F2' and local axiom 4 at actual with global Euclidean access failing only at a world actual cannot reach. STRUCTURAL SURROGATES: no potentiality, representation, tolerance or impossible-world semantics is encoded."
