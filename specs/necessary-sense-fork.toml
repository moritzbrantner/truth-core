[[statement]]
id = "STMT-NECESSARY-SENSES-EXHAUSTIVE"
lean = "NecessarySensesExhaustive"
paraphrase = "OPEN coverage premise, attribution deferred: the route's intended reading of 'necessary being' is one of the enumerated senses (box-existence in K, actualist K, de dicto K, T, S4, KTB, S5; tertia via 'cannot not-be'; necessary per se). Exhaustiveness of the finite enum is free; that it lists every defensible reading is not provable in Lean and is attacked by proposing a further sense (logical necessity and Scott/Goedel essence-based necessary existence are recorded as left out)."
definitions = ["DEF-NECESSARY-IN-SENSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-SENSE-UNIQUE"
lean = "NecessarySenseUnique"
paraphrase = "OPEN exclusivity premise, attribution deferred: the route's intended reading selects exactly one enumerated sense. A constraint on the choice of reading, not a claim that the senses' extensions are disjoint (they are strength-ordered: S5 box-existence implies S4 implies T)."
definitions = ["DEF-NECESSARY-IN-SENSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-INTENDED-SENSE-SUPPORTED"
lean = "IntendedSenseSupported"
paraphrase = "OPEN premise, attribution deferred: the side condition of the intended sense holds: the frame condition for a T, S4, KTB or S5 reading; for the per se reading, that causes of necessity are actual concreta, that the necessitated depends on its cause, and that dependence between actual concreta is grounding; nothing for the K, actualist K, de dicto K and tertia via readings."
definitions = ["DEF-NECESSARY-IN-SENSE", "DEF-MODAL-FIXTURE-FRAME"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-ROOT-ON-INTENDED-READING"
lean = "NecessaryRootOnIntendedReading"
paraphrase = "Fork node: the intended reading of 'necessary' selects exactly one enumerated sense s, and there is an actual root n (concrete, existing at w, with no actual concrete ground) that is God, the one God (every God is n), and has the classical attributes that is necessary in sense s."
definitions = ["DEF-NECESSARY-IN-SENSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-SENSE-FORK-CONTROLS"
lean = "Control.Controls"
paraphrase = "Formal controls: (1) on any frame, box-existence gives actual existence under KT, necessary necessity under S4, E -> box-diamond-E under KTB, and possibly-necessary -> necessary under S5 (Kripke axiom theorems); (2) on a reflexive non-transitive chain box-existence holds and necessary necessity fails; on a non-reflexive step frame possibilist box-existence holds while the individual is absent at w; on a universal two-world frame de dicto 'necessarily something exists' holds while no individual is de re box-existent; (3) a box-existent individual that cannot not-be is not necessary per se when another causes its necessity; (4) a one-point model in which every sense's node and side condition hold and exactly one sense is intended. No model is claimed to describe reality."
definitions = ["DEF-NECESSARY-IN-SENSE", "DEF-MODAL-FIXTURE-FRAME", "DEF-NECESSARY-PER-SE"]
disambiguations = ["DISAMB-NECESSARY"]

