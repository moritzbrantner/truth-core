# Sense fork over "necessary" for the necessary-classical-God route
# (owner direction 2026-11-07). Map: explorations/necessary-sense-fork.toml.
# Analyst formulations, attribution deferred; every new non-control statement
# except the derived nodes is an OPEN premise.

[batch]
vocab = "TruthCore.Causality.NecessarySenseFork"
results = "TruthCore.Results.Causality.NecessarySenseFork"
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-ROOT-ACTUALIST-K"
lean = "NecessaryRootActualistK"
paraphrase = "Necessary-being node, actualist K reading: there is an actual root n (concrete, existing at w, with no actual concrete ground) that is God, the one God (every God is n), and has the classical attributes, and n exists at w and at every world accessible from w (Kripke box of 'n exists' at w, frame class K: no frame condition). The box is the route's own NecessaryAt, definitionally."
definitions = ["DEF-KANT-MODAL-NECESSITY", "DEF-NECESSARY-IN-SENSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-ROOT-BOX-K"
lean = "NecessaryRootBoxK"
paraphrase = "Necessary-being node, possibilist K reading: there is an actual root n (concrete, existing at w, with no actual concrete ground) that is God, the one God (every God is n), and has the classical attributes, and n exists at every world accessible from w (Kripke box of the atom 'n exists' at w, frame class K). Actual existence of n is not part of the necessity clause."
definitions = ["DEF-KANT-MODAL-NECESSITY", "DEF-NECESSARY-IN-SENSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-ROOT-DE-DICTO-K"
lean = "NecessaryRootDeDictoK"
paraphrase = "Necessary-being node, de dicto K reading: there is an actual root n (concrete, existing at w, with no actual concrete ground) that is God, the one God (every God is n), and has the classical attributes, and at every world accessible from w something exists (box of 'there is an existent', actualist inner quantifier). Necessity is attached to the proposition, not to n."
definitions = ["DEF-KANT-MODAL-NECESSITY", "DEF-MODAL-FIXTURE-FRAME", "DEF-NECESSARY-IN-SENSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
