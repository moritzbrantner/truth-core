[[statement]]
id = "Closeness of material origins is reflexive and symmetric"
lean = "NearIsTolerance"
paraphrase = "Rival framework commitment, unattributed (origin-tolerance account; attribution deferred): on a given assignment of origins to individuals at worlds, every origin is near itself, and if one origin is near another then the other is near the first. Transitivity is not assumed."
definitions = ["e4bc79ff-a54e-46b4-8562-070443885ead", "622524e2-e7f3-4b27-a644-bf9a4235121b"]
disambiguations = ["b2722186-d111-59aa-964f-443a173943d9"]

[[statement]]
id = "One world is possible relative to another iff every shared individual has near origins in them"
lean = "OriginDeterminesAccess"
paraphrase = "Rival framework commitment, unattributed (analyst reconstruction of the origin-tolerance account; attribution deferred): for all worlds w and v, v is accessible from w exactly when every individual existing at both w and v has near origins at w and at v. The only-if half is origin essentialism with tolerance (no accessible world gives an existing individual a far origin); the if half says origin closeness is the only constraint on access. Identity across worlds is rigid identity of the individual carrier; no counterpart relation."
definitions = ["e55472fe-cc19-44ea-b6f4-3aca2da49660", "622524e2-e7f3-4b27-a644-bf9a4235121b", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]
disambiguations = ["17f39c0f-1fda-56c8-ae1e-ba1a91a0848d"]

[[statement]]
id = "Every near variation of a concrete individual's origin is realised in an accessible world"
lean = "OriginPlenitude"
paraphrase = "Rival framework commitment, unattributed (origin-tolerance account; attribution deferred): for every world w, every concrete individual x existing at w and every origin o near the origin of x at w, some world accessible from w contains x with origin o."
definitions = ["7850cc2c-1e53-469a-ac21-87bbf1354b83", "622524e2-e7f3-4b27-a644-bf9a4235121b", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]
disambiguations = ["17f39c0f-1fda-56c8-ae1e-ba1a91a0848d"]

[[statement]]
id = "Some actual concrete individual has two possible origins that are not near each other"
lean = "VariedOriginAt"
paraphrase = "Rival framework commitment, unattributed (analyst origin-tolerance reconstruction; attribution deferred): some concrete individual existing at the selected world w also exists at two worlds accessible from w whose origins for that same individual are not near each other. The proof uses the separate OriginDeterminesAccess premise to conclude their access failure."
definitions = ["55f1e519-2cc8-4f56-ab4b-8a373e23276b", "622524e2-e7f3-4b27-a644-bf9a4235121b", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]
disambiguations = ["17f39c0f-1fda-56c8-ae1e-ba1a91a0848d"]

[[statement]]
id = "745d0d4c-71f3-4593-83eb-a719eeaf8912"
label = "Encoded origin-tolerance countermodel to the actual-world Euclidean inert arrival"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete, natural-number times. (1) Five worlds, two individuals a and b, origins on three offsets near iff they differ by at most one step: a has offsets -1, 0, +1 at aMinus, actual, plus; b has offsets 0, 0, -1, +1 at actual, plus, bMinus, bPlus; a is absent from bMinus and bPlus, b from aMinus; access fails only between aMinus and plus and between bMinus and bPlus. Closeness is a tolerance, access is determined by origin closeness, every near origin variation is realised, and a has non-near origins at two successors of actual. Actual accesses itself, presence-to-existence, inert emptiness and the possible contingent-free past at actual (witness plus, times 0 < 1) hold; Euclidean access at actual fails and no individual exists at actual and every world accessible from actual. (2) On the three-offset tolerance frame with one individual existing at every offset with that offset as origin, the same four origin commitments hold and that individual exists at actual and every accessible world. Statements about these finite interpretations only. Scope: faithful only to the encoded analyst commitments (rigid identity; access iff shared individuals have near origins, whose if-half remains OPEN; near-origin plenitude; one varied individual), with stipulated absences and a temporal profile not tied to origins. No counterpart, vague or kind-relative account or unrestricted recombination principle is certified. Individual deletion at actual and the stronger worldwise-deletion objection are evaluated separately in the linked attempt; neither is a conjunct of this certificate."
definitions = ["622524e2-e7f3-4b27-a644-bf9a4235121b", "e4bc79ff-a54e-46b4-8562-070443885ead", "e55472fe-cc19-44ea-b6f4-3aca2da49660", "7850cc2c-1e53-469a-ac21-87bbf1354b83", "55f1e519-2cc8-4f56-ab4b-8a373e23276b", "Euclidean access at the selected world only", "DEF-COUNT-TEMPORAL-HISTORY-PRESENCE", "Inert emptiness: a concrete-empty moment is followed only by concrete-empty moments", "Contingent concrete things absent at a moment and present at a later one"]
disambiguations = ["b2722186-d111-59aa-964f-443a173943d9", "17f39c0f-1fda-56c8-ae1e-ba1a91a0848d"]

[[argument]]
id = "Origin-determined access with a varied individual gives the tolerance rival"
theorem = "originToleranceNonEuclidean"
premises = ["Closeness of material origins is reflexive and symmetric", "One world is possible relative to another iff every shared individual has near origins in them", "Some actual concrete individual has two possible origins that are not near each other"]
conclusion = "Reflexive symmetric access with two successors of the selected world not mutually accessible"
axioms = []
rule = "biconditional elimination and introduction per world pair"
meaning = "Conditional bridge from the origin interface to the structural frame condition: reflexive and symmetric closeness plus access exactly when shared individuals have near origins gives reflexive and symmetric access. The same individual with non-near origins at two successors of w prevents access between those successors. The three listed premises therefore entail ToleranceNonEuclideanAt at w; OriginPlenitude is not needed. No converse or general representation theorem is claimed: the old surrogate having no origin interface does not by itself prove that no such interface can be supplied."

[[argument]]
id = "58e1e678-8df4-4d65-a6ec-76324ac55710"
label = "Encoded origin-tolerance countermodel checked"
theorem = "faithfulControls"
premises = []
conclusion = "745d0d4c-71f3-4593-83eb-a719eeaf8912"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit finite interpretations checked by case analysis"
meaning = "The five-world Control.faithful satisfies all four encoded origin commitments and every premise of ActualEuclidean.inertNecessaryConcrete except Euclidean access at actual, while that frame condition and the conclusion fail there. This is a nonvacuous countermodel to omission for exactly that bundle. Individual b is necessary relative to plus but absent from aMinus, which actual accesses and plus does not; individual a is contingent relative to plus. The separate restored conjunct checks one three-offset assignment with its only individual at every world, so the arrival conclusion holds there; it proves no general claim about restoring origins. Unregistered deduction from the existing earlierNecessary theorem: the temporal premises already require an individual necessary at the temporal witness and a distinct contingent individual, so those premises have no one-individual model. This does not render the existing two-individual model vacuous. Direct evaluation, not a new certificate conjunct: both actual individuals can be deleted separately at accessible worlds (a at bMinus, b at aMinus). Requiring such deletion at every world instead contradicts earlierNecessary under presence-to-existence, inert emptiness and the possible contingent-free past. That is incompatibility of a stronger bundle, not failure of this original model or independent warrant for the added deletion premise. Scope: faithful only to the encoded analyst commitments (rigid identity; access iff shared individuals have near origins, whose if-half remains OPEN; near-origin plenitude; one varied individual), with stipulated absences and a temporal profile not tied to origins. No counterpart, vague or kind-relative account or unrestricted recombination principle is certified. Individual deletion at actual and the stronger worldwise-deletion objection are evaluated separately in the linked attempt; neither is a conjunct of this certificate."

