[batch]
vocab = "TruthCore.Causality.OriginToleranceIdentity"
results = "TruthCore.Results.Causality.OriginToleranceIdentity"

[[statement]]
id = "Closeness of material origins is reflexive and symmetric"
lean = "NearIsTolerance"
paraphrase = "Rival framework commitment, unattributed (origin-tolerance account; attribution deferred): on a given assignment of origins to individuals at worlds, every origin is near itself, and if one origin is near another then the other is near the first. Transitivity is not assumed."
definitions = ["622524e2-e7f3-4b27-a644-bf9a4235121b"]

[[statement]]
id = "One world is possible relative to another iff every shared individual has near origins in them"
lean = "OriginDeterminesAccess"
paraphrase = "Rival framework commitment, unattributed (analyst reconstruction of the origin-tolerance account; attribution deferred): for all worlds w and v, v is accessible from w exactly when every individual existing at both w and v has near origins at w and at v. The only-if half is origin essentialism with tolerance (no accessible world gives an existing individual a far origin); the if half says origin closeness is the only constraint on access. Identity across worlds is rigid identity of the individual carrier; no counterpart relation."
definitions = ["622524e2-e7f3-4b27-a644-bf9a4235121b", "e55472fe-cc19-44ea-b6f4-3aca2da49660"]

[[statement]]
id = "Every near variation of a concrete individual's origin is realised in an accessible world"
lean = "OriginPlenitude"
paraphrase = "Rival framework commitment, unattributed (origin-tolerance account; attribution deferred): for every world w, every concrete individual x existing at w and every origin o near the origin of x at w, some world accessible from w contains x with origin o."
definitions = ["622524e2-e7f3-4b27-a644-bf9a4235121b"]

[[statement]]
id = "Some actual concrete individual has two possible origins that are not near each other"
lean = "VariedOriginAt"
paraphrase = "Rival framework commitment, unattributed (origin-tolerance account; attribution deferred): some concrete individual existing at the selected world w exists at two worlds accessible from w whose origins for it are not near each other (the possibly-possible-but-not-possible pattern carried by one individual)."
definitions = ["622524e2-e7f3-4b27-a644-bf9a4235121b"]

[[statement]]
id = "745d0d4c-71f3-4593-83eb-a719eeaf8912"
label = "Encoded origin-tolerance countermodel to the actual-world Euclidean inert arrival"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete, natural-number times. (1) Five worlds, two individuals a and b, origins on three offsets near iff they differ by at most one step: a has offsets -1, 0, +1 at aMinus, actual, plus; b has offsets 0, 0, -1, +1 at actual, plus, bMinus, bPlus; a is absent from bMinus and bPlus, b from aMinus; access fails only between aMinus and plus and between bMinus and bPlus. Closeness is a tolerance, access is determined by origin closeness, every near origin variation is realised, and a has non-near origins at two successors of actual. Actual accesses itself, presence-to-existence, inert emptiness and the possible contingent-free past at actual (witness plus, times 0 < 1) hold; Euclidean access at actual fails and no individual exists at actual and every world accessible from actual. (2) On the three-offset tolerance frame with one individual existing at every offset with that offset as origin, the same four origin commitments hold and that individual exists at actual and every accessible world. Statements about these finite interpretations only. Scope (semantic challenge 2026-11-10): faithful only to the encoded origin-tolerance commitments (rigid identity; Salmon-style access iff shared individuals have near origins, whose if-half is OPEN; near-origin plenitude; one varied individual), with stipulated absences (a from bMinus and bPlus, b from aMinus) and a stipulated temporal profile not tied to origins; model-witnessed for this finite encoding only. Not tested: counterpart, vague or kind-relative tolerance, or recombination/deletion plenitude."
definitions = ["Euclidean access at the selected world only", "622524e2-e7f3-4b27-a644-bf9a4235121b", "e55472fe-cc19-44ea-b6f4-3aca2da49660", "DEF-COUNT-TEMPORAL-HISTORY-PRESENCE", "Inert emptiness: a concrete-empty moment is followed only by concrete-empty moments", "Contingent concrete things absent at a moment and present at a later one"]

[[argument]]
id = "Origin-determined access with a varied individual gives the tolerance rival"
theorem = "originToleranceNonEuclidean"
premises = ["Closeness of material origins is reflexive and symmetric", "One world is possible relative to another iff every shared individual has near origins in them", "Some actual concrete individual has two possible origins that are not near each other"]
conclusion = "Reflexive symmetric access with two successors of the selected world not mutually accessible"
axioms = []
rule = "biconditional elimination and introduction per world pair"
meaning = "Bridge from the origin interface to the structural surrogate: if closeness of origins is reflexive and symmetric and access is exactly shared-origin closeness, access is reflexive and symmetric; and the individual with non-near origins at two successors of w makes those successors mutually inaccessible. So the origin-tolerance commitments entail the frame condition used by ToleranceOriginRival. Plenitude is not needed. The converse fails (the surrogate model has no origin interface)."

[[argument]]
id = "58e1e678-8df4-4d65-a6ec-76324ac55710"
label = "Encoded origin-tolerance countermodel checked"
theorem = "faithfulControls"
premises = []
conclusion = "745d0d4c-71f3-4593-83eb-a719eeaf8912"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit finite interpretations checked by case analysis"
meaning = "With the origin interface restored (varied origins of one rigidly identified individual, origin-determined access, origin plenitude), every premise of ActualEuclidean.inertNecessaryConcrete except Euclidean access at actual holds while its conclusion fails, so the tolerance rival survives Arrival A in this encoding. The countermodel needs two individuals: the individual necessary relative to the witness world plus (b) must be absent from a successor of actual that plus does not see (aMinus), and the varied individual a is contingent. Group 2 records that the surrogate's own three-offset pattern with the varied individual restored at all offsets does not give a countermodel: that individual exists at every successor of actual. Model claims concern these finite interpretations only; whether a world may lack an actual individual (b at aMinus, a at bMinus) is permitted, not required, by the encoded commitments. Two individuals: any countermodel to Arrival A needs two, already forced by its premises (an individual necessary at the witness world and one contingent there); under the if-half, additionally the successor lacking the necessary individual must be cut off by a second individual's far origin. On a one-individual carrier the arrival's premises are unsatisfiable, so it holds there only vacuously. Scope (semantic challenge 2026-11-10): faithful only to the encoded origin-tolerance commitments (rigid identity; Salmon-style access iff shared individuals have near origins, whose if-half is OPEN; near-origin plenitude; one varied individual), with stipulated absences (a from bMinus and bPlus, b from aMinus) and a stipulated temporal profile not tied to origins; model-witnessed for this finite encoding only. Not tested: counterpart, vague or kind-relative tolerance, or recombination/deletion plenitude."

