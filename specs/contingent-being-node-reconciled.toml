[[argument]]
id = "NO-NECESSARY-ACT-YIELDS-ALL"
label = "A CONTINGENT_1 actual being excludes an act at every accessible world strictly yielding all"
theorem = "noNecessaryActYieldsAll"
premises = ["c94b5446-e7e7-5b36-9bed-288959725526"]
conclusion = "STMT-NO-NECESSARY-ACT-YIELDS-ALL"
rule = "Theorem application (first clause of the simplicity-collapse core), existential elimination, negation introduction"
meaning = "By the first clause of the verified simplicity-collapse core (SIMPLICITY-COLLAPSE-CORE), an act token performed at every world accessible from w and strictly efficacious for x leaves x not contingent at w. If one token strictly yielded every actual concrete being, it would strictly yield the node's witness, which is contingent. So a necessary sufficient cause of all actual concreta is excluded on the route; the route's root may still be necessary if its act is not both performed at every accessible world and strictly efficacious for each creature (#462, #555). Without the node the rival holds (one-world frame). Reconciled interface: closed modal laws and correspondence certificates are imported and applied as verified theorems, not retained as assumptions; only the displayed node and frame schemas remain premises."

definitions = ["008cb21a-256c-5a90-822c-acd4591d699a", "01b44013-2db5-546c-a22e-06104e8e724c", "1b8baf77-84fa-5513-a138-7fa14840dd87", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "e36a3cf1-be2c-51a0-bb55-f388c115e11d"]
