[[argument]]
id = "NO-COLLAPSE-K"
label = "K sense: a CONTINGENT_1 actual being excludes actual modal collapse, by the K collapse law"
theorem = "notCollapsedK"
premises = ["c94b5446-e7e7-5b36-9bed-288959725526"]
conclusion = "STMT-ROUTE-NOT-COLLAPSED"
rule = "Theorem application (first K law: full collapse at w iff every accessible world is w), identity substitution, negation introduction"
meaning = "Frame class K (no frame condition). By the verified K collapse law (MODAL-K-LAWS), full collapse at w on the route's frame holds exactly when every world accessible from w is w. The node gives an accessible world lacking its witness; under collapse that world is w, where the witness exists. So the route's world is not collapsed. Without the node collapse holds (one-world frame). Reconciled interface: closed modal laws and correspondence certificates are imported and applied as verified theorems, not retained as assumptions; only the displayed node and frame schemas remain premises."

definitions = ["008cb21a-256c-5a90-822c-acd4591d699a", "1b8baf77-84fa-5513-a138-7fa14840dd87", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "f9a77a01-4dcf-5a1d-9bf7-a45a466ce504"]
axioms = ["propext", "Classical.choice", "Quot.sound"]

[[argument]]
id = "NO-NEC-COLLAPSE-T"
label = "KT sense: a CONTINGENT_1 actual being excludes necessary collapse, by the T schema and T law"
theorem = "notNecessarilyCollapsedT"
premises = ["cb456382-efd6-554b-8ee4-c8fc193f876a", "c94b5446-e7e7-5b36-9bed-288959725526"]
conclusion = "STMT-ROUTE-NOT-NEC-COLLAPSED"
rule = "Theorem application (T correspondence; T law: on reflexive frames necessary collapse gives actual collapse; NO-COLLAPSE-K), negation introduction"
meaning = "KT reading of NECESSARY_2. The OPEN T schema gives reflexivity of the route's frame by the T correspondence (MODAL-STANDARD-CORRESPONDENCE-CERTIFICATE); by the verified T law (MODAL-T-LAWS) necessary collapse at w then gives actual collapse at w, which NO-COLLAPSE-K excludes. Without the T schema the rival and the node hold together (step frame); without the node the rival holds (one-world frame). Reconciled interface: closed modal laws and correspondence certificates are imported and applied as verified theorems, not retained as assumptions; only the displayed node and frame schemas remain premises. The schema premise explicitly uses the modal fixture frame (NECESSARY_11) of the same Ontic whose individual box-existence is NECESSARY_2; this is the registered frame-to-individual semantic bridge, not an equivalence with a different metaphysical necessity."

definitions = ["008cb21a-256c-5a90-822c-acd4591d699a", "1b8baf77-84fa-5513-a138-7fa14840dd87", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "92b3450c-ba41-5363-b27b-ef0e943dd7c2", "97f37f5c-7f82-5077-9bb9-6cfc8673631d", "beb654a7-e204-5f4c-a7b4-45e886ba7109", "f8948e28-b13a-5244-95f1-41a05cd4fff2", "f9a77a01-4dcf-5a1d-9bf7-a45a466ce504"]

