rule = "Same-witness composition or explicit finite witness"
meaning = "Reuse sameSource without changing its five inputs, world, Ontic or candidate. Productivity supplies an actual outgoing edge for that same source at v; the existing direct-exercise concreteness dictionary at v classifies it. The same candidate already exists actually and necessarily at w. Seven open inputs, no establishment or original capability completion; no own-nature necessity bridge."


