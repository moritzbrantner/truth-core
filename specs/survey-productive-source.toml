[[statement]]
id = "Accessible source productivity"
lean = "ProductiveSources"
paraphrase = "Every existing uncaused candidate at each accessible world has an outgoing actual causal edge there. No source existence, concreteness, effect existence or sourcehood at the standpoint is asserted."
definitions = ["beb654a7-e204-5f4c-a7b4-45e886ba7109"]

[[statement]]
id = "Accessible direct exercise calibration"
lean = "AccessibleCausersConcrete"
paraphrase = "At every accessible world every actual outgoing cause is concrete under the same fixed predicate; this is an open calibration, not a definition of concrete."
definitions = ["beb654a7-e204-5f4c-a7b4-45e886ba7109", "d662ee50-cdd3-517b-bd8a-024dca5929d0"]

[[statement]]
id = "Productive source calibration omission controls"
lean = "Controls"
paraphrase = "Two finite omissions separately remove source productivity and causal concreteness calibration while the necessary-concrete conclusion fails; a joint populated witness satisfies both and the conclusion. All four original nonlogical source inputs hold by controlBackground, which is checked separately."
definitions = ["beb654a7-e204-5f4c-a7b4-45e886ba7109", "d662ee50-cdd3-517b-bd8a-024dca5929d0"]

[[argument]]
id = "Necessary concrete witness from productive accessible source"
theorem = "necessaryConcrete"
premises = ["ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "ef69a630-2277-56be-86ca-f05f8193093a", "62b4a40a-919e-5da4-998c-131c386b7361", "2b20b5af-d653-56ba-8001-35903fb3d1ea", "ec3f7cc9-a48b-5672-a09e-a652c3477348", "Accessible source productivity", "Accessible direct exercise calibration"]
