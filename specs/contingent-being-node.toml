disambiguations = ["DISAMB-KANT-CONTINGENCY"]

[[statement]]
id = "STMT-SOME-ACTUAL-CONTINGENT"
label = "Some actual CONCRETE_AND_ABSTRACT_6 being is CONTINGENT_1"
lean = "SomeActualContingentAt"
paraphrase = "OPEN premise, analyst formulation, attribution deferred: on the route's profile, some concrete individual exists at the selected world w and is absent at some world accessible from w (CONTINGENT_1, ContingentAt: accessible non-existence, not empirical change, CONTINGENT_2). It does not say which being is contingent, that the Cogito bearer is, that it is caused, or that every being other than the root is contingent. It implies STMT-COGITO-INHABITED-CONCRETE-WORLD and excludes concrete necessitarianism (STMT-ALL-ACTUAL-CONCRETE-NECESSARY) on the same frame; the converse of that exclusion needs excluded middle."
definitions = ["DEF-KANT-ONTOLOGICAL-MODEL", "DEF-KANT-MODAL-CONTINGENCY", "DEF-INHABITED-CONCRETE-WORLD", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "STMT-ALL-ACTUAL-CONCRETE-NECESSARY"
label = "Rival: every actual concrete being is NECESSARY_2 (concrete necessitarianism)"
lean = "EveryActualConcreteNecessaryAt"
paraphrase = "Rival (concrete necessitarianism, the modal-collapse family #462/#555), analyst formulation: every concrete individual existing at w exists at every world accessible from w (NECESSARY_2, NecessaryAt, the route frame's box of existence). It makes the route's grounding premise STMT-EVERY-CONTINGENT-GROUNDED-AT vacuously true (CONTINGENT-NODE-CONTROLS, Scope), so it is a rival of the contingency node, not of that premise."
definitions = ["DEF-KANT-ONTOLOGICAL-MODEL", "DEF-KANT-MODAL-NECESSITY"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-ROUTE-COLLAPSED"
label = "Rival: every truth at the route's world is NECESSARY_2 there (actual modal collapse)"
lean = "RouteCollapsedAt"
paraphrase = "Rival (Spinoza/Hume necessitarianism), analyst formulation: full modal collapse at w on the route's frame: every proposition true at w is true at every world accessible from w (the modal library's MC F allPredicates w, actual collapse). The box is the frame's Kripke box, the same box as NECESSARY_2."
definitions = ["DEF-MODAL-FIXTURE-MC", "DEF-MODAL-FIXTURE-FRAME", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-NECESSARY", "DISAMB-MODAL-K-COLLAPSE-MODES"]

[[statement]]
id = "STMT-ROUTE-NEC-COLLAPSED"
