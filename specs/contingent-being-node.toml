lean = "RouteNecessarilyCollapsedAt"
paraphrase = "Rival (necessary collapse), analyst formulation: full modal collapse (MC F allPredicates) holds at every world accessible from w on the route's frame. In frame class K it is compatible with an actual contingent being (CONTINGENT-NODE-CONTROLS, step frame); it is a rival of the contingency node on the KT reading of NECESSARY_2."
definitions = ["DEF-MODAL-FIXTURE-MC", "DEF-MODAL-FIXTURE-FRAME", "DEF-KANT-ONTOLOGICAL-MODEL"]
disambiguations = ["DISAMB-NECESSARY", "DISAMB-MODAL-K-COLLAPSE-MODES", "DISAMB-MODAL-T-COLLAPSE-MODES"]

