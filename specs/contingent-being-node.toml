[[statement]]
id = "STMT-CONTINGENT-NODE-CONTROLS"
label = "Finite models for the CONTINGENT_1 node and its modal-collapse refutations"
lean = "Control.Controls"
paraphrase = "Formal controls on hand-written Bool/Unit carriers: (1) nonvacuity: on a two-world universal frame with one being at both worlds and one only at world false, the node, the T, B and 5 schemas, the Cogito population node and the grounding premise hold, and every refutation conclusion holds; (2) omissions: on a one-world frame (node omitted) all schemas hold and every rival holds; on the step frame (every world accesses only true) the node holds while the T schema fails and collapse holds at every accessible world, and the B schema fails and collapse holds at some accessible world; on the reflexive frame false-le-true the node and the T schema hold, the B and 5 schemas fail and collapse holds at an accessible world; (3) scope: concrete necessitarianism makes STMT-EVERY-CONTINGENT-GROUNDED-AT true vacuously at every profile and world. No model is claimed to describe reality."
definitions = ["DEF-KANT-MODAL-CONTINGENCY", "DEF-MODAL-FIXTURE-MC", "DEF-MODAL-FIXTURE-FRAME", "DEF-MODAL-STANDARD-T-D-CORRESPONDENCE", "DEF-MODAL-HIJK-CONVERGENCE"]
disambiguations = ["DISAMB-KANT-CONTINGENCY", "DISAMB-NECESSARY"]

[[argument]]
id = "CONTINGENT-NODE-INHABITS"
label = "A CONTINGENT_1 actual CONCRETE_AND_ABSTRACT_6 being populates the route's world (Cogito node)"
theorem = "inhabits"
premises = ["STMT-SOME-ACTUAL-CONTINGENT"]
conclusion = "STMT-COGITO-INHABITED-CONCRETE-WORLD"
rule = "Existential elimination and introduction, conjunction elimination"
meaning = "Assembly (a weakening, not a substantive derivation): the contingency node's witness is concrete and exists at w, so the route's population node holds. It puts the node on the root path as an alternative derivation of STMT-COGITO-INHABITED-CONCRETE-WORLD; as an assembly it closes that node only if the contingency node is closed (invariant 16 fixpoint). It is registered as a strengthens relation (strong: the contingency node; weak: the population node); since 2026-11-12 a registration still counts for reach, so the node stays on the root path, while closure sets the argument aside and closes the weak version only by strength-order propagation. The converse fails (CONTINGENT-NODE-CONTROLS: on the one-world frame the world is inhabited and no being is contingent)."
transcription = "assembly"

