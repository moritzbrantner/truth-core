label = "A CONTINGENT_1 actual CONCRETE_AND_ABSTRACT_6 being excludes all being NECESSARY_2"
theorem = "notEveryNecessary"
premises = ["STMT-SOME-ACTUAL-CONTINGENT"]
conclusion = "STMT-NOT-ALL-ACTUAL-NECESSARY"
rule = "Existential elimination, universal instantiation, negation introduction"
meaning = "The node's witness exists at w and is absent at an accessible world, so it is not NECESSARY_2; hence not every actual concrete being is. The rival is the exact contradictory of the node, so this refutation uses no modal-library law; it records the incompatibility. It fails without the node (CONTINGENT-NODE-CONTROLS, one-world frame)."

