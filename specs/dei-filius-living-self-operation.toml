# Stage two of the modal spine: the Dei Filius attribute 'vivus' at the spine's
# root through the existing self-operation route (result
# PURE-ACT-LIVES-FROM-SELF-OPERATION, statement STMT-PURE-ACT-LIVES, LIVING_2)
# and one explicit sense bridge LIVING_2 -> LIVING_1 restricted to pure act, in
# place of the open bridge 'Whatever HAS_INTELLECT_1 is LIVING_1' (8d2ac441).
# The senses are not identified (disambiguation 1f2d3b9b). Analyst
# formulations, attribution deferred.
# Registers: the Dei Filius root endpoint (c0f4a346) by a second route that
# composes the registered deiFiliusRoot without its living bridge; controls on
# two-being interpretations, including the sense-mixing control.

[batch]
vocab = "TruthCore.Causality.DeiFiliusLivingSelfOperation"
results = "TruthCore.Results.Causality.DeiFiliusLivingSelfOperation"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whatever is in POTENCY_1 in no respect and is LIVING_2 is LIVING_1"
lean = "PureActLifeAtSomeTimeIsLiving"
paraphrase = "Open sense bridge, analyst formulation, unattributed: whatever is in potency in no respect (pure act) and whose life is present at some time of the duration frame (LIVING_2, LivesSomeTime) lives in the timeless sense (LIVING_1, the primitive Primitives.Lives of the Dei Filius attributes). Restricted to pure act: for a being in potency in some respect, life at one time need not be its life without a time index, since it may begin or cease; for a pure act, a beginning or end of life would be a change, which needs potency (q.9 a.1; compare STMT-LIFE-BOUNDARY-REQUIRES-POTENCY). That is its motivation, not a derivation: LIVING_1 stays primitive. Strictly weaker than the unrestricted bridge LifeAtSomeTimeIsLiving (Control.Controls part 4), which no argument uses. It does not identify the two senses."
definitions = ["f91f5056-8a32-416b-b234-d0e78cd16ce8", "885a98f3-cd54-41c5-89bc-25c341415890", "DEF-LIFE-PRESENT-AT", "a49e4cf1-ca4f-5519-9724-892af257cedb"]
disambiguations = ["1f2d3b9b-0b6b-459c-8871-3f136ad6d78a"]

[[statement]]
id = "Controls for the LIVING_2-to-LIVING_1 route at the Dei Filius root"
lean = "Control.Controls"
paraphrase = "Closed controls on interpretations with two beings (Bool), one respect and one time: (1) the time-indexed premise STMT-PURE-ACT-LIVES and the restricted sense bridge hold together and a pure act lives (LIVING_1); (2) sense-mixing control: STMT-PURE-ACT-LIVES holds, the sense bridge fails, and a pure act lives at some time (LIVING_2) without living (LIVING_1); (3) the bridge holds while STMT-PURE-ACT-LIVES fails and a pure act does not live; (4) the restricted bridge holds while the unrestricted LifeAtSomeTimeIsLiving fails; (5) the restricted bridge and STMT-PURE-ACT-LIVES hold while 'Whatever HAS_INTELLECT_1 is LIVING_1' fails. Statements about these interpretations only."
definitions = ["f91f5056-8a32-416b-b234-d0e78cd16ce8", "885a98f3-cd54-41c5-89bc-25c341415890"]
disambiguations = ["1f2d3b9b-0b6b-459c-8871-3f136ad6d78a"]

