  { term = "NONNECESSARY_VERSUS_CONTINGENT_ROOT", from = "cf6a8bb9-2a70-4e90-86bd-06f69106da2f", to = "9f9108e2-3cc3-45dd-be1d-d8fdaaced708", statement_id = "STMT-EXCLUDED-MIDDLE" },
]
conclusion = "STMT-NECESSARY-CONCRETE-UNDERIVED-AT"
axioms = []
rule = "Composition of necessaryActualRootOfGrounded with coverage"
meaning = "An alternative to NecessaryConcreteUnderived.checks without J1 (no contingent concrete support), J2 (well-founded union) or reflexive access. The existing necessaryActualRootOfGrounded gives one concretum that is necessary from w and has no concrete ground existing at w. Coverage then excludes an existing concrete supporter of it at every admitted world. In the proof the witness is that actual necessary root; the Lean conclusion states only that some such concretum exists. Underived means no existing concrete supporter at any admitted world, not absence of every explanation. Conditional consequence only; no premise is established."

