  { term = "WELL_FOUNDEDNESS_OF_THE_SELECTED_RELATION", from = "2f42c0e7-46ae-4e2b-9ac4-95dcb865da61", to = "f4609d52-a878-4d09-9af3-083b1945770c", statement_id = "STMT-ACTUAL-GROUNDING-WF" },
  { term = "NONNECESSARY_VERSUS_CONTINGENT_ROOT", from = "cf6a8bb9-2a70-4e90-86bd-06f69106da2f", to = "9f9108e2-3cc3-45dd-be1d-d8fdaaced708", statement_id = "STMT-ACTUAL-GROUNDING-WF" },
]
conclusion = "STMT-NECESSARY-CONCRETE-UNDERIVED-AT"
axioms = []
rule = "Well-founded induction over actual grounding among actual necessary concreta, constructive core, then excluded middle"
meaning = "An alternative to the stage-one join NecessaryConcreteUnderivedFromNecessity.underived that replaces reflexive access and J2 (well-founded cross-world union) by well-founded actual grounding at w and coverage. From a necessary concretum, descend actual grounding among concreta existing at w and necessary from w: a supporter of such a concretum at any admitted world gives, by coverage, a concrete supporter existing at w, which J1 (used only at w) makes necessary, so a minimal one has no existing concrete supporter at any admitted world. The witness may differ from the given necessary concretum. Conditional consequence only; no premise is established."

[[argument]]
id = "Coverage, from reflexive access, no contingent support and no novel edge"
theorem = "coverageOfNoContingentNoNovel"
premises = ["STMT-ACTUAL-MODAL-REFLEXIVITY", "STMT-NO-CONTINGENT-CONCRETE-SUPPORT", "STMT-NO-NOVEL-NECESSARY-SUPPORT"]
sense_bridges = [
  { term = "WORLD_RELATIVE_EXISTENCE_METAPHYSICAL_ESSE_NECESSITY", from = "2e064a7b-b29f-4f0b-8978-782674012d86", to = "57356a7a-ed0a-478f-abfc-2d47dd631135", statement_id = "STMT-ACTUAL-MODAL-REFLEXIVITY" },
]
conclusion = "A NECESSARY_2 concretum supported anywhere is supported by an actual concretum"
axioms = []
rule = "Direct: the supporter elsewhere is necessary by J1, exists at w by reflexive access, and its edge holds at w by no novel edge"
meaning = "Coverage is no stronger than the package of reflexive access at w, no contingent concrete support (J1) and the one-way no-novel-edge condition on the concrete subtype: the same supporter covers the target at w. It is strictly weaker: in the rooted-pair control coverage holds while the no-novel-edge condition fails. Conditional consequence only."

[[argument]]
id = "Coverage, from same-supporter presence"
theorem = "coverageOfSupportIsPresent"
premises = ["STMT-NECESSARY-SUPPORT-IS-PRESENT"]
sense_bridges = [
