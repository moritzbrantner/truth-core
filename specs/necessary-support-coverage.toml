]
conclusion = "A NECESSARY_2 concretum supported anywhere is supported by an actual concretum"
axioms = []
rule = "Direct: the supporter found elsewhere is itself present and supporting at w"
meaning = "Coverage follows from the existing open premise that whatever supports a being necessary from w, at a world where it exists, also exists at w and supports it at w. Coverage is strictly weaker on its concrete domain: in the rooted-pair control coverage holds while same-supporter presence fails. Registered as a strength order (presence strengthens coverage); its existing consumer records why it needs the stronger premise. Conditional consequence only."

[[argument]]
id = "Rotating triangle, rooted pair and uncovered edge controls, checked"
theorem = "controls"
premises = []
conclusion = "Rotating triangle, rooted pair and uncovered edge: controls for well-founded necessary support"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Three explicit finite interpretations, checked by case analysis and rank functions"
meaning = "Controls for J2 and its rival. The rotating triangle shows that well-founded support at every world together with the negation of the mutual-support rival yields neither J2 nor the join's endpoint: a three-step cross-world cycle survives. The rooted pair shows that the mutual-support rival is compatible with the join's endpoint, every other premise of NecessaryConcreteUnderived.checks and coverage, so J2, the no-novel-edge condition and same-supporter presence are each stronger than the endpoint needs. The uncovered edge shows that J1 and J2 with the other premises imply neither coverage nor the no-novel-edge condition. Model-witnessed only; no interpretation is claimed metaphysically possible. Excluded middle is supplied by Lean's classical axioms."

