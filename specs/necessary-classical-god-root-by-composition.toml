meaning = "Sibling of the act-priority-at-first composition (NecessaryClassicalGodRootAtFirst.derive, argument 69affa96) with the OPEN composition premise d8024a38 (whatever is in act in being and in POTENCY_2 in some respect is composite, ActInBeingAndPotencyMakeComposite) in place of act priority at a first being (61ad11f3) and same-respect non-overlap (c6d6379b). On ONE signature carrier, Profile m, world w, q.3 a.4 profile p and predicate dictionary, the same 21 other premises with the same parameters give NecessaryClassicalGodRootAt: some n that is an actual root at w, the only actual root at w, NecessaryAt at w (NECESSARY_2), maximal in being and perfect, with represented esse/essence identity, firstness, no matter-form composition, remoteness from all, the signature IsGod (GOD_4), the nine case attributes and the primitive classical field. Lean: UnderivedRootPerfection.derive and PerfectRootPositiveIntellectWill.derive as in the registered composition, then the ClassicalGodFromPositiveRoot assembly restated in a local helper whose only change is the root's pure actuality: n exists at w, so by ExistingInActAt (already a premise) it is in act in the esse respect; if it were in POTENCY_2 in some respect r, the composition premise would make it composite, against its simplicity, which the positive root already derives from the uniting-cause premise and EsseCauseIsActualConcreteGround. The same Composite parameter (SIMPLE_4) occurs in the uniting-cause premise, the matter-form/esse-essence premise, the composition premise and IsSimple Composite in the conclusion; the same free InPotency parameter (POTENCY_2) occurs in the composition premise, the eternity premise and the conclusion. Firstness is not used for pure actuality. The naming premise is the declared GOD_1 to GOD_4 sense bridge, as in the registered composition. Conditional consequence only; no premise, source reading or root truth is established, and the composition premise is concluded only conditionally (from its unrestricted version 3d99779b)."
