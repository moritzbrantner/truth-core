[[argument]]
id = "Lasting ground (A2ab) from CAUSE_OF_BEING_2 sustaining causes and contact"
theorem = "lastingGroundOfSustainingCauses"
premises = ["A concrete thing that begins to be present has a concrete CAUSE_OF_BEING_2 sustaining cause", "Every CAUSE_OF_BEING_2 sustaining cause of a thing is a ground of it", "Whatever gives a thing being at a moment is present at that moment"]
conclusion = "A concrete thing that begins to be present has a concrete ground present at its absence or later"
senses = {CAUSE_OF_BEING = "CAUSE_OF_BEING_2"}
axioms = []
rule = "The sustaining cause gives the thing being at the later moment; contact puts it there"
meaning = "New non-transcription conditional support option for premise A2ab (lasting ground) of Arrival A. Let a concrete x be absent at s and present at t > s in history v. It has a concrete sustaining cause g (CAUSE_OF_BEING_2), which gives x being at every moment x is present, in particular at t; by the contact principle g is present at t, which is after s; and g is a ground of x. No condition on the order of time (any preorder), on first moments or on convexity is used. Each premise is needed in a checked interpretation: without the sustaining-cause premise (Control part 3), without sustainers-are-grounds (part 5), without the contact principle (part 2); all hold nonvacuously with A2ab (part 7). Existential inertia rejects the sustaining-cause premise; it need not reject A2ab, which also has the originating route. All premises stay OPEN. No premise is established."

[[argument]]
id = "Lasting ground (A2ab) from CAUSE_OF_BEING_1 originating causes, contact and no return"
theorem = "lastingGroundOfOriginatingCauses"
premises = ["A concrete thing that begins to be present has a concrete CAUSE_OF_BEING_1 originating cause", "Every CAUSE_OF_BEING_1 originating cause of a thing is a ground of it", "Whatever gives a thing being at a moment is present at that moment", "A concrete thing present at two moments is present at every moment between them", "Any two moments of time are comparable"]
conclusion = "A concrete thing that begins to be present has a concrete ground present at its absence or later"
senses = {CAUSE_OF_BEING = "CAUSE_OF_BEING_1"}
axioms = []
rule = "Trichotomy of the first moment of presence against the absence, with convexity excluding an earlier first moment"
meaning = "New non-transcription conditional support option for premise A2ab (lasting ground) of Arrival A. Comparability of moments (linear time) is an explicit open premise, not a type-class restriction, so the route covers every model in which it holds. Let a concrete x be absent at s and present at t > s. It has a concrete originating cause g (CAUSE_OF_BEING_1): x has a first moment b of presence and g gives it being at b, so by contact g is present at b. By comparability b is before s, equal to s or after s. b is not s (x is absent at s); b is not before s, since x would then be present at b and t and absent at s between them, against convexity; so b is after s, and g is a ground of x present after s. No sustaining causation is used: this route is open to an existential-inertia theorist who grants originating causes, contact and no return. The originating premise requires a first moment of presence for every beginning thing. Convexity is needed: intermittent presence satisfies the other premises and falsifies A2ab (Control part 6); all premises hold nonvacuously with A2ab (part 7). Whether comparability is needed is not checked. All premises stay OPEN. No premise is established."

[[argument]]
id = "Sustaining-causation controls checked"
theorem = "controls"
premises = []
conclusion = "Sustaining-causation controls: rival reading, omissions and nonvacuity"
axioms = ["propext", "Classical.choice", "Quot.sound"]
sense_mixing_control = true
rule = "Explicit one-world, two-individual interpretations over natural-number times, checked by case analysis and linear arithmetic"
meaning = "The originating reading of the cause of being (existential inertia) does not give presence to all, while it is compatible with A2ab through the originating route; each premise of the IMMENSE_2 presence route and of the sustaining lasting-ground route is needed in one interpretation; for the originating lasting-ground route only convexity is shown needed (part 6), and the need of its other premises is not checked; all premises hold together with the conclusions in one interpretation. A finite countermodel shows a premise is needed in that interpretation, not that it is false. Model claims concern these interpretations only."

