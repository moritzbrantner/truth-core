id = "Act and potency make composite strengthens its restriction to act in being"
subject_kind = "statement"
subject_id = "Whatever is in act in some respect and in POTENCY_2 in some respect is composite"
predicate = "strengthens"
object_kind = "statement"
object_id = "Whatever is in act in being and in POTENCY_2 in some respect is composite"
verification_result_id = "In act in being and in POTENCY_2 makes composite, from the unrestricted version"
strictness_result_id = "Theta.8 controls: heavenly first, contingent first, idle uncaused composite, checked"
