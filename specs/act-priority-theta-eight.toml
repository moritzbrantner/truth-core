# Act's priority at a first being from Metaphysics Theta.8, analyst
# reconstructions with attribution deferred. Asks which Theta.8 priority of act
# (in definition, in time, in substance) gives the q.3 a.1 conclusion that a
# first being is in potency in no respect, or the composition route's analyst
# premises (8288ff1e, 3d99779b), and from what. Definition: no derivation (built
# into the respect typing). Time: vacuous at idle potencies (earlier attempts).
# Substance, the eternal (1050b6-19): gives 8288ff1e from first-being
# incorruptibility, and with a composition premise restricted to act in being
# the q.3 a.1 conclusion. Substance, potency for the sake of act (1050a4-b2),
# with the tertia via's plenitude premise: the q.3 a.1 conclusion with no
# composition premise. Controls: heavenly first being, contingent first being,
# restriction strictness, an idle uncaused composite first being surviving all
# premises except the cause of composites and plenitude, omissions.

[batch]
vocab = "TruthCore.Causality.ActPriorityThetaEight"
results = "TruthCore.Results.Causality.ActPriorityThetaEight"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Every first being is INCORRUPTIBLE_SIMPLY_1: it cannot fail to be in being"
lean = "FirstBeingIsIncorruptibleSimply"
paraphrase = "Open premise, analyst formulation, unattributed: every first being (no being other than it is simply prior to it) is simply incorruptible: it cannot fail to be in the respect of being (esse). Metaphysics Theta.8, 1050b16-19 (the eternal is prior in substance; the necessary beings are first) is orientation only. It says nothing about failing to be in a place, quantity or quality. Its denial is a contingent first being."
definitions = ["DEF-INCORRUPTIBLE-SIMPLY", "DEF-FIRST-BEING", "DEF-SIMPLE-PRIORITY", "DEF-RESPECT"]
disambiguations = ["DISAMB-CORRUPTIBLE-SIMPLY-OR-IN-A-RESPECT"]

[[statement]]
id = "Whatever is in act in being and in POTENCY_2 in some respect is composite"
lean = "ActInBeingAndPotencyMakeComposite"
paraphrase = "Open premise, analyst formulation, unattributed: whatever is in act in the respect of being and in potency in some respect is composite. The instance at the respect of being of 'whatever is in act in some respect and in POTENCY_2 in some respect is composite' (3d99779b), which strictly strengthens it; given that whatever is in act in some respect is in act in being (STMT-ACTUALITY-ONLY-INSOFAR-AS-BEING) the two are equivalent. InPotency is the free POTENCY_2 parameter; Composite is the inclusive SIMPLE_4 sense."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-SIMPLE", "DEF-RESPECT"]

[[statement]]
id = "Whatever is in POTENCY_2 in a respect at some time can be in act in it"
lean = "PotencyMakesActPossible"
paraphrase = "Open premise, analyst formulation, unattributed: whatever is in potency in a respect at some time can be in act in that respect, that is, the condition on times 'x is in act in r' is possible in the supplied sense of the tertia via's plenitude reading (STMT-PLENITUDE-OVER-INFINITE-PAST). A potency is a potency for its act (Metaphysics Theta.3, 1047a24-26; Theta.8, 1049b12-17, orientation only). InPotencyAt is the free POTENCY_2 parameter at each time."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-TEMPORAL-EXISTENCE-BEGINNING"]

[[statement]]
id = "What was in act in a respect and later is in POTENCY_2 in it has another efficient cause"
lean = "ActThenPotencyHasAnotherCause"
paraphrase = "Open premise, analyst formulation, unattributed: whatever was in act in a respect at an earlier time and is in potency in that respect at a later time has an efficient cause other than itself, in some respect. With same-respect non-overlap the later potency is a loss of the act, a change, and the premise extends 'whatever is moved is moved by another' to that change; without non-overlap it also covers a being that keeps the act and gains the potency. Efficient causation is not time-indexed: c efficiently causes x in s at some time."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-TEMPORAL-EXISTENCE-BEGINNING"]

[[statement]]
id = "Theta.8 controls: heavenly first, contingent first, idle uncaused composite"
lean = "Control.Certificate"
paraphrase = "Closed controls. (1) Heavenly first being: over Bool beings and Bool respects (true being, false a place), every potency of the contradictory, the simply incorruptible in act in substance, first beings simply incorruptible and in act in some respect, and non-overlap hold while a first being is in potency to a place, so act priority at a first being fails. (2) Contingent first being: every first being is in act in some respect while none is simply incorruptible. (3) A being in act in a place but not in being, in potency in being and simple, satisfies the restricted composition premise and falsifies both the unrestricted one and 'whatever is in act in some respect is in act in being'. (4) Idle uncaused composite first being: with Int times, now 0, one interpretation satisfies every premise of the three routes to the q.3 a.1 conclusion except the cause of composites and plenitude, with a first being composite, uncaused and in potency to a place at every time, never actualized. (5) Each of the six premises of the Theta.8 composition route and each of the five premises of the plenitude route is needed (omission models), and the plenitude route is not vacuous. (6) For every carrier: the composition premise gives its restriction to act in being; with STMT-ACTUALITY-ONLY-INSOFAR-AS-BEING the restriction gives it back, and 'every first being is in act in some respect' gives that every first being is in act in being. Statements about these interpretations and implications only."
definitions = ["DEF-ACT", "DEF-INDEPENDENT-POTENCY", "DEF-SIMPLE-PRIORITY", "DEF-FIRST-BEING", "DEF-SIMPLE", "DEF-INCORRUPTIBLE-SIMPLY", "DEF-TEMPORAL-EXISTENCE-BEGINNING"]
disambiguations = ["DISAMB-CORRUPTIBLE-SIMPLY-OR-IN-A-RESPECT"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Every first being is in act in some respect, from Theta.8 incorruptibility"
theorem = "inActOfIncorruptible"
premises = ["Every first being is INCORRUPTIBLE_SIMPLY_1: it cannot fail to be in being", "STMT-INCORRUPTIBLE-IS-IN-ACT-IN-SUBSTANCE"]
conclusion = "Every first being is in act in some respect"
axioms = []
rule = "Instantiation at a first being, then existential introduction at the respect of being"
meaning = "A first being cannot fail to be (open analyst premise); whatever is simply incorruptible is in act in substance (In Metaph. IX lect. 9 n. 5-6 reading, d017b6b0); so a first being is in act in the respect of being, hence in some respect. A support option for 8288ff1e, not a weaker warrant: Control.ContingentFirst shows that 8288ff1e does not imply first-being incorruptibility, so the new premise is strictly more committal against the contingent-first-being rival. Conditional consequence only; no premise is established."

[[argument]]
id = "In act in being and in POTENCY_2 makes composite, from the unrestricted version"
theorem = "restrictedOfComposition"
premises = ["Whatever is in act in some respect and in POTENCY_2 in some respect is composite"]
conclusion = "Whatever is in act in being and in POTENCY_2 in some respect is composite"
axioms = []
rule = "Instantiation of the act respect at being"
meaning = "The composition premise 3d99779b, instantiated at the respect of being, gives its restriction to beings in act in being. Registered as a strength order; Control.RestrictedStrict makes it strict, in an interpretation that also falsifies STMT-ACTUALITY-ONLY-INSOFAR-AS-BEING, and Control.Facts shows the two are equivalent given that premise. An instance, not a new derivation."

[[argument]]
id = "A first being is in POTENCY_2 in no respect, from Theta.8 incorruptibility"
theorem = "firstBeingNoPotencyOfThetaEight"
premises = ["Every first being is INCORRUPTIBLE_SIMPLY_1: it cannot fail to be in being", "STMT-INCORRUPTIBLE-IS-IN-ACT-IN-SUBSTANCE", "Whatever is in act in being and in POTENCY_2 in some respect is composite", "STMT-COMPOSITE-HAS-A-UNITING-CAUSE", "STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT", "STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT"]
sense_bridges = [
  { term = "UNITING_CAUSE_VERSUS_EFFICIENT_CAUSE", from = "2478812d-d2cd-4182-8ad0-d27a4bdb9ff2", to = "018d4f0a-2276-42a7-b20d-b0fe6c9c3714", statement_id = "STMT-PERFECTION-CAUSING-IN-ANOTHER-IS-EFFICIENT" },
]
conclusion = "STMT-FIRST-BEING-IS-IN-NO-WAY-IN-POTENCY"
axioms = []
rule = "Reductio at the supposed first being, composing firstBeingNoPotencyOfComposition with act read as act in being"
meaning = "A first being cannot fail to be, so (In Metaph. IX lect. 9 reading) it is in act in being; if it were in potency in some respect it would, being in act in being, be composite; so it would have a cause of its being other than itself (ST I q.3 a.7 reading), which by the bridge causes it efficiently and so is simply prior to it (ST I q.2 a.3 reading), against firstness. Composes the existing firstBeingNoPotencyOfComposition, with the act predicate read as act in being. Replaces 8288ff1e and 3d99779b by first-being incorruptibility, the sourced reading d017b6b0 and the weaker restricted composition premise; shares the other three premises. Each of the six premises is needed (Control.ThetaEightOmissions). The Theta.8 substance premises without a composition premise do not reach the weak version (Control.HeavenlyFirst). Conditional consequence only; no premise is established."

[[argument]]
id = "A first being is in POTENCY_2 in no respect now, from plenitude"
theorem = "firstBeingNoPotencyOfPlenitude"
premises = ["STMT-PLENITUDE-OVER-INFINITE-PAST", "STMT-PAST-IS-INFINITE", "Whatever is in POTENCY_2 in a respect at some time can be in act in it", "What was in act in a respect and later is in POTENCY_2 in it has another efficient cause", "STMT-EFFICIENT-CAUSE-IS-PRIOR-TO-EFFECT"]
conclusion = "STMT-FIRST-BEING-IS-IN-NO-WAY-IN-POTENCY"
axioms = []
rule = "Reductio at the supposed first being: potency now gives possible act, plenitude a past act, the change an external efficient cause, the cause priority, against firstness"
meaning = "An analyst reconstruction of Theta.8's priority in substance of act as the end of potency (1050a4-b2), read with the tertia via's plenitude premise: a first being in potency in a respect now can be in act in it; given an infinite past, whatever is possible was realized at some earlier time, so the first being was once in act in that respect; whatever was in act in a respect and is later in potency in it has an efficient cause other than itself, which is simply prior to it (ST I q.2 a.3 reading), against firstness. The conclusion is the q.3 a.1 conclusion with potency taken at the time now. It uses no composition premise and no cause of composites; it shares only efficient-cause priority with the composition routes. Each of the five premises is needed and the route is not vacuous (Control.PlenitudeOmissions). Conditional consequence only; no premise is established."

[[argument]]
id = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being, from pure actuality"
theorem = "weakOfNoPotency"
premises = ["STMT-FIRST-BEING-IS-IN-NO-WAY-IN-POTENCY"]
conclusion = "Act is SIMPLY_PRIOR_1 to POTENCY_2 at a first being"
axioms = []
rule = "A first being in potency in no respect satisfies first-being act priority vacuously"
meaning = "If every first being is in potency in no respect, then whatever first being is in potency in a respect (none is) is simply posterior to a being in act in that respect. Registers the existing Control.Facts item 3 of ActPriorityAtFirst as an argument, so that every derivation of the q.3 a.1 conclusion (composition, Theta.8, plenitude, act priority) also supports the first-being version. Given non-overlap the two are equivalent. Conditional consequence only; no premise is established."

[[argument]]
id = "Theta.8 controls: heavenly first, contingent first, idle uncaused composite, checked"
theorem = "controls"
premises = []
conclusion = "Theta.8 controls: heavenly first, contingent first, idle uncaused composite"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit finite and Int-timed interpretations checked by case analysis, decide and omega, and general implications"
meaning = "Controls for the Theta.8 routes. HeavenlyFirst: the Theta.8 substance premises leave a first being in potency to a place. ContingentFirst: 8288ff1e does not imply first-being incorruptibility. RestrictedStrict and Facts: the restricted composition premise is strictly weaker, and equivalent given STMT-ACTUALITY-ONLY-INSOFAR-AS-BEING. IdleUncausedComposite: an interpretation satisfies every premise of the composition, Theta.8 and plenitude routes except the cause of composites and plenitude, with a composite, uncaused first being in potency to a place it never actualizes; so a rival who keeps a first being with an unactualized potency must reject at least the cause of composites (or a composition premise or first-being act) and at least one plenitude-route premise. ThetaEightOmissions and PlenitudeOmissions: each premise of both new routes is needed; the plenitude route has a nonvacuous witness. Model-witnessed and general implications only; no interpretation is claimed metaphysically possible."

