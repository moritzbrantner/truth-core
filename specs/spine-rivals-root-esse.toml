# Rivals and survival tests for twelve spine premises (regress/root, act-of-being
# bridges, join). Analyst formulations, attribution deferred. No premise of any
# route is derived, added or removed: rival statements and control certificates only.

[batch]
vocab = "TruthCore.Causality.SpineRivalsRootEsse"
results = "TruthCore.Results.Causality.SpineRivalsRootEsse"

# ---------------------------------------------------------------- rivals

[[statement]]
id = "Something exists at the selected world and nothing existing there is CONCRETE_6"
lean = "OnlyNonConcreteExistAt"
paraphrase = "Rival framework commitment, unattributed (motivated by abstract-only ontologies such as mathematical-structure monism): some candidate exists at the selected world w, and no candidate existing at w is concrete. It is not the empty world and does not say that concrete things are impossible."
definitions = ["Abstract-only population of the selected world", "DEF-INHABITED-CONCRETE-WORLD", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "The actual CONCRETE_6 roster is inhabited and every member has an actual CONCRETE_6 ground"
lean = "BottomlessActualGroundingAt"
paraphrase = "Rival framework commitment, unattributed (motivated by metaphysical infinitism and coherentism about dependence): some concrete candidate exists at w, and every concrete candidate existing at w has a concrete ground existing at w under the selected relation at w. It does not say whether the grounding descends without end or runs in a circle, and says nothing about non-concrete or absent grounds."
definitions = ["Bottomless actual concrete grounding at the selected world", "DEF-WHOLE-ROSTER-NOT-TRAPPED", "DEF-ACTUAL-CONCRETE-GROUND-ANCESTRY", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-ACTUAL-VS-WHOLE-CARRIER-WF", "DISAMB-REGRESS-DOMAINS", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Some actual CONCRETE_6 individual is contingent and has no actual CONCRETE_6 ground"
lean = "TruthCore.Causality.NecessaryRootFork.ContingentRootAt"
paraphrase = "Rival framework commitment, unattributed (motivated by brute-fact views of contingent reality; existential inertia, as Schmid states it, denies concurrent sustenance and may not be this rival; whether earlier existence counts as a ground under the selected relation is open): some concrete candidate exists at w, has no concrete ground existing at w under the selected relation at w, and is absent from some world accessible from w. An abstract, absent or unmodelled explanation is not excluded."
definitions = ["Contingent actual root: a brute contingent foundation", "DEF-BRUTE-ROOT-RELATIVE-GROUNDING", "DEF-KANT-MODAL-CONTINGENCY", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-NECESSARY-INDIVIDUAL-SCOPE", "DISAMB-NONNECESSARY-VS-CONTINGENT-ROOT", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Some maximum in being leaves the being of another being to a third cause"
lean = "SomeMaximumLeavesBeingToAnother"
paraphrase = "Rival framework commitment, unattributed (motivated by eminence without universal efficient causation: a highest being as exemplar or final cause only): for some m, x and c, m is in act in esse and nothing is more in esse than m; x is other than m and in act in esse; m does not cause x's esse; and c, other than both m and x, causes x's esse. It does not say that there is no maximum or that the maximum causes nothing."
definitions = ["Idle maximum in being: another cause gives being where the maximum does not", "DEF-MAXIME-ENS", "DEF-CAUSE-OF-PERFECTION"]
disambiguations = ["DISAMB-CAUSE"]

[[statement]]
id = "Something exists at the selected world and no existent there is in act in esse"
lean = "ExistenceWithoutActOfBeingAt"
paraphrase = "Rival framework commitment, unattributed (motivated by the thin, quantificational conception of existence): something exists at the selected world w, and nothing existing at w is in act in the supplied esse respect. It does not deny that things exist and says nothing about act in other respects."
definitions = ["Thin existence: existents of the selected world have no act of being", "DEF-EXISTING-IN-ACT-AT", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ACT", "DEF-ESSE"]
disambiguations = ["DISAMB-EXISTENCE-ESSE-SUPPORT", "DISAMB-IN-ACT"]

[[statement]]
id = "Some actual concretum has a distinct existing cause of its esse that is not CONCRETE_6"
lean = "SomeEsseCauseNonConcrete"
paraphrase = "Rival framework commitment, unattributed (motivated by Platonic Forms or governing laws as causes of being): for some distinct c and x, x is concrete and exists at w, c causes x's esse, c exists at w, and c is not concrete. Whether the selected relation holds between c and x is left open."
definitions = ["Non-concrete cause of an actual concretum's esse", "DEF-ESSE-CAUSE-IS-ACTUAL-CONCRETE-GROUND", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-ESSE", "DEF-CAUSE-OF-PERFECTION", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-EXISTENCE-ESSE-SUPPORT", "DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Some pair compares in esse and every individual in act in esse is exceeded by one in act"
lean = "EveryActualGradeExceededAtBeing"
paraphrase = "Rival framework commitment, unattributed (motivated by open-ended hierarchy: more and less without a most): some pair compares in the supplied esse respect, and for every individual in act in esse some individual in act in esse is more in esse than it. No order laws on the comparative are assumed."
definitions = ["Unbounded grades of being: every actual grade is exceeded by an actual one", "DEF-GRADES-TO-MAXIMUM-AT-BEING", "DEF-MORE-IN", "DEF-MAXIME-ENS"]
disambiguations = ["DISAMB-BEING-UNIVOCITY", "DISAMB-IN-ACT"]

[[statement]]
id = "Some universal cause of esse leaves an actual perfection of its effect to a secondary cause"
lean = "UniversalCauseLeavesPerfectionToSecondary"
paraphrase = "Rival framework commitment, unattributed (motivated by mere conservationism): for some c, x, r and d, c causes the esse of every other thing in act in esse; x is other than c and c causes x's esse; x is in act in r; c does not cause x's being r; and d, other than c, causes x's being r. It is neither occasionalism nor concurrentism."
definitions = ["Mere conservation: a universal cause of esse leaves a perfection to a secondary cause", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "DEF-ACT", "DEF-RESPECT", "DEF-UNIVERSAL-ESSE-CAUSE-SCOPE"]
disambiguations = ["DISAMB-CAUSE", "DISAMB-IN-ACT"]

[[statement]]
id = "Something not CONCRETE_6 is SIMPLY_PRIOR_1 to a distinct actual concretum"
lean = "SomeSimplyPriorNonConcrete"
paraphrase = "Rival framework commitment, unattributed (motivated by Platonism about priority): for some distinct y and x, y is simply prior to x, x is concrete and exists at w, and y is not concrete. It does not say that y is absent from w, and the priority is not temporal."
definitions = ["Non-concrete item simply prior to an actual concretum", "DEF-KANT-ONTOLOGICAL-MODEL", "DEF-SIMPLE-PRIORITY", "DEF-CONCRETE-ESSE-IN-RE"]
disambiguations = ["DISAMB-CONCRETE-ABSTRACT-CRITERIA"]

[[statement]]
id = "Something that is GOD_4 has being and is exceeded in being by something that is not GOD_4"
lean = "SomeGodExceededInBeing"
paraphrase = "Rival framework commitment, unattributed (motivated by demiurgic and finite-god theologies): for some g and y, g is God, g is in act in esse, y is not God, and y is more in esse than g. It is not atheism and does not say that God lacks being."
definitions = ["Exceeded god: something divine with being is exceeded in being by a non-divine thing", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-MAXIME-ENS", "DEF-ESSE"]

[[statement]]
id = "Some necessary concretum is supported somewhere by a concretum absent from an accessible world"
lean = "SomeNecessaryConcretumContingentlySupported"
paraphrase = "Rival framework commitment, unattributed (motivated by bottom-up grounding of a necessary whole in replaceable constituents): for some admitted world v and concrete candidates a and b, a exists at v, b exists at every world accessible from w, a stands to b in the selected relation at v, and a is absent from some world accessible from w. It does not say that b is supported at w itself or at every world."
definitions = ["Contingent support of a necessary concretum at some admitted world", "DEF-NO-CONTINGENT-CONCRETE-SUPPORT", "DEF-CONCRETE-SUPPORT-RESTRICTION", "DEF-KANT-MODAL-NECESSITY", "DEF-PRESENT-ESSE-SUPPORT"]
disambiguations = ["DISAMB-EXISTENCE-ESSE-SUPPORT", "DISAMB-NECESSARY-EXISTENCE-VS-UNDERIVED"]

[[statement]]
id = "Two necessary concreta support each other, each at some admitted world"
lean = "NecessaryConcretaMutualSupport"
paraphrase = "Rival framework commitment, unattributed (motivated by metaphysical interdependence among necessary beings): for some concrete candidates a and b, each existing at every world accessible from w, and worlds v and u, a exists at v and stands to b in the selected relation at v, and b exists at u and stands to a in the selected relation at u. The candidates may coincide and the worlds may coincide. No endless regress is asserted."
definitions = ["Mutual support of necessary concreta across admitted worlds", "DEF-CONCRETE-NECESSARY-UNION-WF", "DEF-CONCRETE-SUPPORT-RESTRICTION", "DEF-KANT-MODAL-NECESSITY", "DEF-PRESENT-ESSE-SUPPORT"]
disambiguations = ["DISAMB-EXISTENCE-ESSE-SUPPORT", "DISAMB-NECESSARY-EXISTENCE-VS-UNDERIVED"]

# ---------------------------------------------------------------- certificates

[[statement]]
id = "Abstract-only world: the rival of concrete population holds and the root trilemma fails"
lean = "Control.AbstractOnlySurvives"
paraphrase = "Closed control on one interpretation (one world, one existing candidate, nothing concrete, empty selected relation): something exists at the world and nothing existing there is concrete; excluded middle holds; and the three-horned conclusion of the root trilemma fails there: no necessary concretum, no nonnecessary root, and actual grounding is well-founded. A statement about this interpretation only."
definitions = ["Abstract-only population of the selected world"]

[[statement]]
id = "Endless descent: bottomless grounding holds with the other premises and nothing is necessary"
lean = "Control.BottomlessSurvives"
paraphrase = "Closed control on one interpretation (two mutually accessible worlds; the natural numbers, all concrete, exist at the selected world only; each number is grounded by its successor): bottomless actual grounding holds, a concrete candidate exists at the selected world, every actual contingent concretum has an actual concrete ground, excluded middle holds, and no concrete candidate exists at the selected world and at every world accessible from it. A statement about this interpretation only; the circular shape of the rival is not exhibited."
definitions = ["Bottomless actual concrete grounding at the selected world"]

[[statement]]
id = "Brute root: a contingent root is the unique actual root and no unique necessary root exists"
lean = "Control.ContingentRootSurvives"
paraphrase = "Closed control on one interpretation (two mutually accessible worlds; one concrete candidate existing at the selected world only; empty selected relation): that candidate is a contingent actual root, it is the unique actual root, excluded middle holds, and there is no actual root that is necessary and unique. A statement about this interpretation only."
definitions = ["Contingent actual root: a brute contingent foundation"]

[[statement]]
id = "Idle maximum: a maximum in being exists and no maximum causes the being of every other being"
lean = "Control.IdleMaximumSurvives"
paraphrase = "Closed control on one three-member interpretation (a top, a maker and a made thing, all in act in esse, ranked strictly; only the maker causes being, and only in the made thing): the idle-maximum rival holds, some being is maximal in being, and no being is both maximal in being and a cause of the being of every other being. A statement about this interpretation only."
definitions = ["Idle maximum in being: another cause gives being where the maximum does not"]

[[statement]]
id = "Thin existence: an existing intellectual exerciser is in act in no respect"
lean = "Control.ThinExistenceSurvives"
paraphrase = "Closed control on one interpretation (one world, one existing candidate that exercises intellect, in act in no respect): something exists at the world and nothing existing there is in act in esse; every intellectual exerciser exists at the world; and it is false that every intellectual exerciser is in act in some respect. A statement about this interpretation only."
definitions = ["Thin existence: existents of the selected world have no act of being"]

[[statement]]
id = "Form as cause: a non-concrete esse cause holds and an actual contingent concretum is ungrounded"
lean = "Control.NonConcreteEsseCauseSurvives"
paraphrase = "Closed control on one interpretation (two mutually accessible worlds; a non-concrete item existing at both and a concrete item existing at the selected world only; the non-concrete item causes the concrete item's esse; empty selected relation): the non-concrete-cause rival holds; every actual contingent concretum participates esse; whatever participates esse has a distinct cause of its esse; and it is false that every actual contingent concretum has an actual concrete ground. A statement about this interpretation only."
definitions = ["Non-concrete cause of an actual concretum's esse"]

[[statement]]
id = "Endless ascent: unbounded grades hold with the other uniqueness inputs and no unique necessary root"
lean = "Control.UnboundedGradesSurvive"
paraphrase = "Closed control on one interpretation (one world; the natural numbers all exist, are concrete, ungrounded and in act in esse; the greater number is more in esse; nothing causes esse): the unbounded-grades rival holds; zero has a necessary root ancestor (itself); excluded middle holds; whatever is maximal in being causes the being of every other being (vacuously, there being no maximum); every existent is in act in esse; every distinct esse cause of an actual concretum is its actual concrete ground (vacuously); and there is no actual root that is necessary and unique. A statement about this interpretation only."
definitions = ["Unbounded grades of being: every actual grade is exceeded by an actual one"]

[[statement]]
id = "Mere conservation: residual transfer holds and a cause of being fails to cause a perfection"
lean = "Control.MereConservationSurvives"
paraphrase = "Closed control on one three-member interpretation with two respects, esse and one further perfection, all members in act in both (the top causes the esse of the other two; only the maker causes the further perfection, and only in the made thing): the mere-conservation rival holds; the residual transfer condition for non-universal causes and self-effects holds (vacuously: the top is the only cause of esse and causes none in itself); and it is false that whatever causes a thing's esse causes each of its actual perfections. A statement about this interpretation only."
definitions = ["Mere conservation: a universal cause of esse leaves a perfection to a secondary cause"]

[[statement]]
id = "Abstract priority: a non-concrete prior item holds and no necessary actual root is a first being"
lean = "Control.AbstractPriorSurvives"
paraphrase = "Closed control on one interpretation (one world, two existing candidates, one concrete and one not; the non-concrete one is simply prior to the concrete one; empty selected relation): the non-concrete-priority rival holds; a concrete candidate exists at the world; the whole actual concrete roster is not a borrowing trap; every actual contingent concretum has an actual concrete ground (vacuously: nothing is contingent); excluded middle holds; and no actual root is both necessary and a first being. A statement about this interpretation only."
definitions = ["Non-concrete item simply prior to an actual concretum"]

[[statement]]
id = "Exceeded god: a composite god with a uniting cause more in being, so God is not simple there"
lean = "Control.ExceededGodSurvives"
paraphrase = "Closed control on one two-member interpretation (one member is God and composite; the other is not God, is more in esse than it and causes its esse; both are in act in esse): the exceeded-god rival holds; every composite has a distinct cause of its esse; whatever causes a quality in another is more such than it; and it is false that whatever is God is not composite. A statement about this interpretation only."
definitions = ["Exceeded god: something divine with being is exceeded in being by a non-divine thing"]

[[statement]]
id = "Sustained whole: contingent support holds with the other join inputs, nothing necessary underived"
lean = "Control.ContingentSupportSurvives"
paraphrase = "Closed control on one interpretation (two mutually accessible worlds; a whole existing at both, one part existing at the selected world only and another at the other world only, all concrete; at the selected world the whole grounds its part there; at the other world the part there grounds the whole): the contingent-support rival holds; a concrete candidate exists at the selected world; actual grounding there is well-founded; every actual contingent concretum has an actual concrete ground; the selected world accesses itself; the union of support arrows between necessary concrete candidates is well-founded; excluded middle holds; and no concrete candidate is necessary, actual and without an existing concrete supporter at every admitted world. A statement about this interpretation only."
definitions = ["Contingent support of a necessary concretum at some admitted world"]

[[statement]]
id = "Mutual pair: mutual support holds with the other join inputs and nothing necessary is underived"
lean = "Control.MutualSupportSurvives"
paraphrase = "Closed control on one interpretation (two mutually accessible worlds; two concrete candidates existing at both; at the selected world the first grounds the second, at the other world the second grounds the first): the mutual-support rival holds; a concrete candidate exists at the selected world; actual grounding there is well-founded; every actual contingent concretum has an actual concrete ground (vacuously: nothing is contingent); the selected world accesses itself; every existing concrete supporter of a necessary concrete candidate is necessary; excluded middle holds; and no concrete candidate is necessary, actual and without an existing concrete supporter at every admitted world. A statement about this interpretation only."
definitions = ["Mutual support of necessary concreta across admitted worlds"]

