[[argument]]
id = "Abstract-only rival of concrete population survives, checked"
theorem = "abstractOnlySurvives"
premises = []
conclusion = "Abstract-only world: the rival of concrete population holds and the root trilemma fails"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit one-world interpretation, checked by case analysis"
meaning = "Rival test for the concrete-population premise against its smallest consumer, NecessaryRootFork.necessaryRootTrilemma (premises: concrete population, excluded middle). In an interpretation with one existing non-concrete candidate the abstract-only rival and excluded middle hold and the trilemma fails. This is a model-witnessed survival of the rival, not a refutation or defence of the premise; the interpretation is not claimed metaphysically possible. Excluded middle is supplied by Lean's classical axioms."

[[argument.research_comparisons]]
target_statement_id = "STMT-COGITO-INHABITED-CONCRETE-WORLD"
rival_statement_id = "Something exists at the selected world and nothing existing there is CONCRETE_6"
sense_definition_id = "Abstract-only population of the selected world"
outcome = "model-witnessed"
conditions = "Control.abstractOnly at its one world: the rival and excluded middle hold; NecessaryRootTrilemma fails. Consumer tested: NecessaryRootFork.necessaryRootTrilemma."
scope = "Same Ontic model, concrete predicate and selected world as the premise; one world, one candidate."
coverage = "One explicitly populated interpretation of the rival; not every abstract-only ontology."
