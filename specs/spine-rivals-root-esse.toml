[[argument]]
id = "Unbounded-grades rival of grades-to-maximum at being survives, checked"
theorem = "unboundedGradesSurvive"
premises = []
conclusion = "Endless ascent: unbounded grades hold with the other uniqueness inputs and no unique necessary root"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit one-world interpretation on the natural numbers, checked directly"
meaning = "Rival test for grades-to-maximum at being against its smallest consumer, SelectedAncestryUnique.uniqueRoot (premises: a necessary root ancestor of the selected being, excluded middle, the genus principle at being, the existence-to-act contract, the esse-cause bridge, grades-to-maximum at being). On the natural numbers ordered by size, all necessary and ungrounded, the unbounded-grades rival holds with the other five premises and there are many necessary roots, so none is unique. Two of the other premises hold vacuously there. Model-witnessed survival only."

