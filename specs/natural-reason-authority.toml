[[statement]]
id = "Natural reason sufficiency authority controls"
lean = "ForkControls"
paraphrase = "Formal inhabited controls distinguish sharedness from external jurisdiction with internal determination retained, one-way sufficiency from its converse, natural from all-move sufficiency scope, and authority exclusion from sufficiency. Restricting scope preserves sufficiency, determination and external exclusion. No original-sense mapping or actual practice is established."
