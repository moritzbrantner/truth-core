id = "Coinitial Grim Reaper patchwork gives spaced Grim Reaper patchwork"
theorem = "spacedPatchworkOfCoinitial"
premises = ["Co-possible Grim Reaper pieces along a coinitial populated descent glue into one world"]
conclusion = "Co-possible Grim Reaper pieces along a spaced populated descent glue into one world"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "In linear time a spaced descent is coinitial: its clock readings fall below every real number"
meaning = "Strength order (linear time, any real clock): the gluing premise over coinitial populated descents gives it over spaced populated descents. No premise is established."

[[argument]]
id = "Begun populated pasts give metrically finite populated pasts"
theorem = "populatedPastsMetricallyFiniteOfBegun"
premises = ["In every possible history, each moment with a contingent concrete thing present has a begun past"]
conclusion = "In every possible history, each moment with a contingent thing present has a metrically finite past"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "In linear time the first moment's clock reading bounds the readings of the past below"
meaning = "Strength order (linear time, any real clock): a past with a beginning is metrically finite, since in linear time the minimal moment lies at or before every moment and the clock is monotone. The converse fails in an open-below finite past (MetricGrimReaper control 2: positive real times, every populated past metrically finite, not every one begun). So founded, begun and metrically finite populated pasts form a strictly descending strength chain in linear time. No premise is established."

[[argument]]
id = "Metric Grim Reaper controls checked"
theorem = "controls"
premises = []
conclusion = "Independence, nonvacuity and reach controls for the metric Grim Reaper premises"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit interpretations with integer, positive real and non-negative real times and identity clocks, checked with the metric lemmas, the main theorem, and the GrimReaperPatchwork theorems for the negative cases"
meaning = "The spaced local-pieces and patchwork premises are independent and neither alone excludes a metrically infinite populated past (control 1). Both premises hold, for every register frame, in a populated past that is open below and metrically finite (control 2) and in continuous time with a first moment (control 3), so the metric version excludes neither shape, unlike the coinitial version (which control 2 refutes for every frame) and the unrestricted version (which control 3 refutes for every frame). Control 2 also shows that the metric conclusion, together with the earlier-grounded possibility premise A3 prime b, does not give possible begun coming-to-be (A3 prime w): a further bridge from metrically finite to begun pasts would be needed. Control 3 shows the premises, the conclusion, begun populated pasts and possible begun coming-to-be together in continuous time. Model claims concern these interpretations only."

