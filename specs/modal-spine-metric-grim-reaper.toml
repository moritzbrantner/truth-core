[[statement]]
id = "Along every spaced populated descent, adjacent Grim Reaper pieces are co-possible"
lean = "SpacedReaperPiecesPossible"
paraphrase = "OPEN analyst premise, attribution deferred (Grim Reaper style, metric version): for the supplied station-register frame and real time clock, in every history v accessible from the selected world, along every strictly descending sequence of moments c whose first moment has a contingent concrete individual present in v and whose consecutive slots all last at least some fixed positive duration on the clock, for every n some world accessible from v realizes both the local piece of station n and that of station n + 1 (positive trigger, emission, forwarding and admissibility, as in GrimReaperPatchwork). Such a descent exists only below a moment whose past is metrically infinite, so the premise says nothing about any metrically finite past, with or without a first moment: no station is placed in a shrinking slot. One clock serves every world of the frame. Registers carry no existential import, and the bridge from recombining concrete stations to this typed premise is not built. It says nothing about gluing. 'Concrete' is the supplied Concrete parameter, read under the adopted esse criterion; the Lean type does not enforce that reading."
definitions = ["Local Reaper pieces co-possible along every spaced populated descent", "Descent with slots of at least a fixed positive length", "Real time clock strictly increasing along the order of moments", "Local Reaper piece at a station of a descent of moments", "Reaper station registers of a history's worlds", "DEF-INDEXED-SIGNAL-POSITIVE-TRIGGER", "DEF-INDEXED-SIGNAL-EMISSION", "DEF-INDEXED-SIGNAL-FORWARDING", "DEF-INDEXED-SIGNAL-INDEX-ADMISSIBILITY", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Co-possible Grim Reaper pieces along a spaced populated descent glue into one world"
lean = "SpacedReaperPatchwork"
paraphrase = "OPEN analyst gluing premise, attribution deferred (Grim Reaper patchwork style, metric version): for the supplied station-register frame and real time clock, in every history v accessible from the selected world, along every strictly descending sequence of moments c starting at a populated moment whose consecutive slots all last at least some fixed positive duration, if for every n some world accessible from v realizes the local pieces of stations n and n + 1 together, then some single world accessible from v realizes the local pieces of all stations along c. It asserts no piece is possible. Because no world realizes every piece along a descent (a theorem), this typed premise for a given frame is equivalent to 'along every spaced populated descent, adjacent pieces are not all co-possible'; its warrant must come from the general recombination principle it instantiates. 'Concrete' is the supplied Concrete parameter; the Lean type does not enforce the esse reading."
definitions = ["Reaper patchwork along every spaced populated descent", "Descent with slots of at least a fixed positive length", "Real time clock strictly increasing along the order of moments", "Local Reaper piece at a station of a descent of moments", "Reaper station registers of a history's worlds", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "In every possible history, each moment with a contingent thing present has a metrically finite past"
lean = "PopulatedPastsMetricallyFinite"
paraphrase = "OPEN analyst premise, attribution deferred: for the supplied real time clock, in every history accessible from the selected world, every moment at which some contingent concrete individual is present has a metrically finite past (the clock readings of the moments at or before it are bounded below). It denies the metrically infinite case of horn H2 (an endless succession of days before a populated moment) wherever a contingent concrete thing is present; histories with no contingent concrete thing present are unconstrained. It does NOT say the past has a beginning: a populated past that is metrically finite and open below, as in standard FLRW cosmology (the initial singularity is not a moment), satisfies it, and so does continuous time with a first moment. In linear time it is implied by begun populated pasts. One clock serves every world of the frame. It mentions no cause. 'Concrete' is the supplied Concrete parameter."
definitions = ["Metrically finite populated pasts in every accessible history", "Metrically finite past of a moment", "Real time clock strictly increasing along the order of moments", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Independence, nonvacuity and reach controls for the metric Grim Reaper premises"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete. (1) The beginningless integer history of GrimReaperPatchwork.Control.pivot with the identity clock: silent registers satisfy spaced patchwork but not spaced local pieces; pivot registers satisfy spaced local pieces but not spaced patchwork; not every populated past is metrically finite. (2) An open-below finite history: times the positive reals with the identity clock, worlds booleans, individuals integers, every individual existing and present at every moment of world true, nothing existing at world false. For every register frame both spaced premises hold while the coinitial local-pieces and patchwork premises do not both hold; every populated past is metrically finite and not every one is begun; beginningless populated pasts have coinitial descents; the earlier-grounded possibility premise holds (each individual n grounded by n - 1, present earlier); and begun coming-to-be is not possible. (3) Continuous time with a first moment: times the non-negative reals with the identity clock, one individual existing at world true and present there at every moment after 0, nothing at 0, nothing existing at world false. For every register frame both spaced premises hold while the unrestricted local-pieces and patchwork premises do not both hold; every populated past is metrically finite and begun, not every one founded; and begun coming-to-be is possible. These are statements about these interpretations only."
definitions = ["Local Reaper pieces co-possible along every spaced populated descent", "Reaper patchwork along every spaced populated descent", "Metrically finite populated pasts in every accessible history", "Local Reaper pieces co-possible along every coinitial populated descent", "Reaper patchwork along every coinitial populated descent", "Local Reaper pieces co-possible along every populated descent", "Reaper patchwork along every populated descent", "Beginningless populated pasts have a coinitial descent", "Begun populated pasts in every accessible history", "Founded populated pasts in every accessible history", "Possibly, a populated history whose contingent things have earlier grounds", "History of begun coming-to-be", "DEF-KANT-MODAL-CONTINGENCY"]

[[argument]]
id = "Metrically finite populated pasts from spaced Grim Reaper pieces and patchwork"
theorem = "populatedPastsMetricallyFiniteOfPatchwork"
premises = ["Along every spaced populated descent, adjacent Grim Reaper pieces are co-possible", "Co-possible Grim Reaper pieces along a spaced populated descent glue into one world"]
conclusion = "In every possible history, each moment with a contingent thing present has a metrically finite past"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "In linear time, a metrically infinite past below a populated moment yields a descent with slots of at least one clock unit; the spaced local and patchwork premises glue a Reaper arrangement along it in one world, which GrimReaperPatchwork.arrangementImpossible (via IndexedSignalReaper.impossible) refutes"
meaning = "Non-transcription conditional support option for the metric denial of horn H2: no populated past in an accessible history is metrically infinite. Time is linearly ordered (a type-class assumption of the theorem, not a premise statement) and measured by a supplied real clock strictly increasing along it. Suppose a contingent concrete thing is present at t in an accessible history and the clock readings of the moments at or before t are unbounded below; choice gives a strictly descending sequence from t whose slots each last more than one clock unit. The spaced local premise makes every two adjacent Reaper pieces along it co-possible; spaced patchwork gives one accessible world realizing all of them; the verified GrimReaperPatchwork.arrangementImpossible, which composes IndexedSignalReaper.impossible, refutes that world. Each premise holds without the other in a beginningless integer history (control 1). The premises are silent about every metrically finite past, so they are satisfiable, for every register frame, by a populated past that is open below and finite (positive real times, control 2) and by continuous time with a first moment (non-negative real times, control 3): neither the FLRW objection nor the Benardete parity objection to the order-theoretic GrimReaperPatchwork premises has a target here. The conclusion does NOT give a past with a beginning: control 2 satisfies both premises and the conclusion with no begun populated moment, and there, with the earlier-grounded possibility premise, begun coming-to-be (A3 prime w) is not possible. Both premises are OPEN. Nothing is attributed to Koons or Pruss. No premise is established."

[[argument]]
id = "Coinitial Grim Reaper pieces give spaced Grim Reaper pieces"
theorem = "spacedPiecesOfCoinitial"
premises = ["Along every coinitial populated descent, adjacent Grim Reaper pieces are co-possible"]
conclusion = "Along every spaced populated descent, adjacent Grim Reaper pieces are co-possible"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "In linear time a spaced descent is coinitial: its clock readings fall below every real number"
meaning = "Strength order (linear time, any real clock): the local-pieces premise over coinitial populated descents gives it over spaced populated descents, because a descent whose slots last at least delta runs below every earlier moment. The converse fails: in the positive reals the spaced premises hold for every register frame while the coinitial premises do not both hold (MetricGrimReaper control 2). No premise is established."

