# Stage two of the modal spine: typed sibling readings for two Dei Filius
# primitives. LORD_2 (causes the being of and governs everything else) and
# BLESSED_2 (has intellect, is universally perfect, good as to being and in act
# in understanding) are derived for every being with the nine: LORD_2 from one new
# bridge (an intellectual, willing cause of the being of all directs everything
# else to an end, after q.22 a.2) and the existing q.103 a.3 reading; BLESSED_2
# from two existing premises of DeiFiliusOperationFromIntellect with the nine's
# pure act. Two sense bridges (LORD_2 -> LORD_1, BLESSED_2 -> BLESSED_1), each
# strictly weaker than the old bridge it replaces, give the restated sufficiency
# (5fbea2f5) and the Dei Filius root (c0f4a346) second routes for these two
# conjuncts. Analyst formulations, attribution deferred.

[batch]
vocab = "TruthCore.Causality.DeiFiliusLordBlessed"
results = "TruthCore.Results.Causality.DeiFiliusLordBlessed"

# ---------------------------------------------------------------- statements

[[statement]]
id = "123d394b-11ce-449a-a8b6-7fda5a254a6d"
label = "Whatever HAS_INTELLECT_1, HAS_WILL_1 and causes the being of all directs all else to an end"
lean = "UniversalIntellectualCauseDirectsAll"
paraphrase = "Open bridge, analyst formulation, unattributed. Whatever has intellect (HAS_INTELLECT_1), has will (HAS_WILL_1) and causes the being of every other being in act as to being (IsCreatorOfAll) directs each other being in act as to being to some end (Directs g x e, the quinta via / q.103 relation). The three are separate conjuncts: the antecedent does not say that the being causes THROUGH its intellect and will (definition 92c03350 leaves freedom of the act unencoded). After ST I q.22 a.2: every agent acts for an end, and the ordering of effects to that end extends as far as the causality of the first agent extends. That reason presupposes intellectual, voluntary agency (cf. q.19 a.4, God causes by will, not by necessity of nature), so the bridge also carries an unstated step: a being with intellect and will that causes the being of all does so through them. The relevant alternative is necessary emanation by an intellect (a first intellect from which everything else proceeds by necessity of its nature, not by choice); no independent justification for it is on file, and it is recorded as a named alternative, not as an objection. Restricted to a cause of the being of ALL others. The side effects on file (effects outside an intelligent agent's intention) all involve a particular cause, and their mechanism, according to q.22 a.2 ad 1 (attributed, unpinned), is the concurrence of other causes not ordered by that cause; that mechanism is absent when one cause gives being to everything else. This is a reason from the cited reply, not a logical consequence of the antecedent. It does not say how the direction is carried out (immediately or through intermediaries, q.103 a.6), what the being knows of each thing (it says nothing about the mode of cognition), nor that the end is the same for all. Control part 4: without it, a being with the nine directs and governs nothing and is not LORD_2."
definitions = ["DEF-HAS-INTELLECT", "DEF-HAS-WILL", "92c03350-6809-497d-b123-2ffb11c0e0c1", "c53b5fbe-121a-5d59-8e29-0f9f7eea85b1"]
disambiguations = ["DISAMB-IN-ACT", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is LORD_2"
lean = "NineAreLordByCauseAndGovernment"
paraphrase = "Whatever is simple, universally perfect, supremely good, such that whatever is GOD_4 is it (IsTheOneGod: uniqueness only), infinite, altogether immutable, eternal, and has intellect and will is LORD_2: it causes the being of every other being in act as to being and governs every such being (Governs, q.103: directing to an end). Derived (nineAreLordByCauseAndGovernment) from the directing bridge and the q.103 a.3 reading; its creator conjunct is contained by definition in supreme goodness. LORD_2 is not LORD_1 (the primitive dominion of the Dei Filius attributes): authority to dispose and conservation as a separate conjunct are not typed."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "c8e458bd-3b8a-4e10-8e2d-43d1c1912c63"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "aa1de96a-e0d2-4739-a34f-9b98f1034a34"]

[[statement]]
id = "Whatever is LORD_2 is LORD_1"
lean = "CauseAndGovernorOfAllIsLord"
paraphrase = "Open sense bridge, analyst formulation, unattributed. Whatever causes the being of every other being in act as to being and governs every such being (LORD_2) has dominion over everything else (LORD_1, the primitive Primitives.IsLord: authority to dispose of what is subject to it). After ST I q.13 a.7: things are subject to God as to their cause. It carries what LORD_2 leaves untyped: the passage from causal and directive power to authority. That step is the same in the old bridge, so it is not weakened here; only the antecedent is stronger. Strictly weaker than 'Whatever causes the being of everything else is LORD_1 of everything else' (its antecedent adds governance; Control part 2: a cause of the being of all that governs nothing satisfies this bridge vacuously and falsifies the old one)."
definitions = ["c8e458bd-3b8a-4e10-8e2d-43d1c1912c63", "59350e3b-1b76-45cd-b9fd-548f3f4658b5"]
disambiguations = ["aa1de96a-e0d2-4739-a34f-9b98f1034a34", "DISAMB-IN-ACT"]

[[statement]]
id = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is BLESSED_2"
lean = "NineAreBlessedByUnderstanding"
paraphrase = "Whatever is simple, universally perfect, supremely good, such that whatever is GOD_4 is it (uniqueness only), infinite, altogether immutable, eternal, and has intellect and will is BLESSED_2: it has intellect, is universally perfect, is good as to being and is IN_ACT_3 in the respect of understanding (InAct g understanding, definition 39f50105, formal or virtual). Derived (nineAreBlessedByUnderstanding) from two existing open premises of DeiFiliusOperationFromIntellect (intellect is the POTENCY_3 capacity to understand; that capacity is exercised or in POTENCY_2 to understanding) with the nine's pure act. BLESSED_2 is not BLESSED_1: ex se, self-knowledge of one's own sufficiency and formal (rather than merely virtual) understanding are not typed. BLESSED_1 is read the Thomist way (beatitude formally in the intellect, q.26 a.2); a Scotist reading (beatitude formally in the will's enjoyment) would be a further sense, not typed here."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "39f50105-c889-4c30-b841-ce458ec8109d", "d0b7b32b-9dc1-426a-9949-92c0b43da663"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "70f4f510-d488-445f-86cf-03b889507372"]

[[statement]]
id = "Whatever is BLESSED_2 is BLESSED_1"
lean = "UnderstandingPerfectIsMostBlessed"
paraphrase = "Open sense bridge, analyst formulation, unattributed. Whatever has intellect, is universally perfect, is good as to being and is IN_ACT_3 in understanding (BLESSED_2) has, in and from itself, the perfect good of an intellectual nature (BLESSED_1, the primitive Primitives.MostBlessed). After ST I q.26 a.1-2. It carries what BLESSED_2 leaves untyped: ex se, knowing one's own sufficiency in the good possessed, and formal rather than merely virtual understanding. BLESSED_1 is read the Thomist way (beatitude formally in the intellect, q.26 a.2); a Scotist reading (beatitude formally in the will's enjoyment) would be a further sense, which this bridge does not reach. Strictly weaker than 'Whatever is PERFECT_2 and HAS_INTELLECT_1 is BLESSED_1' (its antecedent adds goodness and act in understanding; Control part 3: a perfect intellectual being not in act in understanding satisfies this bridge vacuously and falsifies the old one)."
definitions = ["d0b7b32b-9dc1-426a-9949-92c0b43da663", "5068b909-d6b0-458b-a3d7-30fd2f7088a8"]
