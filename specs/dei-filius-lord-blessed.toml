# ---------------------------------------------------------------- arguments

[[argument]]
id = "Whatever has the nine is LORD_2, from directing by the universal intellectual cause"
theorem = "nineAreLordByCauseAndGovernment"
premises = ["123d394b-11ce-449a-a8b6-7fda5a254a6d", "STMT-DIRECTING-TO-AN-END-IS-GOVERNING"]
conclusion = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is LORD_2"
axioms = []
rule = "Unfolding of supreme goodness at esse, then the directing bridge and the q.103 a.3 reading at each other being"
meaning = "Let g have the nine. Its supreme goodness includes causing every perfection of every other being, so in particular the being of every other being in act as to being: g is creator of all (contained by definition, not independently derived). g has intellect and will (two of the nine), so the directing bridge gives, for each other being x in act as to being, an end to which g directs x; whoever directs a thing to an end governs it (q.103 a.3 reading), so g governs x. Hence g is LORD_2. Conditional consequence; both premises stay open, and the conclusion is LORD_2, not LORD_1."

[[argument]]
id = "Whatever has the nine is BLESSED_2, from intellect as an exercised capacity"
theorem = "nineAreBlessedByUnderstanding"
sense_bridges = [
  { term = "POTENCY_CAPACITY_AND_POWER_ACROSS_ADOPTED", from = "02e3f1d0-4ba1-498f-b34d-40bdd348d8c4", to = "d0b17a2e-febf-45e8-9b9e-11a75b2ccbc6", statement_id = "4728d5f4-d7a4-460c-aecc-37c6279ece9f" },
]
premises = ["9c2a5dfe-f2f9-4d8b-9235-6a01fd108161", "4728d5f4-d7a4-460c-aecc-37c6279ece9f"]
conclusion = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is BLESSED_2"
axioms = []
rule = "Projection of the nine, then the registered intellect-to-act derivation (intellectualPureActOperatesFromCapacity) with operating read as act in understanding"
meaning = "Let g have the nine. Intellect and universal perfection are two of the nine; goodness as to being is the first conjunct of supreme goodness. g's intellect is a capacity to understand (first premise); that capacity is exercised or a potency to understanding (second premise, the listed POTENCY sense bridge); g is altogether immutable, in potency in no respect, so it is in act in understanding. In Lean the registered intellectualPureActOperatesFromCapacity is applied with its 'operates' read as 'is in act in understanding', so that its third premise holds trivially and is not used. Hence g is BLESSED_2. Conditional consequence; both premises stay open, and the conclusion is BLESSED_2, not BLESSED_1. Act in understanding is IN_ACT_3 (formal or virtual)."

