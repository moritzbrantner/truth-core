[[statement]]
id = "Conceptual existence boundary omission interpretations"
lean = "Controls"
definitions = ["f59d02bf-fd2f-46b6-94f2-09eb29cf970c"]
paraphrase = "Four explicit finite interpretations: joint satisfaction and conclusion; empty exemplification and existence with transfer omitted; nonexistent fully characterized exemplar with anchor omitted; actual fully characterized exemplar with actuality-to-existence omitted. Each omission retains the other two premises."

[[argument]]
id = "Existing exemplar from explicit predication and semantic bridges"
theorem = "existingExemplar"
premises = ["Nuclear profile transfers to candidate exemplification", "Nuclear profile has an actuality-entailing feature", "Conceptual actuality entails actual existence"]
conclusion = "Characterized profile has an existing exemplar"
rule = "Feature witness elimination and extension inclusion"
meaning = "Conditional analyst reconstruction only: choose the nuclear anchor feature; transfer gives its exemplification by the selected candidate; extension inclusion gives actuality; the separate bridge gives existence. Preserve all nuclear features of that same witness. The substantive result is the accompanying omission separation, not a defense of the bridges or a proof of GOD_4. Attribution deferred."

[[argument]]
id = "Conceptual existence boundary finite separations"
theorem = "controls"
premises = []
conclusion = "Conceptual existence boundary omission interpretations"
rule = "Finite counterinterpretations"
meaning = "Explicit Bool feature and Unit candidate interpretations jointly witness nonvacuity and failure after each carrying premise is omitted. A nonempty nuclear profile and a candidate do not imply an inhabited existence extension. These models are not metaphysical possibility claims or historical readings of Meinong."
