[[statement]]
id = "Observer incremental factorization threshold and screening"
lean = "Factorization"
paraphrase = "For all existing positive rational three-cell Sampling pairs, observer-conditioned factor equals raw evidence factor divided by observer factor. It exceeds one iff raw exceeds observer, equals one iff they coincide, and is one when both other-observer cells vanish."

