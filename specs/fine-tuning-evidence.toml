lean = "Controls"
paraphrase = "Existing design/natural factors are raw three, observer one, conditional three; design/selectedNatural factors are three, four, three quarters. Nonzero evidence-equals-observer fixtures give raw and observer factors five, conditional one. Stipulated models only."

