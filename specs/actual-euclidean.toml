[[statement]]
id = "Any two successors of the selected world are mutually accessible"
lean = "EuclideanAt"
paraphrase = "OPEN analyst premise, attribution deferred: any two worlds accessible from the selected world w access one another. Under the alethic reading, any two histories possible relative to the actual history are possible relative to each other. It is global Euclidean access restricted to the one world w; nothing is said about what a merely possible history accesses beyond the other successors of w."
definitions = ["Euclidean access at the selected world only", "f8948e28-b13a-5244-95f1-41a05cd4fff2"]

[[statement]]
id = "Actual-world Euclidean separating model and stepwise status"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls on three worlds (actual, near, far) with natural-number times, every individual counted concrete. (1) The frame clustered, in which actual and near access each other and themselves, near also accesses far and far only itself, is Euclidean at actual and reflexive at actual but not Euclidean. (2) On a history over it, with one individual existing everywhere and present at every time and another existing only at near and present there only at time 1, presence-to-existence, inert emptiness and the possible contingent-free past at actual all hold. (3) The existing stepwise frame of the stage-one rival controls is not Euclidean at its actual world. These are statements about the encoded finite interpretations only."
definitions = ["Euclidean access at the selected world only", "6f7a4ccc-10de-52fb-af44-41dcb793d8c9", "DEF-COUNT-TEMPORAL-HISTORY-PRESENCE", "Inert emptiness: a concrete-empty moment is followed only by concrete-empty moments", "Contingent concrete things absent at a moment and present at a later one"]

