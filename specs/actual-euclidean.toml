meaning = "Strength registration (not a route step): global Euclidean access, instantiated at the selected world w, gives Euclidean access at w on the same frame. The converse fails in Control.clustered."

[[argument]]
id = "Necessary concrete individual from inert emptiness, Euclidean at the selected world"
theorem = "inertNecessaryConcrete"
premises = ["Any two successors of the selected world are mutually accessible", "STMT-ACTUAL-MODAL-REFLEXIVITY", "STMT-COUNT-TEMPORAL-HISTORY-PRESENCE-ACTUAL", "A concrete-empty moment is followed only by concrete-empty moments", "Possibly, contingent concrete things are absent at a moment and present at a later one"]
