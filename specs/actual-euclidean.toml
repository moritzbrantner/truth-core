rule = "Reuse earlierNecessary at the accessible history, then transfer along Euclidean access and reflexivity at the selected world"
meaning = "New non-transcription conditional support option for stage one of the modal spine, replacing the global Euclidean premise of InertEmptiness.necessaryConcrete by Euclidean access at the selected world w only. The existing earlierNecessary gives a concrete individual c existing at the accessible history v and absent from no world accessible from v. Euclidean access at w with reflexivity at w gives that v accesses w and every successor of w, so the SAME c exists at w and at every world accessible from w. No causal, grounding or explanatory relation is used or concluded. All five premises are OPEN framework inputs; no premise truth, uniqueness or divine attribute is established."

