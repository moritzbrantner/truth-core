lean = "IntendedIsBoxT"
paraphrase = "OPEN reading premise, attribution deferred: the route's intended reading of 'necessary being' is exactly box-existence in frame class KT (sense boxT of the fork): that sense is intended and no other enumerated sense is. It combines the fork's coverage and exclusivity premises for this one sense."
definitions = ["DEF-NECESSARY-IN-SENSE"]
