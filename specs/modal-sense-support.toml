# Modal results to the root (#1233): the frame-class branches of the
# "necessary" sense fork from modal principles, via the modal library's
# correspondence certificates. Map: explorations/modal-sense-support.toml.
# Triage of all Modal results: docs/notes/modal-results-triage.md.
# Analyst formulations, attribution deferred; every new non-control statement
# except the rivals is an OPEN premise.

[batch]
vocab = "TruthCore.Causality.ModalSenseSupport"
results = "TruthCore.Results.Causality.ModalSenseSupport"
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-ONTIC-T-SCHEMA"
label = "T schema: whatever is NECESSARY_2 (box of the route's frame) is true"
lean = "OnticTSchemaValid"
paraphrase = "OPEN modal principle, attribution deferred: the T schema 'necessarily p implies p' is valid on the route's modal frame (worlds = complete possible histories): for every proposition (every valuation of the sentence letter) and every world, if p holds at every world accessible from it, p holds there. The box is the frame's box, the same box as the route's NECESSARY_2 box-existence. By the T correspondence it is equivalent to reflexivity of the frame."
definitions = ["DEF-MODAL-FIXTURE-FRAME", "DEF-MODAL-STANDARD-T-D-CORRESPONDENCE", "DEF-KANT-MODAL-NECESSITY"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-ONTIC-4-SCHEMA"
label = "4 schema: whatever is NECESSARY_2 is necessarily NECESSARY_2 on the route's frame"
lean = "Ontic4SchemaValid"
paraphrase = "OPEN modal principle, attribution deferred: the 4 schema 'necessarily p implies necessarily necessarily p' (Lemmon-Scott convergence formula 0 1 2 0) is valid on the route's modal frame, for every proposition and world. By the 4 correspondence it is equivalent to transitivity of the frame."
definitions = ["DEF-MODAL-FIXTURE-FRAME", "DEF-MODAL-HIJK-CONVERGENCE", "DEF-KANT-MODAL-NECESSITY"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-ONTIC-B-SCHEMA"
label = "B schema: whatever is true is NECESSARY_2-ly possible on the route's frame"
lean = "OnticBSchemaValid"
paraphrase = "OPEN modal principle, attribution deferred: the B schema 'p implies necessarily possibly p' (convergence formula 0 0 1 1) is valid on the route's modal frame, for every proposition and world. By the B correspondence it is equivalent to symmetry of the frame."
definitions = ["DEF-MODAL-FIXTURE-FRAME", "DEF-MODAL-HIJK-CONVERGENCE", "DEF-KANT-MODAL-NECESSITY"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-ONTIC-5-SCHEMA"
label = "5 schema: whatever is possible is NECESSARY_2-ly possible on the route's frame"
lean = "Ontic5SchemaValid"
paraphrase = "OPEN modal principle, attribution deferred: the 5 schema 'possibly p implies necessarily possibly p' (convergence formula 1 0 1 1) is valid on the route's modal frame, for every proposition and world. By the 5 correspondence it is equivalent to the frame being Euclidean."
definitions = ["DEF-MODAL-FIXTURE-FRAME", "DEF-MODAL-HIJK-CONVERGENCE", "DEF-KANT-MODAL-NECESSITY"]
disambiguations = ["DISAMB-NECESSARY"]

