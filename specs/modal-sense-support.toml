[[statement]]
id = "STMT-MODAL-DITHEISM"
label = "Rival: two distinct NECESSARY_2 beings, each a possible cause of every other being"
lean = "DistinctNecessaryPotentialCausers"
paraphrase = "Rival (modal ditheism), analyst formulation: there are two distinct beings a and b, each necessary at w (exists at every accessible world, NECESSARY_2) and each, at every world accessible from w, a possible cause of every other being existing there (OtherDirectedPotentialCause). It is the exact negation of STMT-NO-DISTINCT-NECESSARY-POTENTIAL-CAUSERS (RivalNegations in the batch controls)."
definitions = ["DEF-KANT-ONTOLOGICAL-MODEL", "DEF-KANT-MODAL-NECESSITY", "DEF-MODAL-POINTWISE-OTHER-POTENTIAL", "DEF-MODAL-POSSIBLE-EXISTENCE-CAUSE"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-NECESSARY-ACT-STRICT-CONTINGENT"
label = "Some act done at every accessible world strictly yields an effect that is contingent"
lean = "NecessaryActStrictlyYieldsContingent"
paraphrase = "Constraint candidate (#462, #555), analyst formulation: in some frame an act token is performed at every world accessible from w, is strictly efficacious for an effect x (x exists wherever the token is performed at an accessible world), and x is contingent at w (exists at w and is absent at some accessible world). A defender of a necessary, simple root and contingent creation who reads the root's act as strictly efficacious needs it; the first clause of STMT-SIMPLICITY-COLLAPSE-CORE is its exact negation."
definitions = ["DEF-SELECTED-EFFECT-OUTPUT-PROFILE", "DEF-RIGID-ACT-STRICT-EFFICACY", "DEF-KANT-MODAL-CONTINGENCY"]
disambiguations = ["DISAMB-NECESSARY"]

[[statement]]
id = "STMT-MODAL-FORK-CONTROLS"
label = "Finite models for the modal-principle branches of the NECESSARY_2 sense fork"
lean = "Control.Controls"
paraphrase = "Formal controls: (1) nonvacuity: on a one-point universal frame the T, 4, B and 5 schemas are valid, the K node holds and each of the four fork theorems' conclusions holds on its reading; (2) one omission model per load-bearing premise: without the T schema (non-reflexive two-world frame), the 4 schema (reflexive non-transitive chain), the B or 5 schema (two worlds ordered false <= true), the reading choice (every sense intended) or the K node (the being exists nowhere), the fork node fails while the other premises hold; (3) the two recorded rivals are exactly negated: NoDistinctNecessaryPotentialCausers iff not modal ditheism, and the first clause of SimplicityCollapse.Core excludes NecessaryActStrictlyYieldsContingent. No model is claimed to describe reality."
definitions = ["DEF-NECESSARY-IN-SENSE", "DEF-MODAL-FIXTURE-FRAME", "DEF-MODAL-STANDARD-T-D-CORRESPONDENCE", "DEF-MODAL-HIJK-CONVERGENCE"]
disambiguations = ["DISAMB-NECESSARY"]

[[argument]]
id = "MODAL-FORK-T"
label = "NECESSARY_2 in KT for the root, from the T schema by T correspondence"
theorem = "forkT"
premises = ["STMT-MODAL-STANDARD-CORRESPONDENCE-CERTIFICATE", "STMT-NECESSARY-ROOT-BOX-K", "STMT-ONTIC-T-SCHEMA", "STMT-INTENDED-BOX-T"]
conclusion = "STMT-NECESSARY-ROOT-ON-INTENDED-READING"
rule = "Theorem application (T correspondence: T-schema validity iff reflexivity), conjunction and existential introduction"
meaning = "T branch of the 'necessary' sense fork with its frame condition derived: the route's K node (root n box-existent, NECESSARY_2 in K, from the 25 route inputs), the OPEN T schema on the route's frame and the OPEN reading premise (box-existence in KT, and only that) give the fork node. Reflexivity of the frame is not assumed: the modal library's StandardCorrespondenceCertificate (proved by MODAL-STANDARD-CORRESPONDENCE-CERTIFICATE) turns the T schema into it. The three OPEN fork premises (coverage, exclusivity, side condition) are replaced by two OPEN premises. Without the T schema or the reading premise the branch fails (controls)."
strong_version_needed = { "STMT-NECESSARY-ROOT-BOX-K" = "The frame-class readings are box-existence of the same individual n. The de dicto node does not name n, and the tertia via node gives the box only with excluded middle, so neither weak version yields the frame-class node." }

