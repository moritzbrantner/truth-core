id = "MODAL-FORK-S4"
label = "NECESSARY_2 in S4 for the root, from the T and 4 schemas by correspondence"
theorem = "forkS4"
premises = ["STMT-MODAL-STANDARD-CORRESPONDENCE-CERTIFICATE", "STMT-MODAL-HIJK-CONVERGENCE-CERTIFICATE", "STMT-NECESSARY-ROOT-BOX-K", "STMT-ONTIC-T-SCHEMA", "STMT-ONTIC-4-SCHEMA", "STMT-INTENDED-BOX-S4"]
conclusion = "STMT-NECESSARY-ROOT-ON-INTENDED-READING"
rule = "Theorem application (T correspondence; 4 correspondence of the convergence certificate), conjunction and existential introduction"
meaning = "S4 branch of the 'necessary' sense fork with its frame condition derived: the K node, the OPEN T and 4 schemas on the route's frame and the OPEN reading premise (box-existence in S4, and only that) give the fork node. Reflexivity comes from the T correspondence (MODAL-STANDARD-CORRESPONDENCE-CERTIFICATE), transitivity from the 4 correspondence of the ConvergenceCertificate (MODAL-HIJK-CONVERGENCE-CERTIFICATE). Without the 4 schema the branch fails on a reflexive non-transitive chain (controls)."
strong_version_needed = { "STMT-NECESSARY-ROOT-BOX-K" = "The frame-class readings are box-existence of the same individual n. The de dicto node does not name n, and the tertia via node gives the box only with excluded middle, so neither weak version yields the frame-class node." }

