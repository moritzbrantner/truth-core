[[relation]]
id = "REL-NO-DISTINCT-CAUSERS-REFUTES-DITHEISM"
label = "Two NECESSARY_2 universal potential causers cannot be distinct (refutes modal ditheism)"
subject_kind = "argument"
subject_id = "NECESSARY-POTENTIAL-CAUSERS-NOT-DISTINCT"
predicate = "refutes"
object_kind = "statement"
object_id = "STMT-MODAL-DITHEISM"
note = "Conditional refutation: the existing verified result concludes NoDistinctNecessaryPotentialCausers, which is equivalent to the negation of STMT-MODAL-DITHEISM (MODAL-FORK-CONTROLS, RivalNegations). Its premises STMT-ACTUAL-MODAL-REFLEXIVITY and STMT-WELL-FOUNDED-UNION-NECESSARY-SUPPORT are OPEN, so it does not count for closure. Not recorded as alternative_to a root premise: the route's uniqueness is God-uniqueness (IsTheOneGod), and no bridge identifies necessary universal potential causers with God."

[[relation]]
id = "REL-SIMPLICITY-CORE-REFUTES-STRICT-CONTINGENT"
label = "No act done at every accessible world strictly yields a contingent effect"
subject_kind = "argument"
subject_id = "SIMPLICITY-COLLAPSE-CORE"
predicate = "refutes"
object_kind = "statement"
object_id = "STMT-NECESSARY-ACT-STRICT-CONTINGENT"
note = "Unconditional (in the frame semantics): SIMPLICITY-COLLAPSE-CORE has no premises and its first clause excludes STMT-NECESSARY-ACT-STRICT-CONTINGENT (MODAL-FORK-CONTROLS, RivalNegations). It constrains the root route's account of creation (#462, #555): a necessary root whose act is performed at every accessible world cannot create contingently by a strictly efficacious act. It is not a rival of a root premise, so no alternative_to is recorded."
