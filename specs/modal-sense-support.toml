[[argument]]
id = "MODAL-FORK-CONTROLS"
label = "Finite models for the modal-principle branches of the NECESSARY_2 sense fork"
theorem = "controls"
premises = []
conclusion = "STMT-MODAL-FORK-CONTROLS"
rule = "Correspondence certificates (existing proofs) and explicit finite interpretations"
meaning = "Nonvacuity on a one-point universal frame (the four schemas are valid there by the existing correspondence proofs), one omission model per load-bearing premise of the four branches (T, 4, B and 5 schemas, reading choice, K node), and the exact negations of the two recorded rivals. Formal only; no model describes reality. Frames are hand-written (Bool, Nat, Unit), no Mathlib order instance."
