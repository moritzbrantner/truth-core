[[argument]]
id = "Closed grounding collections rooted, from attenuated per se reception of esse"
theorem = "closedRootedOfAttenuation"
premises = ["Actual esse is received per se with uniform loss and a common bound"]
conclusion = "Every ground-closed collection of actual CONCRETE_6 with no actual root is empty"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Composition with QuantitativeTransferPaths.finitePath: positive esse at a member gives a finite path of positive receptions to a thing with positive own esse; each reception is an actual grounding edge, so the path stays in the ground-closed collection and ends at an actual root"
meaning = "A per se argument for the closed-collection condition that can fail: if being is received only along actual grounding, each reception passes on at most a fixed fraction q < 1, all amounts share a common bound, every actual concretum has positive being and only roots have being of their own, then every ground-closed collection is rooted. Dropping uniform loss or the bound breaks the inference (existing controls binaryFixed, halfFixed). Uses Mathlib real analysis; conditional consequence only, with no calibration of the quantities."

[[argument]]
id = "Closed-collection controls, checked"
theorem = "controls"
premises = []
conclusion = "Closed-collection controls: limit grounder, pure regress, rooted cycle, attenuation witness"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit interpretations checked by case analysis and accessibility induction"
meaning = "Controls for the batch. The limit grounder shows the closed-collection condition is strictly weaker than AGWF, does not give J2 even with reflexive access and no-novel-edge, and is jointly satisfiable with the premises of the coverage routes; it also shows ascent along a grade with a maximum is compatible with infinite ascent, so the grade maximum does not give no infinite ascent. The pure regress is an omission countermodel for the closed-collection condition in the from-necessity coverage routes. The rooted cycle shows it does not give asymmetry, and with reflexive access and no-novel-edge does not exclude mutual support between necessary concreta. The point witness shows the attenuation bridge is satisfiable (without a grounding edge). Model-witnessed only; no interpretation is claimed metaphysically possible."

