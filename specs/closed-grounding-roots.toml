# Closed grounding collections have a root (#310). Analyst formulations,
# attribution deferred. Finds the weakest no-infinite-regress commitment the
# stage-one join consumes: every route through well-founded actual grounding
# (AGWF) uses it only to find an actual root, and the closed-collection
# condition supplies exactly that. Registers AGWF => closed-collection as a
# strength order (strict: limit grounder), reroutes the four AGWF join routes
# and the necessary-concretum step through it, and connects the per se
# attenuation library (#1379) to the join through it.

[batch]
vocab = "TruthCore.Causality.ClosedGroundingRoots"
results = "TruthCore.Results.Causality.ClosedGroundingRoots"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Every ground-closed collection of actual CONCRETE_6 with no actual root is empty"
lean = "ClosedGroundingCollectionsRooted"
paraphrase = "Open premise, analyst formulation, unattributed: at the selected world w, no collection of actual concreta that contains every actual concrete ground of each of its members is both nonempty and without an actual root. In Lean: for every predicate S on candidates, if every member of S is an actual concretum at w, every actual concrete ground at w of a member of S is in S, and no member of S is an actual root (an actual concretum with no actual concrete ground at w), then nothing is in S. The weak version of STMT-ACTUAL-GROUNDING-WF: it allows endless descending chains and cycles of grounds as long as a root grounds into them, and it imposes no asymmetry or finite-path condition."
definitions = ["Closed-collection rootedness of actual grounding", "008cb21a-256c-5a90-822c-acd4591d699a"]
disambiguations = ["623ddbf6-9683-5361-bae4-e348a00ec680"]

[[statement]]
id = "Actual esse is received per se with uniform loss and a common bound"
lean = "AttenuatedEsseReception"
paraphrase = "Open bridge, analyst formulation, unattributed: the actual concreta at w are countable and carry real quantities such that every actual concretum has a positive amount of esse at most a common bound M; its esse is at most its own esse plus the weighted esse of the things it receives from, with nonnegative summable weights whose total for each receiver is at most a fixed q < 1; it receives with positive weight only from its actual concrete grounds; and only an actual concretum with no actual concrete ground has positive own esse. The quantities carry no real-world calibration."
definitions = ["Attenuated per se reception of esse", "008cb21a-256c-5a90-822c-acd4591d699a", "DEF-ESSE"]
disambiguations = ["623ddbf6-9683-5361-bae4-e348a00ec680"]

[[statement]]
id = "No supply-closed collection of actual CONCRETE_6 is wholly borrowed"
lean = "NoWhollyBorrowedCollection"
paraphrase = "Open premise, analyst formulation, unattributed: at the selected world w, every collection of actual concreta that contains every candidate existing at w that grounds a member at w (concrete or not), and each of whose members is grounded by some candidate existing at w, is empty. The collection form of the borrowed-reality principle over all modelled actual suppliers of the selected direct relation; suppliers outside that relation are not modelled."
definitions = ["No wholly borrowed collection of actual concreta", "008cb21a-256c-5a90-822c-acd4591d699a"]
disambiguations = ["623ddbf6-9683-5361-bae4-e348a00ec680"]

[[statement]]
id = "Every actual supplier of an actual CONCRETE_6 thing is CONCRETE_6"
lean = "ActualSuppliersOfConcretaConcrete"
paraphrase = "Open bridge, analyst formulation, unattributed: at the selected world w, every candidate existing at w that stands in the selected relation at w to an actual concretum is concrete. Grounds or explanations outside the selected relation are not constrained."
definitions = ["Actual suppliers of actual concreta are concrete", "008cb21a-256c-5a90-822c-acd4591d699a"]
disambiguations = ["623ddbf6-9683-5361-bae4-e348a00ec680"]

[[statement]]
id = "Closed-collection controls: limit grounder, pure regress, rooted cycle, attenuation witness"
lean = "Control.Controls"
paraphrase = "Closed controls on explicit finite-or-countable interpretations with one world. (1) Direct root grounder (Lean name limitGrounder): candidates none and some n; some (n+1) grounds some n and none directly grounds every some n. The closed-collection condition, inhabitedness, grounding of every actual contingent concretum, reflexive access, J1, its actual-world instance, coverage and the one-way no-novel-edge condition hold, and some necessary concretum is underived at every admitted world; actual grounding ascends a grade whose top is none; but actual grounding is not well-founded, J2 fails and the grade has infinite ascent among actual concreta. (2) Pure regress: candidates Nat, n+1 grounds n. The closed-collection condition fails while a necessary concretum, grounding of every actual contingent concretum, J1, its actual-world instance, coverage and ascent along a grade hold, and no necessary concretum is underived. (3) Rooted cycle: none grounds some false and some true, which ground each other; the closed-collection condition, reflexive access and the one-way no-novel-edge condition hold while asymmetry and well-foundedness of actual grounding fail and two necessary concreta support each other. (4) A one-point interpretation with no grounding satisfies the attenuation bridge. (5) Mediate foundation: some (n+1) directly grounds some n and the root none directly grounds nothing; the closed-collection condition fails although an actual root exists. (6) Abstract supplier: none is not concrete and grounds every some n, and some (n+1) grounds some n; the borrowed-reality principle over all modelled suppliers holds while the concrete-supplier bridge and the closed-collection condition fail. Statements about these interpretations only."
definitions = ["Closed-collection rootedness of actual grounding", "Attenuated per se reception of esse"]

