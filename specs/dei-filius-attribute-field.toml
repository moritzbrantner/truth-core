[[statement]]
id = "2c9a963f-4c4a-402a-bd0c-f017e25ec413"
label = "One-being controls for the Dei Filius sufficiency bridges"
lean = "Control.Controls"
paraphrase = "Closed controls on one-being interpretations whose single being is God, with Unit respects and principles: (1) every premise of nineGiveDeiFilius holds and the being has the nine and every Dei Filius attribute; (2) for each of nine of its ten premises (all but goodness-is-actuality: living, lord, almighty, immense, incomprehensible, blessed, no component, excess in act, matter-form composition) an interpretation where every other premise holds and the being has the nine but not every Dei Filius attribute; (3) an interpretation where the field interpretation holds while STMT-CLASSICAL-ATTRIBUTES-SUFFICE fails. Statements about these interpretations only."
definitions = ["a82e5be5-be22-4504-8f0f-fd0732884d83"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "1fa790f2-9e45-4861-a9b7-cdbd2139c69d"
label = "The nine give every typed Dei Filius attribute, from seven bridges"
theorem = "nineGiveDeiFilius"
strong_version_needed = { "bb3d4417-b2f6-4310-9433-21ff2e386780" = "The weak version 'Whatever is LORD_2 is LORD_1' needs its antecedent LORD_2 (causing the being of and governing everything else); this route derives creatorhood but not governance, so it uses the strong version. The route through LORD_2 is the DeiFiliusLordBlessed batch (specs/dei-filius-lord-blessed.toml).", "dc3ec456-9fd1-4e1a-8690-c529fe831ee2" = "The weak version 'Whatever is BLESSED_2 is BLESSED_1' needs its antecedent BLESSED_2 (including act in understanding); this route does not derive act in understanding, so it uses the strong version. The route through BLESSED_2 is the DeiFiliusLordBlessed batch (specs/dei-filius-lord-blessed.toml).", "c7c32f20-2637-4497-8053-f259d02aa922" = "The weak version 'Whatever is IMMENSE_2 is IMMENSE_1' needs its antecedent IMMENSE_2 and the sense passage from IMMENSE_2; this route was registered before that sense and its frozen Challenge takes the strong version (its infinity conjunct is available here, so the strong version is not needed in substance). The route through IMMENSE_2 is the DeiFiliusImmenseIncomprehensible batch (specs/dei-filius-immense-incomprehensible.toml).", "fa3f08a8-aa2f-4385-8c72-4343eb5409c0" = "The weak version 'Whatever is INCOMPREHENSIBLE_2 is INCOMPREHENSIBLE_1' needs its antecedent INCOMPREHENSIBLE_2 (no caused intellect comprehends the being); this route does not derive that, so it uses the strong version. The route through INCOMPREHENSIBLE_2 is the DeiFiliusImmenseIncomprehensible batch (specs/dei-filius-immense-incomprehensible.toml)." }
premises = ["8d2ac441-9b89-45ee-b8f6-db3522e0bafa", "bb3d4417-b2f6-4310-9433-21ff2e386780", "STMT-INFINITE-ACT-HAS-INFINITE-POWER", "c7c32f20-2637-4497-8053-f259d02aa922", "fa3f08a8-aa2f-4385-8c72-4343eb5409c0", "dc3ec456-9fd1-4e1a-8690-c529fe831ee2", "e919fe2e-2563-44bb-9eba-16c8199fa477", "8d73ef90-8260-4c45-b2ed-577630c760a7", "STMT-GOODNESS-IS-ACTUALITY", "STMT-MATTER-FORM-AND-ESSE-ESSENCE-ARE-COMPOSITIONS"]
conclusion = "5fbea2f5-0446-4852-9bd4-74fd0878755f"
axioms = []
rule = "Per-conjunct derivation at an arbitrary being: projection of the nine, unfolding of supreme goodness, and one bridge per remaining conjunct"
meaning = "At any being g with the nine: one, eternal, intellect, will, perfect, infinite, simple, immutable and supremely good are the nine themselves. Creator of all is contained by definition in the goodness conjunct (the case's IsSupremelyGood includes causing every perfection of everything else, so its being; a strengthening of DS 3002's goodness), not derived from it in a substantive sense. Spiritual (not composed of matter and form) follows from simplicity and the matter-form clause of the q.3 a.7 composition premise. Maximal in being follows from goodness-is-actuality (good as to being gives in act as to being) and the excess-in-act bridge against universal perfection: anything more in being would be in act in a respect g lacks, which perfection excludes. Almighty follows from infinity through the existing infinite-power premise. Living (LIVING_1), lord, immense, incomprehensible, most blessed and remote from all (a different reading of distinctness from the world) each use one open bridge, from intellect, creator, creator, infinity, perfection with intellect, and creator respectively. All in the typed reading of definition edcfac86. The controls show that each premise except goodness-is-actuality is needed here. Conditional consequence only; no premise is established."

[[argument]]
id = "37d529f4-68c5-457b-a1ce-3d7bfc392db7"
label = "The nine suffice for the field, from the Dei Filius restatement"
theorem = "classicalAttributesSufficeOfDeiFilius"
premises = ["5fbea2f5-0446-4852-9bd4-74fd0878755f", "dfc3cbae-f00f-4861-a5f6-f5aecec4c157"]
conclusion = "STMT-CLASSICAL-ATTRIBUTES-SUFFICE"
axioms = []
rule = "Composition of two one-way implications at each being"
meaning = "A being with the nine has every typed Dei Filius attribute by the restated sufficiency, and so the primitive field by the field interpretation. This gives STMT-CLASSICAL-ATTRIBUTES-SUFFICE its first derivation, but it relocates rather than discharges the warrant: part of it moves into the field interpretation, a stipulation about an undefined primitive. On the full-list reading of the field (CLASSICAL_FIELD_2) the warrant gap becomes the field interpretation plus the seven bridges of nineGiveDeiFilius (with three existing premises). On the nine-reading (CLASSICAL_FIELD_1, the one Root.lean documents) the old premise is close to analytic and the bridges do no work for it. Conditional consequence only; no premise is established."

# Not registered: the Lean lemma fieldOfSuffice (the old premise gives the field
# interpretation; strictness in Control.Controls part 3). Lake-checked only. As a
# corpus argument it would close a support cycle with the argument above (old
# premise <- field interpretation + restated sufficiency; field interpretation <-
# old premise), and the frontier would then stop listing the field interpretation
# as an open leaf. No strength-order relation either: the strength order is for
# strong and weak versions of one ambiguous proposition (a strength fork), which
# these two premises are not, and a strengthens relation would need fieldOfSuffice
# registered as its verification result, recreating the cycle.

[[argument]]
id = "334e8640-b53d-429d-8094-426cd01800cc"
label = "The NECESSARY_2 GOD_4 root has every typed Dei Filius attribute, from the join"
theorem = "deiFiliusRoot"
strong_version_needed = { "bb3d4417-b2f6-4310-9433-21ff2e386780" = "The weak version 'Whatever is LORD_2 is LORD_1' needs its antecedent LORD_2 (causing the being of and governing everything else); this route derives creatorhood but not governance, so it uses the strong version. The route through LORD_2 is the DeiFiliusLordBlessed batch (specs/dei-filius-lord-blessed.toml).", "dc3ec456-9fd1-4e1a-8690-c529fe831ee2" = "The weak version 'Whatever is BLESSED_2 is BLESSED_1' needs its antecedent BLESSED_2 (including act in understanding); this route does not derive act in understanding, so it uses the strong version. The route through BLESSED_2 is the DeiFiliusLordBlessed batch (specs/dei-filius-lord-blessed.toml).", "c7c32f20-2637-4497-8053-f259d02aa922" = "The weak version 'Whatever is IMMENSE_2 is IMMENSE_1' needs its antecedent IMMENSE_2 and the sense passage from IMMENSE_2; this route was registered before that sense and its frozen Challenge takes the strong version (its infinity conjunct is available here, so the strong version is not needed in substance). The route through IMMENSE_2 is the DeiFiliusImmenseIncomprehensible batch (specs/dei-filius-immense-incomprehensible.toml).", "fa3f08a8-aa2f-4385-8c72-4343eb5409c0" = "The weak version 'Whatever is INCOMPREHENSIBLE_2 is INCOMPREHENSIBLE_1' needs its antecedent INCOMPREHENSIBLE_2 (no caused intellect comprehends the being); this route does not derive that, so it uses the strong version. The route through INCOMPREHENSIBLE_2 is the DeiFiliusImmenseIncomprehensible batch (specs/dei-filius-immense-incomprehensible.toml)." }
