# Stage two of the modal spine: the sufficiency premise
# STMT-CLASSICAL-ATTRIBUTES-SUFFICE restated against a DEFINED predicate, the
# Dei Filius attributes (Vatican I, Dei Filius ch. 1, DS 3001-3002, as recorded
# in claim VATICAN-I-DEI-FILIUS-CH1-ONE-TRUE-LIVING-GOD), in the typed reading of
# definition edcfac86. The primitive skeleton field stays undefined; its intended
# content is the fork CLASSICAL_FIELD (the nine, as Root.lean documents, or the
# full Dei Filius list). Analyst formulations, attribution deferred.
# Registers: the nine give the typed Dei Filius attributes from seven open
# bridges and three existing premises; the old premise from the restated one and
# the field interpretation (full-list reading); the spine's root with the typed
# Dei Filius attributes from the registered composition's inputs without the
# sufficiency premise plus five new bridges and the existing infinite-power
# premise; the old endpoint from the new one and the field interpretation;
# one-being controls. No strength-order relation is registered (see below).
# Handles of generated records are their uuids, so labels can be revised.

[batch]
vocab = "TruthCore.Causality.DeiFiliusAttributeField"
results = "TruthCore.Results.Causality.DeiFiliusAttributeField"

# ---------------------------------------------------------------- statements

[[statement]]
id = "5fbea2f5-0446-4852-9bd4-74fd0878755f"
label = "The nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes give every typed Dei Filius attribute"
lean = "NineSufficeForDeiFilius"
paraphrase = "Open premise, analyst formulation, unattributed: every being that is simple, perfect, supremely good, the one God, infinite, altogether immutable, eternal, and has intellect and will has every Dei Filius attribute in the typed reading of definition edcfac86 (DeiFiliusAttributes: one, living, creator of all, lord, almighty, eternal, immense, incomprehensible, intellect, will, perfect, infinite, simple, immutable, spiritual, remote from all, most blessed, maximal in being, supremely good). That reading is weaker than the text for some attributes, stronger for goodness, and a different reading for distinctness from the world. The sufficiency premise STMT-CLASSICAL-ATTRIBUTES-SUFFICE restated against the defined predicate instead of the primitive field. Ten conjuncts are among the nine or contained in them by definition; the others need open bridges (nineGiveDeiFilius). It supplies no existence witness and does not give that the being is God."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "edcfac86-6c19-4c82-9dfa-79bbf3287e6f", "92c03350-6809-497d-b123-2ffb11c0e0c1", "0d9dcc31-4d9c-45cc-93fe-fd0369fd9834", "4e0d3bdf-95b6-4b56-91f9-7026f591819d", "DEF-ACTIVE-POWER-TASK-VOCABULARY", "f91f5056-8a32-416b-b234-d0e78cd16ce8", "DEF-REMOTE-FROM-ALL", "DEF-MAXIME-ENS"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "1f2d3b9b-0b6b-459c-8871-3f136ad6d78a", "2cbf40b4-3ea9-47a3-b532-7085ba3b53fa"]

[[statement]]
id = "dfc3cbae-f00f-4861-a5f6-f5aecec4c157"
label = "Whatever has every typed Dei Filius attribute has the primitive classical-attributes field"
lean = "FieldFromDeiFilius"
paraphrase = "Open premise, analyst formulation: every being that has every Dei Filius attribute in the typed reading of definition edcfac86 (DeiFiliusAttributes) has the skeleton's primitive field HasClassicalAttributes. The field interpretation on the full-list reading CLASSICAL_FIELD_2, stated one-way with no converse. It is not what Root.lean documents: there the field is 'intended to group simplicity, perfection, goodness, infinity, immutability, eternity, unity, intellect and will', the nine (CLASSICAL_FIELD_1), on which reading this premise follows at once. The Dei Filius motivation is in ClassicalAttributesSuffice's docstring, DEF-CLASSICAL-ATTRIBUTES-BUNDLE and the claim. It is strictly weaker than STMT-CLASSICAL-ATTRIBUTES-SUFFICE by the Lean lemma fieldOfSuffice (lake-checked; not a registered result, so not Comparator-verified) and Control.Controls part 3. It supplies no existence witness."
definitions = ["edcfac86-6c19-4c82-9dfa-79bbf3287e6f", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE", "DEF-GOD-OF-CLASSICAL-THEISM"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "2cbf40b4-3ea9-47a3-b532-7085ba3b53fa"]

[[statement]]
id = "8d2ac441-9b89-45ee-b8f6-db3522e0bafa"
label = "Whatever HAS_INTELLECT_1 is LIVING_1"
lean = "IntellectualIsLiving"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever has intellect lives (LIVING_1: operates from itself, timelessly). After ST I q.18 a.3, where understanding is the highest grade of life and life is grounded in intellect. Not identified with STMT-PURE-ACT-LIVES or the route SelfOperationLife, which conclude LIVING_2 (life present at some time of a duration frame) from the absence of potency, nor with STMT-THINKER-LIVES (bearers of occurring thoughts)."
definitions = ["f91f5056-8a32-416b-b234-d0e78cd16ce8", "DEF-HAS-INTELLECT"]
disambiguations = ["DISAMB-INTELLECT-AND-SENSE-COGNITION", "1f2d3b9b-0b6b-459c-8871-3f136ad6d78a"]

[[statement]]
id = "bb3d4417-b2f6-4310-9433-21ff2e386780"
label = "Whatever causes the being of everything else is LORD_1 of everything else"
lean = "CreatorOfAllIsLord"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever causes the being of everything else that is in act as to being has dominion over everything else. After ST I q.13 a.7, where 'Lord' is said of God relative to creatures, which are subject to him as their cause."
definitions = ["92c03350-6809-497d-b123-2ffb11c0e0c1", "59350e3b-1b76-45cd-b9fd-548f3f4658b5"]
disambiguations = ["DISAMB-IN-ACT", "aa1de96a-e0d2-4739-a34f-9b98f1034a34"]

[[statement]]
id = "c7c32f20-2637-4497-8053-f259d02aa922"
label = "Whatever causes the being of everything else is IMMENSE_1"
lean = "CreatorOfAllIsImmense"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever causes the being of everything else that is in act as to being is contained by no place and present to everything. After ST I q.8 a.1-2: God is in all things as an agent is present to its effect, and in every place by giving it being."
definitions = ["92c03350-6809-497d-b123-2ffb11c0e0c1", "bf2f30d1-609f-4b23-b819-786d877b949c"]
disambiguations = ["DISAMB-IN-ACT", "3fc3ee02-c3cc-4a61-9724-914d9d07b0dd"]

[[statement]]
id = "fa3f08a8-aa2f-4385-8c72-4343eb5409c0"
label = "Whatever is INFINITE_1 is INCOMPREHENSIBLE_1"
lean = "InfiniteIsIncomprehensible"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever is infinite (INFINITE_1, unreceived subsistent being) is known by no created intellect as perfectly as it is knowable. After ST I q.12 a.7: God is infinitely knowable and a created intellect knows finitely."
definitions = ["DEF-INFINITE", "c4cf79f1-60a9-498a-944b-aeb7dfb56573"]
disambiguations = ["DISAMB-INFINITY", "d63d0696-e5fb-4c85-932e-812989c83b29"]

[[statement]]
id = "dc3ec456-9fd1-4e1a-8690-c529fe831ee2"
label = "Whatever is PERFECT_2 and HAS_INTELLECT_1 is BLESSED_1"
lean = "PerfectIntellectualIsMostBlessed"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever is universally perfect (in act in every respect in which anything is in act) and has intellect has, in itself, the perfect good of an intellectual nature. After ST I q.26 a.1."
definitions = ["DEF-UNIVERSALLY-PERFECT", "DEF-HAS-INTELLECT", "5068b909-d6b0-458b-a3d7-30fd2f7088a8"]
disambiguations = ["DISAMB-IN-ACT", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "70f4f510-d488-445f-86cf-03b889507372"]

[[statement]]
id = "e919fe2e-2563-44bb-9eba-16c8199fa477"
label = "Whatever causes the being of everything else enters into the composition of nothing"
lean = "CreatorOfAllIsNoComponent"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever causes the being of everything else that is in act as to being is a component of nothing (RemoteFromAll). After ST I q.3 a.8's first reason: the first efficient cause is not numerically one with the form or matter of what it makes. Q.3 a.8 itself reports three contrary positions (God as world-soul, via Augustine; God as the formal principle of all things, the Amalricians; God as prime matter, David of Dinant) and, in obj. 1, Dionysius' 'the being of all is the deity'. RemoteFromAll is a different reading of Dei Filius's 'really and essentially distinct from the world', not that attribute: the anti-pantheist content is untyped."
definitions = ["92c03350-6809-497d-b123-2ffb11c0e0c1", "DEF-REMOTE-FROM-ALL"]
disambiguations = ["DISAMB-IN-ACT"]

[[statement]]
id = "8d73ef90-8260-4c45-b2ed-577630c760a7"
label = "What is more in being than another is in act in some respect the other is not"
lean = "ExcessInBeingIsExcessInAct"
paraphrase = "Open bridge, analyst formulation, unattributed: whenever y is more in being than x, y is in act in some respect in which x is not. After the reading of grades of being as grades of act (ST I q.4 a.2; q.2 a.3, quarta via). Interpretation gap: with the binary InAct, things in act in the same respects cannot differ in being, so a reading on which grades are intensities of one act makes this bridge fail unless respects separate grades."
definitions = ["DEF-MAXIME-ENS"]
disambiguations = ["DISAMB-IN-ACT"]

