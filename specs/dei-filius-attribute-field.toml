lean = "Control.Controls"
paraphrase = "Closed controls on one-being interpretations whose single being is God, with Unit respects and principles: (1) every premise of nineGiveDeiFilius holds and the being has the nine and every Dei Filius attribute; (2) for each of nine of its ten premises (all but goodness-is-actuality: living, lord, almighty, immense, incomprehensible, blessed, no component, excess in act, matter-form composition) an interpretation where every other premise holds and the being has the nine but not every Dei Filius attribute; (3) an interpretation where the field interpretation holds while STMT-CLASSICAL-ATTRIBUTES-SUFFICE fails. Statements about these interpretations only."
definitions = ["a82e5be5-be22-4504-8f0f-fd0732884d83"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "The nine give every Dei Filius attribute, from seven bridges"
theorem = "nineGiveDeiFilius"
premises = ["Whatever HAS_INTELLECT_1 lives", "Whatever causes the being of everything else is lord of everything else", "STMT-INFINITE-ACT-HAS-INFINITE-POWER", "Whatever causes the being of everything else is immense", "Whatever is INFINITE_1 is incomprehensible", "Whatever is PERFECT_2 and HAS_INTELLECT_1 is most blessed", "Whatever causes the being of everything else enters into the composition of nothing", "What is more in being than another is in act in some respect the other is not", "STMT-GOODNESS-IS-ACTUALITY", "STMT-MATTER-FORM-AND-ESSE-ESSENCE-ARE-COMPOSITIONS"]
conclusion = "The nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes give every Dei Filius attribute"
axioms = []
rule = "Per-conjunct derivation at an arbitrary being: projection of the nine, unfolding of supreme goodness, and one bridge per remaining conjunct"
meaning = "At any being g with the nine: one, eternal, intellect, will, perfect, infinite, simple, immutable and supremely good are the nine themselves. Creator of all unfolds supreme goodness (IsSupremelyGood includes causing every perfection of everything else, so its being). Spiritual (not composed of matter and form) follows from simplicity and the matter-form clause of the q.3 a.7 composition premise. Maximal in being follows from goodness-is-actuality (good as to being gives in act as to being) and the excess-in-act bridge against universal perfection: anything more in being would be in act in a respect g lacks, which perfection excludes. Almighty follows from infinity through the existing infinite-power premise. Living, lord, immense, incomprehensible, most blessed and remote from all each use one open bridge, from intellect, creator, creator, infinity, perfection with intellect, and creator respectively. The controls show that each premise except goodness-is-actuality is needed here. Conditional consequence only; no premise is established."

[[argument]]
id = "The nine suffice for the field, from the Dei Filius restatement"
theorem = "classicalAttributesSufficeOfDeiFilius"
premises = ["The nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes give every Dei Filius attribute", "Whatever has every Dei Filius attribute has the primitive classical-attributes field"]
conclusion = "STMT-CLASSICAL-ATTRIBUTES-SUFFICE"
axioms = []
rule = "Composition of two one-way implications at each being"
meaning = "A being with the nine has every Dei Filius attribute by the restated sufficiency, and so the primitive field by the field interpretation. This gives STMT-CLASSICAL-ATTRIBUTES-SUFFICE its first derivation: its warrant gap becomes the field interpretation plus the seven bridges of nineGiveDeiFilius (with three existing premises). Conditional consequence only; no premise is established."

# Not registered: the Lean lemma fieldOfSuffice (the old premise gives the field
# interpretation; strictness in Control.Controls part 3). As a corpus argument it
# would close a support cycle with the argument above (old premise <- field
# interpretation + restated sufficiency; field interpretation <- old premise), and
# the frontier would then stop listing the field interpretation as an open leaf.
# No strength-order relation either: the corpus's strength order marks a weak
# version usable in place of the strong one, which does not hold here.

[[argument]]
id = "The NECESSARY_2 GOD_4 root has every Dei Filius attribute, from the join"
theorem = "deiFiliusRoot"
premises = ["0bdcf366-29c7-5d45-b603-5c929dcad976", "ee4ab504-c8fe-59bc-bc96-7cbeefed6410", "da09703b-0b1e-5dca-9dd7-6c0c8d1610d7", "0436de86-6579-53f2-9ff5-2111ba44ebae", "cb1cdea9-eb6c-578c-8008-84e0d4107fd3", "e4e6b0cd-f61a-5605-a302-573c67cf063a", "7067553d-cad9-5d79-b6b2-912e35051530", "64498e7e-7f10-54a0-9ec0-c65e6076de1f", "00e962ae-f109-55f7-a7fd-f107ce0dea6b", "b26c10a0-983d-5a88-aa03-cc601bc1ddc6", "ca07cae9-6102-564e-a7fd-efb013744b3d", "d7741cdc-881b-5bda-85ce-d70223162f78", "86efed1a-f353-5b5d-9431-df7fc643ace1", "09c6d5f0-d412-5038-85f9-75fffb935727", "180f5ad2-a421-541a-85c9-9bca578b4a43", "090be689-b77f-51a1-9d5d-caf339169e4b", "3b2d2d46-baa6-4772-a2db-bb3daeb092fc", "c6d6379b-6a9b-55b5-a701-3df289dfcca4", "75a37a91-732d-510c-9abc-b37c988c5c63", "0659227c-0979-579c-910b-03a1967f49c5", "1ec205ed-b2a6-5384-bb5f-2565a9d325bf", "4c79298d-ee09-5e99-9ced-1be92c19b4cc", "Whatever HAS_INTELLECT_1 lives", "Whatever causes the being of everything else is lord of everything else", "STMT-INFINITE-ACT-HAS-INFINITE-POWER", "Whatever causes the being of everything else is immense", "Whatever is INFINITE_1 is incomprehensible", "Whatever is PERFECT_2 and HAS_INTELLECT_1 is most blessed"]
sense_bridges = [
  { term = "GOD", from = "295c9096-50b8-4ccd-960e-f833730a0774", to = "52c2ebac-0a71-4dd4-8a21-804c1dd0847a", statement_id = "1ec205ed-b2a6-5384-bb5f-2565a9d325bf" },
]
conclusion = "One selected NECESSARY_2 root is GOD_4 with every Dei Filius attribute"
axioms = []
rule = "Composition of the registered join-to-stage-two result on a signature whose primitive field is trivial, then per-conjunct derivation at the same witness"
meaning = "The registered composition (result 57213a13) is applied with every one of its inputs except the sufficiency premise, on the signature that agrees with the given one except that its primitive field is everywhere true; its sufficiency premise then holds trivially there and nothing about the field is used. Its root n is the same witness: an actual root at w, the only one, NECESSARY_2, maximal in being and perfect, with esse/essence identity, firstness, no matter-form composition, remoteness from all, GOD_4 and the nine. At n, remote from all gives 'distinct from the world', no matter-form composition gives 'spiritual', the maximum in being gives 'exalted', supreme goodness gives 'creator of all', infinity gives 'almighty' through the existing infinite-power premise, and living, lord, immense, incomprehensible and most blessed take one open bridge each. At the root only these six premises (five new bridges and the existing infinite-power premise) are added to the composition's own inputs; the no-component and excess-in-act bridges of nineGiveDeiFilius are not needed. Uniqueness is among actual roots at w. Conditional consequence only; no premise is established."

[[argument]]
id = "The NECESSARY_2 classical GOD_4 root, from the Dei Filius root and field"
theorem = "classicalRootOfDeiFiliusRoot"
premises = ["One selected NECESSARY_2 root is GOD_4 with every Dei Filius attribute", "Whatever has every Dei Filius attribute has the primitive classical-attributes field"]
conclusion = "STMT-NECESSARY-CLASSICAL-GOD-ROOT"
axioms = []
rule = "Projection of the nine and application of the field interpretation at the same witness"
meaning = "The root of the Dei Filius endpoint has the nine (they are among its attributes) and, by the field interpretation, the primitive field: the old endpoint at the same witness. With deiFiliusRoot this gives a route to the old endpoint in which the sufficiency premise is replaced by the field interpretation, five new bridges and the existing infinite-power premise. Conditional consequence only."

[[argument]]
id = "One-being controls for the Dei Filius sufficiency bridges, checked"
theorem = "controls"
premises = []
conclusion = "One-being controls for the Dei Filius sufficiency bridges"
axioms = []
rule = "Explicit one-being interpretations, checked by unfolding"
meaning = "Nonvacuity: the premises of nineGiveDeiFilius are jointly satisfiable with a being that has the nine and every Dei Filius attribute. Necessity in that theorem: for each of its ten premises except goodness-is-actuality, a one-being interpretation satisfies all the others and the nine at the one being, while some Dei Filius attribute fails there; so none of those nine premises is supplied by the rest. Strictness: an interpretation where the field interpretation holds vacuously (no Dei Filius being) while the old sufficiency premise fails. Model-witnessed facts about these interpretations only; they show where each premise is needed, not that it is false or doubtful."

