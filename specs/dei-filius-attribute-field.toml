# Stage two of the modal spine: the sufficiency premise
# STMT-CLASSICAL-ATTRIBUTES-SUFFICE restated against a DEFINED predicate, the
# Dei Filius attributes (Vatican I, Dei Filius ch. 1, DS 3001-3002, as recorded
# in claim VATICAN-I-DEI-FILIUS-CH1-ONE-TRUE-LIVING-GOD), in place of the
# primitive skeleton field. Analyst formulations, attribution deferred.
# Registers: the nine give the Dei Filius attributes from seven open bridges and
# three existing premises; the old premise from the restated one and the field
# interpretation; the old premise strengthens the field interpretation; the
# spine's root with the Dei Filius attributes from the registered composition's
# inputs without the sufficiency premise plus six bridges; the old endpoint from
# the new one and the field interpretation; one-being controls.

[batch]
vocab = "TruthCore.Causality.DeiFiliusAttributeField"
results = "TruthCore.Results.Causality.DeiFiliusAttributeField"

# ---------------------------------------------------------------- statements

[[statement]]
id = "The nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes give every Dei Filius attribute"
lean = "NineSufficeForDeiFilius"
paraphrase = "Open premise, analyst formulation, unattributed: every being that is simple, perfect, supremely good, the one God, infinite, altogether immutable, eternal, and has intellect and will has every Dei Filius attribute (DeiFiliusAttributes: one, living, creator of all, lord, almighty, eternal, immense, incomprehensible, intellect, will, perfect, infinite, simple, immutable, spiritual, remote from all, most blessed, maximal in being, supremely good). The sufficiency premise STMT-CLASSICAL-ATTRIBUTES-SUFFICE restated against the defined predicate instead of the primitive field. Ten conjuncts are among the nine or follow from them by definition; the others need open bridges (nineGiveDeiFilius). It supplies no existence witness and does not give that the being is God."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "edcfac86-6c19-4c82-9dfa-79bbf3287e6f", "92c03350-6809-497d-b123-2ffb11c0e0c1", "0d9dcc31-4d9c-45cc-93fe-fd0369fd9834", "4e0d3bdf-95b6-4b56-91f9-7026f591819d", "DEF-REMOTE-FROM-ALL", "DEF-MAXIME-ENS"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever has every Dei Filius attribute has the primitive classical-attributes field"
lean = "FieldFromDeiFilius"
paraphrase = "Open premise, analyst formulation: every being that has every Dei Filius attribute (DeiFiliusAttributes) has the skeleton's primitive field HasClassicalAttributes. The interpretation of the primitive field, stated one-way with no converse: the field's own documentation says it is intended to group the classical attributes after Dei Filius ch. 1, and this premise says that the full list recorded from that chapter suffices for it. It is strictly weaker than STMT-CLASSICAL-ATTRIBUTES-SUFFICE (fieldOfSuffice; Control.Controls part 3). It supplies no existence witness."
definitions = ["edcfac86-6c19-4c82-9dfa-79bbf3287e6f", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE", "DEF-GOD-OF-CLASSICAL-THEISM"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever HAS_INTELLECT_1 lives"
lean = "IntellectualIsLiving"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever has intellect lives (operates from itself). After ST I q.18 a.3, where understanding is the highest grade of life and life is grounded in intellect. Not identified with STMT-PURE-ACT-LIVES (time-indexed, from the absence of potency) or STMT-THINKER-LIVES (bearers of occurring thoughts)."
definitions = ["DEF-LIVING", "DEF-HAS-INTELLECT"]
disambiguations = ["DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever causes the being of everything else is lord of everything else"
lean = "CreatorOfAllIsLord"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever causes the being of everything else that is in act as to being has dominion over everything else. After ST I q.13 a.7, where 'Lord' is said of God relative to creatures, which are subject to him as their cause."
definitions = ["92c03350-6809-497d-b123-2ffb11c0e0c1", "59350e3b-1b76-45cd-b9fd-548f3f4658b5"]
disambiguations = ["DISAMB-IN-ACT"]

[[statement]]
id = "Whatever causes the being of everything else is immense"
lean = "CreatorOfAllIsImmense"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever causes the being of everything else that is in act as to being is contained by no place and present to everything. After ST I q.8 a.1-2: God is in all things as an agent is present to its effect, and in every place by giving it being."
definitions = ["92c03350-6809-497d-b123-2ffb11c0e0c1", "bf2f30d1-609f-4b23-b819-786d877b949c"]
disambiguations = ["DISAMB-IN-ACT"]

[[statement]]
id = "Whatever is INFINITE_1 is incomprehensible"
lean = "InfiniteIsIncomprehensible"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever is infinite (INFINITE_1, unreceived subsistent being) is known by no created intellect as perfectly as it is knowable. After ST I q.12 a.7: God is infinitely knowable and a created intellect knows finitely."
definitions = ["DEF-INFINITE", "c4cf79f1-60a9-498a-944b-aeb7dfb56573"]
disambiguations = ["DISAMB-INFINITY"]

[[statement]]
id = "Whatever is PERFECT_2 and HAS_INTELLECT_1 is most blessed"
lean = "PerfectIntellectualIsMostBlessed"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever is universally perfect (in act in every respect in which anything is in act) and has intellect has, in itself, the perfect good of an intellectual nature. After ST I q.26 a.1."
definitions = ["DEF-UNIVERSALLY-PERFECT", "DEF-HAS-INTELLECT", "5068b909-d6b0-458b-a3d7-30fd2f7088a8"]
disambiguations = ["DISAMB-IN-ACT", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Whatever causes the being of everything else enters into the composition of nothing"
lean = "CreatorOfAllIsNoComponent"
paraphrase = "Open bridge, analyst formulation, unattributed: whatever causes the being of everything else that is in act as to being is a component of nothing (RemoteFromAll). After ST I q.3 a.8's reason that the first efficient cause is not numerically one with the form or matter of what it makes. Gives Dei Filius's 'really distinct from the world' only in that reading."
definitions = ["92c03350-6809-497d-b123-2ffb11c0e0c1", "DEF-REMOTE-FROM-ALL"]
disambiguations = ["DISAMB-IN-ACT"]

[[statement]]
id = "What is more in being than another is in act in some respect the other is not"
lean = "ExcessInBeingIsExcessInAct"
paraphrase = "Open bridge, analyst formulation, unattributed: whenever y is more in being than x, y is in act in some respect in which x is not. After the reading of grades of being as grades of act (ST I q.4 a.2; q.2 a.3, quarta via). Interpretation gap: with the binary InAct, things in act in the same respects cannot differ in being, so a reading on which grades are intensities of one act makes this bridge fail unless respects separate grades."
definitions = ["DEF-MAXIME-ENS"]
disambiguations = ["DISAMB-IN-ACT"]

