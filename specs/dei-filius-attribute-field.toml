rule = "Composition of the registered join-to-stage-two result on a signature whose primitive field is trivial, then per-conjunct derivation at the same witness"
meaning = "The registered composition (result 57213a13) is applied with every one of its inputs except the sufficiency premise, on the signature that agrees with the given one except that its primitive field is everywhere true; its sufficiency premise then holds trivially there and nothing about the field is used. Its root n is the same witness: an actual root at w, the only one, NECESSARY_2, maximal in being and perfect, with esse/essence identity, firstness, no matter-form composition, remoteness from all, GOD_4 and the nine. At n, remote from all gives the distinctness conjunct (a different reading of 'distinct from the world'), no matter-form composition gives 'spiritual', the maximum in being gives 'exalted', 'creator of all' is contained by definition in supreme goodness, infinity gives 'almighty' through the existing infinite-power premise, and living (LIVING_1), lord, immense, incomprehensible and most blessed take one open bridge each. All in the typed reading of definition edcfac86. At the root only these six premises (five new bridges and the existing infinite-power premise) are added to the composition's own inputs; the no-component and excess-in-act bridges of nineGiveDeiFilius are not needed. Uniqueness is among actual roots at w. Conditional consequence only; no premise is established."

[[argument]]
id = "b288856d-bc66-4886-9a7c-338fb019f12d"
label = "The NECESSARY_2 classical GOD_4 root, from the Dei Filius root and field"
theorem = "classicalRootOfDeiFiliusRoot"
premises = ["c0f4a346-b265-4091-9d38-69c69582ea95", "dfc3cbae-f00f-4861-a5f6-f5aecec4c157"]
conclusion = "STMT-NECESSARY-CLASSICAL-GOD-ROOT"
axioms = []
rule = "Projection of the nine and application of the field interpretation at the same witness"
meaning = "The root of the Dei Filius endpoint has the nine (they are among its attributes) and, by the field interpretation, the primitive field: the old endpoint at the same witness. With deiFiliusRoot this gives a route to the old endpoint in which the sufficiency premise is replaced by the field interpretation, five new bridges and the existing infinite-power premise. The field interpretation is a stipulation about the undefined primitive field (full-list reading CLASSICAL_FIELD_2). Conditional consequence only."

[[argument]]
id = "b4ddbbbb-a750-42c6-ab59-a0f65625688d"
label = "One-being controls for the Dei Filius sufficiency bridges, checked"
theorem = "controls"
premises = []
conclusion = "2c9a963f-4c4a-402a-bd0c-f017e25ec413"
axioms = []
rule = "Explicit one-being interpretations, checked by unfolding"
meaning = "Nonvacuity: the premises of nineGiveDeiFilius are jointly satisfiable with a being that has the nine and every Dei Filius attribute. Necessity in that theorem: for each of its ten premises except goodness-is-actuality, a one-being interpretation satisfies all the others and the nine at the one being, while some Dei Filius attribute fails there; so none of those nine premises is supplied by the rest. Strictness: an interpretation where the field interpretation holds vacuously (no Dei Filius being) while the old sufficiency premise fails. Model-witnessed facts about these interpretations only; they show where each premise is needed, not that it is false or doubtful."
