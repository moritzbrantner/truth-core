[batch]
vocab = "TruthCore.Logic.DarwinianEpistemicDebunking"
results = "TruthCore.Results.Logic.DarwinianEpistemicDebunking"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]

[[statement]]
id = "The selective history fixes the verdict of the scoped epistemic judgment"
lean = "SelectionFixesVerdict"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]
paraphrase = "OPEN analyst premise, origin information in idealized form, attribution deferred. Every scenario with the actual selective history returns the actual verdict of the scoped epistemic evaluative judgment. Street speaks of tremendous influence; full fixing by the history is a strengthening, stated here as a premise."

[[statement]]
id = "Correctness of the scoped epistemic judgment varies within the actual selective history"
lean = "CorrectnessVariesWithinHistory"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]
paraphrase = "OPEN analyst premise, a within-history-variation reading, attribution deferred. Some scenario with the actual selective history differs from the actual scenario in whether the judged content is correct. This is not Street's no-relation horn: on pp. 121–122 (the Bermuda analogy) her horn holds the realist's truths fixed, lets the judgments vary with selective pressure, and reaches likely actual error through a coincidence step. A realism whose correctness is the same in every scenario, her paradigm target, fails this premise; the cross-history reading is encoded separately."

[[statement]]
id = "The scoped epistemic judgment fails in some scenario with the actual selective history"
lean = "HistoryMateMismatch"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]
paraphrase = "Tracking failure: in at least one scenario with the actual selective history, the scoped epistemic evaluative judgment returns an incorrect verdict. This does not say which scenario and does not entail that the actual verdict is incorrect; since the actual scenario has the actual history, an incorrect actual verdict is one case of it."

[[argument]]
id = "Origin fixing and within-history variation yield a tracking failure"
theorem = "selectionWithVariationYieldsMismatch"
premises = ["The selective history fixes the verdict of the scoped epistemic judgment", "Correctness of the scoped epistemic judgment varies within the actual selective history"]
conclusion = "The scoped epistemic judgment fails in some scenario with the actual selective history"
rule = "Case split on actual accuracy: a correct actual verdict is repeated where correctness differs; an incorrect one is itself the failure"
meaning = "Conditional analyst argument for one epistemic evaluative judgment under the within-history-variation reading, attribution deferred. It is not Street's first horn, which holds the truths fixed across histories (pp. 121–122). If the selective history fixes the verdict and correctness varies among scenarios with that history, the verdict is wrong in some such scenario. The argument does not show actual inaccuracy, defeat of the judgment for anyone, or the absence of epistemic reasons."

[[statement]]
id = "A tracking failure of the judgment a basis delivers undercuts that basis"
lean = "UniformMismatchPolicy"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98", "26cbf25d-f3d5-46ea-91e8-e2140a57b04d"]
paraphrase = "OPEN analyst defeat policy, the debunker's normative bridge, attribution deferred. For each basis of the subject, if the epistemic evaluative judgment that basis delivers fails in some scenario with the actual selective history, the basis is undercut for the subject. The policy is stated uniformly, so it applies to the debunker's own epistemic basis as well as to the judgments it targets. Because the actual scenario has the actual history, an actually false verdict also triggers it: the policy treats actual inaccuracy as undercutting, so it does not by itself keep actual inaccuracy and justified defeat apart."

[[argument]]
id = "Realist debunker relying only on the debunked epistemic basis lacks warrant"
theorem = "realistDebunkerLacksOwnWarrant"
premises = ["A tracking failure of the judgment a basis delivers undercuts that basis", "The selective history fixes the verdict of the scoped epistemic judgment", "Correctness of the scoped epistemic judgment varies within the actual selective history", "Every supporting basis for the target is the specified basis", "Warrant for the target requires some undefeated supporting basis"]
conclusion = "The subject lacks warrant for the specified target"
rule = "Derive a tracking failure for the subject's own basis, apply the uniform policy, then reuse undercutSoleBasisPrecludesWarrant"
meaning = "Self-application under the within-history-variation reading of epistemic realism, analyst formulation, attribution deferred. Take the target as the debunking conclusion and the basis as the subject's epistemic evaluative basis. If the policy that debunks realist epistemic judgments applies uniformly, that basis's verdict is fixed by selection, its correctness varies within the history, every support for the conclusion comes from that basis, and warrant needs undefeated support, then the subject lacks warrant for the conclusion. The conclusion may still be true, other contents may be warranted, and no contradiction or epistemic nihilism follows."

[[statement]]
id = "Correctness of the scoped epistemic judgment is fixed by the actual selective history"
lean = "CorrectnessFixedByHistory"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]
paraphrase = "OPEN analyst premise, attribution deferred. Every scenario with the actual selective history agrees with the actual scenario on whether the judged content is correct. Constructivism (correctness constituted by attitudes the history fixes) and functional accounts (correctness as truth-conduciveness in the environment the history responded to) each supply it for different reasons. A necessitarian realism (correctness the same in every scenario) satisfies it formally, but survives through it only given actual accuracy, which Street's first horn disputes."

[[statement]]
id = "The scoped epistemic judgment is accurate in the actual scenario"
lean = "ActuallyAccurate"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]
paraphrase = "OPEN analyst premise. The scoped epistemic evaluative judgment's actual verdict is correct in the actual scenario."

[[statement]]
id = "The scoped epistemic judgment is accurate in every scenario with the actual selective history"
lean = "HistoryMatesAccurate"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98"]
paraphrase = "In every scenario with the actual selective history, the scoped epistemic evaluative judgment returns the correct verdict. No scenario with another history is covered."

[[argument]]
id = "History-fixed correctness keeps an accurate selection-fixed judgment accurate"
theorem = "historyFixedCorrectnessKeepsHistoryMatesAccurate"
premises = ["The selective history fixes the verdict of the scoped epistemic judgment", "Correctness of the scoped epistemic judgment is fixed by the actual selective history", "The scoped epistemic judgment is accurate in the actual scenario"]
conclusion = "The scoped epistemic judgment is accurate in every scenario with the actual selective history"
rule = "Rewrite each history-mate's verdict and correctness to the actual ones"
meaning = "Surviving-reply schema, analyst formulation. Where correctness is fixed by the history and the actual verdict is correct, the selection-fixed verdict is correct in every scenario with that history, so the tracking-failure premise of the uniform policy is not met. It applies to constructivist and functional readings. A necessitarian realism meets its premises only if its actual verdict is accurate, which Street's first horn disputes, so it is not listed as a survivor. The argument does not say which reading is true or that the actual verdict is accurate."

[[statement]]
id = "Finite controls for Darwinian epistemic debunking and its self-application"
lean = "DarwinianDebunkingControls"
definitions = ["e17e93bf-eedf-45db-be80-ffac82ef7d98", "26cbf25d-f3d5-46ea-91e8-e2140a57b04d"]
paraphrase = "Five finite controls. Origin fixing with within-history variation gives a tracking failure while the actual verdict is accurate. One omission example: with variation but no origin fixing, every history-mate is accurate, so origin fixing is needed. History-fixed correctness with an accurate selection-fixed verdict has no tracking failure. In the existing targeted reliability control the realist self-application premises hold and the conclusion lacks warrant while true, with thin F6 holding as undefeated support for other content. A no-undercutting model with history-fixed correctness for every basis satisfies the uniform policy, sole-basis and warrant conditions and keeps the conclusion warranted; it fits constructivist, functional and necessitarian-realist readings alike."

[[argument]]
id = "Darwinian epistemic debunking finite controls"
theorem = "darwinianDebunkingControls"
premises = []
conclusion = "Finite controls for Darwinian epistemic debunking and its self-application"
rule = "Evaluate three two-scenario profiles and reuse two existing reliability controls"
meaning = "Nonvacuity and omission controls for the three arguments. Tracking failure does not entail actual inaccuracy; one omission example shows origin fixing is needed; the self-application premises are jointly satisfiable and leave the conclusion true and F6 intact; a no-undercutting model with history-fixed correctness satisfies the same uniform policy and keeps warrant, which shows consistency, not that antirealism specifically secures warrant. These are formal interpretations only; no actual history, reliability or account of epistemic correctness is established."
