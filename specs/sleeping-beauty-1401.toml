[[statement]]
id = "Sleeping Beauty appearance has no exact Heads classifier"
lean = "AppearanceBoundary"
paraphrase = "On the declared three-center space, the constant awakening-appearance report has no exact Prop-valued classifier of Heads. This specializes the existing exact-classifier characterization to the Heads Monday and Tails Monday shared-report pair. It excludes exact classification through that report; it does not exclude probabilistic evidence or fallible warrant."
