[[statement]]
id = "Sleeping Beauty positive rivals and omission witnesses"
lean = "OmissionControls"
paraphrase = "Uniform thirds satisfy M,S,P and violate N. The allocation (1/2,1/4,1/4) satisfies N,S,P and violates M, with Monday conditional Heads probability 2/3. The allocation (1/2,1/2,0) satisfies N,M and violates S,P. Both live rival allocations have strictly positive mass at every center. These witness minimality of the two incompatible triples relative to the specified normalization background, not normative victory."
definitions = ["bd35e4c3-1882-4373-8a39-bea840976e93"]

