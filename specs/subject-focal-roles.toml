[[argument]]
id = "Subject focal role controls, checked"
theorem = "controls"
premises = []
conclusion = "Subject focal role controls"
rule = "Constructive finite model evaluation"
meaning = "One joint populated finite certificate. Carrier Control.B (four named individuals), one world, existsAt, substance, primary 0 and creature remain fixed in causal and degree cells. Changing common to split changes only subject assignment and preserves role extensions. Product Bool degrees are incomparable; natural-number degrees are comparable, and noMore fails the exact approach biconditional where totalMore succeeds. All three bridge omissions have explicit counterexamples. No full Aristotle/Aquinas interpretation or metaphysical possibility established."

