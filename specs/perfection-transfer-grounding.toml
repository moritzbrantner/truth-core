# Stage two of the modal spine: a grounded entry into the perfection-transfer
# support cycle found by PR #1480 (#1476). STMT-CAUSE-OF-BEING-CAUSES-EVERY-PERFECTION
# [f8ba2429] was proved only from STMT-UNIVERSAL-CAUSE-TRANSFERS-PERFECTIONS [b26c10a0]
# and STMT-RESIDUAL-PERFECTION-TRANSFER [5a4afaa5], and the residual only from
# f8ba2429. This batch isolates the residual's nonuniversal conjunct, discharges its
# self-effect conjunct through the existing open premise
# STMT-NOTHING-CAUSES-ITS-OWN-BEING [b62a64ab], and derives f8ba2429 from premises
# outside the cycle. Analyst formulations, attribution deferred. No premise is
# established.

[batch]
vocab = "TruthCore.Causality.PerfectionTransferGrounding"
results = "TruthCore.Results.Causality.PerfectionTransferGrounding"

# ---------------------------------------------------------------- statements

[[statement]]
id = "A nonuniversal CAUSE_2 of a thing's esse causes each of its actual perfections"
lean = "NonuniversalPerfectionTransfer"
paraphrase = "Open premise, analyst formulation, unattributed: if c causes x's esse (CausesIn c x esse) and c is not a cause of the esse of every other actual being (not CausesAllInGenus at esse), then for every respect r in which x is in act, c causes x's being in act in r. Exactly the first conjunct of STMT-RESIDUAL-PERFECTION-TRANSFER; it drops the residual's self-effect conjunct. Strictly weaker than the residual (Control.Controls part 2: a single being causing only its own esse satisfies it and falsifies the residual); given STMT-NOTHING-CAUSES-ITS-OWN-BEING it says the same as the residual. It is the part of the unrestricted transfer principle that neither universal-scope transfer nor the absence of self-causation of esse supplies. No source states it: the q.4 a.2 and q.6 a.2 support claims on the unrestricted principle concern God as first cause or as subsistent being, not particular causes. 'Cause' is CAUSE_2 at esse (CausesIn, effective causal responsibility for the effect's being, not mere coming to be)."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "ff1ba8f4-ab6e-5bdd-9e17-02b08a025168", "00bd3c0c-010a-559c-a2a0-b4fbf49cbaf1", "c19faf56-0908-5e6e-8c39-ccba40dce5d1"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b", "dba7b1de-f3a0-57af-9af9-b2a4da3136fa"]

[[statement]]
id = "Controls for the grounded perfection-transfer derivation"
lean = "Control.Controls"
paraphrase = "Closed controls on explicit interpretations (respects Bool, false = esse, true = skill; everything in act): (1) in the existing four-role concurrent interpretation with its full TransferModelBackground, universal-scope transfer holds and nothing causes its own esse, while nonuniversal transfer fails (the particular supporter causes the recipient's esse but not its skill) and unrestricted transfer fails; (2) a single being causing only its own esse satisfies universal-scope and nonuniversal transfer, causes its own esse, and falsifies both unrestricted transfer and the residual, so nonuniversal transfer does not entail the residual; (3) with two beings, a source causing the other's esse but not its skill falsifies universal-scope and unrestricted transfer while nonuniversal transfer and no self-causation of esse hold; (4) in a four-role interpretation where the source causes every other being and the nonuniversal supporter causes the recipient in every respect, all three nonlogical premises and unrestricted transfer hold, with an actual nonuniversal esse edge. Statements about these interpretations only; excluded middle is not varied."
definitions = ["211a6432-8b8f-53ed-85e3-75173bb15b24", "5c308c8c-34a4-525b-a2ca-6d0dbbd1bb72", "c19faf56-0908-5e6e-8c39-ccba40dce5d1", "76db8656-b660-52f0-9e54-347cacf1b205"]
disambiguations = ["00e0d443-eb39-56a3-9179-9c8852ca4a2b"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "Cause of being causes every perfection, from universal and nonuniversal transfer"
theorem = "causeOfBeingCausesEveryPerfectionGrounded"
premises = ["STMT-EXCLUDED-MIDDLE", "STMT-UNIVERSAL-CAUSE-TRANSFERS-PERFECTIONS", "A nonuniversal CAUSE_2 of a thing's esse causes each of its actual perfections", "STMT-NOTHING-CAUSES-ITS-OWN-BEING"]
conclusion = "STMT-CAUSE-OF-BEING-CAUSES-EVERY-PERFECTION"
strong_version_needed = {"STMT-EXCLUDED-MIDDLE" = "The case split is on whether an arbitrary cause is universal at esse, for an arbitrary Being domain; the registered weak version (classical-attributes actual-bearer local logic) decides only identity with a God bearer and that bearer's esse/essence identity, not this proposition."}
axioms = []
rule = "Case split by excluded middle on whether the cause is universal at esse; distinctness of cause and effect from no self-causation of esse"
meaning = "Suppose c causes x's esse and x is in act in r. x is not c, since nothing causes its own esse (CausesIn x x esse never holds). By excluded middle c either causes the esse of every other actual being or does not. If it does, universal-scope transfer, applied to the distinct effect x, gives that c causes x's being in act in r; if it does not, nonuniversal transfer gives the same. So the cause of a thing's being causes each of its perfections. This is a grounded entry into the support cycle between this principle and the residual: no premise rests on either cycle member (universal-scope transfer is also projected from the unrestricted principle, but that projection is a transcription; its grounded derivation is from total causation, result UNIVERSAL-CAUSE-TRANSFERS-FROM-TOTAL-CAUSATION). The open content moves to nonuniversal transfer; universal-scope transfer and no self-causation of esse stay open, and excluded middle is the existing self-evident logical premise. The self-effect conjunct of the residual is not assumed but excluded. Conditional consequence only; no premise is established. Control.Controls parts 1 to 3 show that each nonlogical premise is needed in the interpretations given there."

[[argument]]
id = "Controls for the grounded perfection-transfer derivation, checked"
theorem = "controls"
premises = []
conclusion = "Controls for the grounded perfection-transfer derivation"
axioms = []
rule = "Explicit finite interpretations, checked by decision or case analysis"
meaning = "Omission: in the concurrent interpretation (full shared background) only nonuniversal transfer fails and unrestricted transfer fails; with one self-causing being only no self-causation of esse fails and unrestricted transfer and the residual fail; with a source that does not transfer skill only universal-scope transfer fails and unrestricted transfer fails. Strictness: nonuniversal transfer holds where the residual fails. Nonvacuity: all premises and the conclusion hold where a nonuniversal cause actually causes another's esse. Model-witnessed facts about these interpretations only; they show where each premise is needed, not that any premise is false."
