theorem = "conditionalDuality"
premises = []
conclusion = "Formula-local possible-impossibility duality certificate"
rule = "Unfold Kripke modalities, contrapose, and apply explicitly quantified local double-negation elimination."
meaning = "Conditional analyst certificate. One formula and standpoint only; no global excluded middle or frame axiom. Source-to-Kripke, report-to-truth and source situation coverage remain open."

[[argument]]
