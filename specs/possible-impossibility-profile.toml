[[statement]]
id = "Formula-local possible-impossibility duality certificate"
lean = "Certificate"
definitions = ["9c049e13-5c43-408a-89ae-07adec28f434"]
paraphrase = "For every Kripke frame, selected formula and standpoint, formula-local double-negation elimination on accessible worlds suffices for equivalence of Dia(Box(not P)) implies Box(not P) and Dia(P) implies Box(Dia(P)). Analyst conditional, no assertion of either modal input, source equivalence, assent or frame validity."

[[statement]]
id = "Formula-local possible-impossibility scope controls"
lean = "Controls"
definitions = ["9c049e13-5c43-408a-89ae-07adec28f434"]
paraphrase = "Finite witnesses show nonvacuous stable possibility, failure of both modal inputs for another formula on the same frame and standpoint, no entailment of arbitrary assent, and failure of unconstrained source-gloss truth to imply Kripke impossibility. No causal or rigid-individual conclusion."

[[argument]]
