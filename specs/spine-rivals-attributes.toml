[[statement]]
id = "Rival: some caused thing has a perfection that no cause of its being has (strong emergence)"
lean = "EmergentPerfectionReading"
paraphrase = "Rival framework commitment, unattributed, motivated by strong emergence and by Hume's 'anything may produce anything': some thing is in act in a respect, has at least one cause of its being, and no cause of its being is in act in that respect. The replacement account is that the perfection arises with the effect's organization and is not found in what causes it to be. Strictly stronger than the negation of STMT-PERFECTIONS-OF-EFFECT-PREEXIST-IN-CAUSE, which needs only one cause of being that lacks the perfection. It does not say the perfection is uncaused."
definitions = ["DEF-CAUSE-OF-PERFECTION", "DEF-ACT", "DEF-RESPECT", "DEF-ESSE"]
disambiguations = ["DISAMB-IN-ACT"]

[[statement]]
id = "Rival: being GOOD_1 in a perfection requires having it, but some had perfection is not GOOD_1"
lean = "ActualityNotSufficientForGoodnessReading"
paraphrase = "Rival framework commitment, unattributed, motivated by the fact/value gap (Hume's is/ought, Moore's open question) and by the objection that some actualities are bad: whatever is good in a perfection actually has it, and something actually has a perfection in which it is not good. The replacement account is that goodness is a further feature that only some actualities have. Strictly stronger than the negation of STMT-GOODNESS-IS-ACTUALITY: it keeps the direction from goodness to actuality and denies only the converse. It is not nihilism about value."
definitions = ["DEF-GOOD-AS-BEING-IN-ACT", "DEF-ACT"]
disambiguations = ["DISAMB-GOOD-PRACTICAL-AND-ONTOLOGICAL"]

[[statement]]
id = "Rival: some composite has no cause of its being at all (brute or necessary composition)"
lean = "UncausedCompositeReading"
paraphrase = "Rival framework commitment, unattributed, motivated by brute composition and by accounts of a composite necessary being whose distinct members cannot come apart: some composite has no cause of its being, itself included. The replacement account is that its members cohere of themselves, by necessity or as a brute fact. Strictly stronger than the negation of STMT-COMPOSITE-HAS-A-UNITING-CAUSE, which would allow a composite whose only cause of being is itself. It does not say that no composite has a cause."
definitions = ["DEF-SIMPLE", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE"]
disambiguations = ["DISAMB-CAUSE"]

[[statement]]
id = "Rival: matter-form composition composes, but some esse other than essence does not"
lean = "EsseEssenceDifferenceWithoutCompositionReading"
paraphrase = "Rival framework commitment, unattributed, motivated by Scotus's formal distinction and by the view that essence and existence differ without being two parts: whatever is composed of matter and form is composite, and something whose act of being is other than its essence is not composite. The replacement account is that the two differ as formalities or aspects of one simple reality. Strictly stronger than the negation of STMT-MATTER-FORM-AND-ESSE-ESSENCE-ARE-COMPOSITIONS: it keeps the matter-form inclusion and denies only the esse-essence one. It does not say that esse and essence are identical in that thing."
definitions = ["DEF-ESSE", "DEF-ESSENCE-THOMISTIC-NATURE", "DEF-SIMPLE"]
disambiguations = ["DISAMB-ESSENCE"]

[[statement]]
id = "Rival: some first being is a component of something other than itself (world-soul)"
lean = "FirstBeingIsAComponentReading"
paraphrase = "Rival framework commitment, unattributed, motivated by the positions reported in ST I q.3 a.8 (God as the soul of the world, as the formal principle of all things, or as prime matter) and by pantheist and panentheist accounts: some being to which nothing other is simply prior is a component of something other than itself. The replacement account is that being a constituent does not subordinate: the whole depends on the first principle that informs it. Strictly stronger than the negation of STMT-NO-COMPONENT-IS-FIRST-BEING, which would allow a first being that is a component only of itself. It does not say the first being is itself composite."
definitions = ["DEF-FIRST-BEING", "DEF-SIMPLE-PRIORITY", "DEF-SIMPLE", "DEF-ESSE"]

[[statement]]
id = "Rival: whatever HAS_INTELLECT_1 is material, and something is ALTOGETHER_IMMATERIAL_2"
lean = "IntellectOnlyInMaterialCompositesReading"
paraphrase = "Rival framework commitment, unattributed, motivated by physicalism about the mind together with realism about immaterial things (abstract objects, or an impersonal first principle beyond intellect): whatever has intellect is composed of matter and form, and something is neither composed of matter and form nor a component of anything. The replacement account of why a thing knows is material organization, not separation from matter. Strictly stronger than the negation of STMT-IMMATERIAL-IS-INTELLECTUAL, which needs only one altogether immaterial thing without intellect. It does not deny that there are immaterial things or that there are intellects."
definitions = ["DEF-ALTOGETHER-IMMATERIAL", "DEF-HAS-INTELLECT", "DEF-REMOTE-FROM-ALL"]

[[statement]]
id = "Rival: something HAS_INTELLECT_1 without HAS_WILL_1 (purely contemplative intellect)"
lean = "IntellectWithoutWillReading"
paraphrase = "Rival framework commitment, unattributed, motivated by accounts of a purely contemplative first intellect, by the denial that God acts from freedom of will, and by necessary emanation: something has intellect and does not have will. The replacement account of how anything proceeds from such an intellect is necessity of nature, not volition; the formal statement does not express that account. It is the exact negation of STMT-WILL-FOLLOWS-INTELLECT on the same two predicates. It does not say that no intellect has will."
definitions = ["DEF-HAS-WILL", "DEF-HAS-INTELLECT"]
disambiguations = ["DISAMB-APPETITE-POWER-AND-EXERCISE", "DISAMB-CREATURE-PASSIVE-APPETITE-AND-DIVINE-WILL"]

[[statement]]
id = "Rival: something is its own subsistent being and is not INFINITE_1"
lean = "FiniteSubsistentBeingReading"
paraphrase = "Rival framework commitment, unattributed, motivated by the thin view of existence (a thing's being its own existence settles nothing about how much it is) and by accounts of finite self-existent things: something whose act of being is its essence is not infinite. The replacement account is that limitation comes from what a thing is, not from its essence receiving being; the formal statement does not express that account. It is the exact negation of STMT-SUBSISTENT-BEING-IS-INFINITE on the same carrier. It does not say that nothing is infinite."
definitions = ["DEF-INFINITE", "DEF-ESSE", "DEF-ESSENCE-THOMISTIC-NATURE"]
disambiguations = ["DISAMB-ESSENCE"]

[[statement]]
id = "Rival: something altogether IMMUTABLE_1 is not ETERNAL_1 (everlasting in time)"
lean = "ImmutableWithoutEternityReading"
paraphrase = "Rival framework commitment, unattributed, motivated by the view that time passes without change and by accounts of an everlasting God who is in time: something in potency in no respect is not eternal. The replacement account of its duration is everlasting existence in time; the formal statement has only the predicate for timeless eternity and expresses only its failure, not temporal duration. It is the exact negation of STMT-IMMUTABLE-IS-ETERNAL on the same carrier. It does not say that such a thing begins or ends."
definitions = ["DEF-IMMUTABLE", "DEF-PURE-ACT", "DEF-ETERNAL"]

[[statement]]
id = "Rival: some being with the nine listed attributes lacks the classical divine attributes"
lean = "ClassicalAttributesFallShort"
paraphrase = "Rival framework commitment, unattributed, motivated by the fuller list of Dei Filius ch. 1 (omnipotent, immense, incomprehensible) and by accounts on which omnipotence, omniscience or omnipresence are not contained in the nine: some being is simple, perfect, good, one, infinite, immutable, eternal and has intellect and will, and does not have the classical divine attributes of the skeleton. The replacement account is that the classical profile has further members which the nine predicates, as encoded, do not entail; the formal statement does not say which. It is the exact negation of STMT-CLASSICAL-ATTRIBUTES-SUFFICE on the same signature and predicates."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION"]

[[statement]]
id = "Fourteen finite tests of rivals of the stage-two attribute premises"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls: fourteen finite interpretations on one- or two-element carriers, one per stage-two attribute premise. In each, the recorded rival of the premise holds, every other premise of the named consuming theorem holds, and that theorem's conclusion fails. (1) Actuality without being: the one existent is in act in a non-esse respect only; every existent is in act in some respect; not every existent is in act in esse. (2) Emergent perfection: one being causes another to be and to have a second perfection which the cause lacks; every caused perfection is had by the effect; the cause of being does not have what it gives. (3) Actuality without goodness: the one being is God, maximal in being, in act and good in nothing; God is not supremely good. (4) Uncaused composite: the one being is God, maximal, composite and caused by nothing; God is not simple. (5) Esse-essence difference without composition: an unmoved mover whose act of being differs from its essence, with nothing composite; the first mover is not simple in the encoded sense. (6) A first being that is a component: at one world a necessary actual root is first and potency-free and is a component of a distinct composite whole; no actual root is first and a component of nothing. (7) Material intellect: God is immaterial, maximal and first and lacks intellect, while a matter-form composite has intellect; God does not have intellect. (8) Intellect without will: the one being is God with intellect and no will. (9) Potency prior to act: the one being is in potency, nothing is in act or prior; a first being is in potency. (10) Act and potency in one respect: the one being is in act and in potency in the one respect and simply prior to itself; a first being is in potency. (11) Finite subsistent being: a simple unmoved mover whose act of being is its essence, not infinite, lacking a pure perfection. (12) Immutable without eternity: the one being is God, maximal, first, in potency in no respect and not eternal. (13) Naming: the one being meets the full nominal description, the practice's name refers to no being, proper application is preserved by reference vacuously, and the naming leaf fails; the full description is not excluded. (14) The nine attributes falling short: the one being is God with all nine predicates and the other thirteen non-logical premises hold, while the primitive classical-attributes field is false of it. The general logical premise excluded middle of two consuming theorems is not part of any interpretation and is not checked. These are statements about fourteen finite interpretations only; none shows a rival true or a premise false."

[[argument]]
id = "Rivals of the fourteen stage-two attribute premises survive in finite tests"
theorem = "controls"
premises = []
conclusion = "Fourteen finite tests of rivals of the stage-two attribute premises"
axioms = []
rule = "Explicit one- and two-element interpretations, checked by evaluation and case analysis"
meaning = "Premise-free finite controls for the stage-two premises of the modal spine to STMT-GOD-EXISTS. For each of fourteen premises, one interpretation satisfies its recorded rival together with every other non-logical premise of the premise's smallest verified consuming theorem, and falsifies that theorem's conclusion. So within each consuming theorem the targeted premise is not derivable from the others, and the rival is jointly satisfiable with them. No premise is derived, defended, refuted or closed; no rival is established; compatibility with premises outside the named theorem is not tested. Model claims concern these fourteen interpretations only."

