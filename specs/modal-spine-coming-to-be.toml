[batch]
vocab = "TruthCore.Causality.ContingentComingToBe"
results = "TruthCore.Results.Causality.ContingentComingToBe"
definitions = ["Coming to be of contingent concrete things in a history", "History of founded coming-to-be", "Contingent concrete things absent at a moment and present at a later one", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "DEF-KANT-MODAL-CONTINGENCY"]

[[statement]]
id = "Possibly, every contingent concrete thing comes to be in a history with a founded past"
lean = "PossiblyFoundedComingToBe"
paraphrase = "OPEN analyst premise, attribution deferred: some history accessible from the selected world contains a contingent concrete individual present at a moment below which there is no endless descending sequence of moments, and in that history every contingent concrete individual, whenever present, was absent at some strictly earlier moment. Nothing is said about the selected world itself, about causes, or about non-contingent individuals."
definitions = ["Coming to be of contingent concrete things in a history", "History of founded coming-to-be", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]

[[statement]]
id = "Survival models of the initial-state rival and a witness of founded coming-to-be"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete, two mutually accessible worlds. (1) Endless generation with integer individuals and times, individual n existing only at the selected world and present there from time n on: presence-to-existence and inert emptiness hold, every contingent individual comes to be, no accessible history has a contingent-free moment before a populated one, no time has a founded past, and no individual exists at both worlds. (2) In the existing initial-state control, time 0 has a founded past but the contingent individual does not come to be. (3) The existing rooted control satisfies the possibility of founded coming-to-be. These are statements about three interpretations only."
definitions = ["Coming to be of contingent concrete things in a history", "History of founded coming-to-be", "Contingent concrete things absent at a moment and present at a later one", "Inert emptiness: a concrete-empty moment is followed only by concrete-empty moments", "DEF-COUNT-TEMPORAL-HISTORY-PRESENCE", "DEF-KANT-MODAL-CONTINGENCY"]

[[argument]]
id = "A possible contingent-free past from possible founded coming-to-be"
theorem = "possibleContingentFreePast"
premises = ["Possibly, every contingent concrete thing comes to be in a history with a founded past"]
conclusion = "Possibly, contingent concrete things are absent at a moment and present at a later one"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Descend along the founded past to a moment with nothing earlier; coming to be excludes contingent occupants there"
meaning = "New non-transcription conditional support option for premise A3 of the modal spine to God's existence. In the accessible history, the contingent individual x present at the founded moment t was absent at an earlier moment s. Because there is no endless descent below t, some moment m at or below s has no strictly earlier moment (classical case split along accessibility of the strict order). Any contingent concrete individual present at m would need a still earlier moment of absence, which m lacks; so m is free of contingent concrete individuals and lies strictly before t, where x is present. No frame condition, presence contract, inertness of emptiness or causal relation is used. The single premise is OPEN; it is a possibility claim and is stronger than the conclusion. This repairs, for contingent concrete things under an earlier-absence reading and a founded past, the quantifier shift the corpus records as invalid in general; nothing is attributed to a source. No premise truth is established."

[[argument.research_comparisons]]
target_statement_id = "Possibly, every contingent concrete thing comes to be in a history with a founded past"
rival_statement_id = "In no possible history are contingent concrete things absent at a moment and present later"
sense_definition_id = "History of founded coming-to-be"
outcome = "excluded"
conditions = "None beyond the two statements themselves: possibleContingentFreePast derives the negation of the rival from the target, with the three permitted Mathlib axioms."
scope = "Same History carrier, Concrete predicate, preorder of times, frame and selected world."
coverage = "The initial-state rival as encoded (no accessible contingent-free moment before a contingent-populated one); not every philosophical view called an initial-state view."
exclusivity = "Checked incompatibility, not exhaustiveness: both statements can fail together."
next_step = "The rival's holder must deny that founded coming-to-be is possible: in every accessible history either some contingent concrete thing never came to be or no populated moment has a founded past. Test each horn against the causal-finitism and brute-foundation results."

[[argument]]
id = "Founded coming-to-be controls checked"
theorem = "controls"
premises = []
conclusion = "Survival models of the initial-state rival and a witness of founded coming-to-be"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Explicit interpretations with integer and natural-number times, checked by case analysis and linear arithmetic"
meaning = "The initial-state rival survives, without a necessary individual and with inert emptiness intact, in exactly the two ways the derivation leaves open: an endless past in which every contingent thing comes to be, and a founded past whose contingent thing never came to be. Each control omits one conjunct of founded coming-to-be. The rooted control shows the premise is satisfiable. Model claims concern these interpretations only."

[[relation]]
id = "No possible contingent-free past is an alternative to possible founded coming-to-be"
subject_kind = "statement"
subject_id = "In no possible history are contingent concrete things absent at a moment and present later"
predicate = "alternative_to"
object_kind = "statement"
object_id = "Possibly, every contingent concrete thing comes to be in a history with a founded past"
note = "Not the negation of the premise: the two are incompatible by the checked derivation of the possible contingent-free past, and both can fail together. Recorded because the initial-state view is the position that must deny the premise; neither is established."
