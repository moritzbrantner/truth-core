[[statement]]
id = "Finite energy ledger bounds output and requires input for nondepleting dissipation"
lean = "Budget"
paraphrase = "For every admissible energy ledger, work plus heat is at most initial stock plus boundary input; if final stock is at least initial stock and work plus heat is positive, boundary input is positive."
definitions = ["e5cefbf6-0c52-47d9-b9a6-66c0ebf65e73"]

