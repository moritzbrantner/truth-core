[[statement]]
id = "Spatial identity criteria and assumption omission controls"
lean = "Certificate"
paraphrase = "For arbitrary representation and body carriers and a supplied finitary relational signature, represented equality implies relational isomorphism and active-orbit quotient equality. Data preservation makes quotient equality imply relational isomorphism; orbit completeness gives the converse. With both and orbit triviality all three coincide. Bijective passive chart transport preserves each corresponding criterion. Marker controls omit respectively orbit completeness, orbit triviality and data preservation while retaining the other relevant comparison assumptions and separating the criteria; a fixed-label marker model satisfies all comparison assumptions and all three criteria reflexively. A typed three-constructor selection gives their joint equivalence by cases within this explicitly bounded comparison scope. Analyst framework only: original source meanings, spatial completeness and world applicability remain open."
