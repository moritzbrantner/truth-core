id = "REL-ACTUAL-GROUNDING-FINITE-RANK-STRENGTHENS-WF"
subject_kind = "statement"
subject_id = "STMT-ACTUAL-GROUNDING-FINITE-RANK"
predicate = "strengthens"
object_kind = "statement"
object_id = "STMT-ACTUAL-GROUNDING-WF"
