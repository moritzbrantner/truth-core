# ---- Supports relations (claim bears on, does not state) ----

[[relation]]
id = "REL-PHYS-191B-PRIVATION-SUPPORTS-POTENCY-UNDER-PRIVATION"
subject_kind = "claim"
subject_id = "ARIST-PHYS-191B-QUALIFIED-PRIVATION-A"
predicate = "supports"
object_kind = "statement"
object_id = "STMT-POTENCY-IS-CAPACITY-UNDER-PRIVATION"
note = "Physics I.8, 191b13-17 lets generation come incidentally from privation, non-being in its own respect, in a subject. It bears on the premise by pairing subject and privation as the starting point of change; that being in potency to r is exactly being capable of r and deprived of it is the analyst's identification, not stated in the passage."

[[relation]]
id = "REL-MET-1048A-KNOWER-SUPPORTS-PRIVATION-IS-LACK-OF-ACT"
subject_kind = "claim"
subject_id = "ARIST-MET-1048A-POTENCY-AS-UNACTUALIZED-CAPACITY-A"
predicate = "supports"
object_kind = "statement"
object_id = "STMT-PRIVATION-IS-LACK-OF-ACT-IN-CAPABLE"
note = "Metaphysics IX.6, 1048a30-35: the knower who is not contemplating, if able to contemplate, is a knower potentially. It bears on the premise through a capable subject lacking the act; the passage does not use privation, and that privation in a capable subject is exactly the lack of the act is the analyst's."

[[relation]]
id = "REL-PHYS-201A-MOVED-SUPPORTS-MOVED-AS-UNACTUALIZED-CAPACITY"
subject_kind = "claim"
subject_id = "ARIST-PHYS-201A-MOVED-AS-POTENCY-ACTUALIZED-C"
predicate = "supports"
object_kind = "statement"
object_id = "STMT-BEING-MOVED-IS-ACTUALIZATION-OF-UNACTUALIZED-CAPACITY"
note = "Physics III.1, 201a10-11 says motion is the actuality of the potential as such. The premise replaces 'the potential' by 'an unactualized capacity' (able to be r and not r in act), which is the Metaphysics IX.6 reading of potency, not something 201a10-11 states."
