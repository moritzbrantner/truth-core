[[statement]]
id = "A3 local occurrence uniqueness transports possible conditioning"
lean = "SameEventTransport"
paraphrase = "For unrestricted bearer, time, state, world and condition carriers, matching structured state-pair contents allow transfer of possible conditioning to the selected occurrence IF every occurrence with those contents equals that occurrence. This is conditional analyst transport, with attribution deferred; uniqueness is an explicit hypothesis, not an established identity principle. The condition relation remains primitive and gives no concrete bearer, temporal presence or actuality."
