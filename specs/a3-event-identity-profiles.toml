[[argument]]
id = "A3 same-event transport under selected occurrence uniqueness"
theorem = "transport"
premises = []
conclusion = "A3 local occurrence uniqueness transports possible conditioning"
rule = "constructive-proof"
meaning = "Prove the universally quantified conditional transport law. The antecedent explicitly requires uniqueness for the selected state-pair and possible conditioning of a matching occurrence. This does not discharge A3P1 or infer actual causation. Root connection plan: supply a same-event dictionary to the A3 first-transition route; prior explanatory condition to concrete bearer, contingency exclusion and modal actuality remain OPEN."
