[[statement]]
id = "Geometric discharge has no uniform positive interval energy lower bound"
lean = "DecayingNoUniform"
paraphrase = "There is no positive real epsilon below (1/2)^n for every natural n. This is the total work-plus-heat output of the existing decaying ledger."

