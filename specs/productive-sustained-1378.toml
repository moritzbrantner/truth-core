[[statement]]
id = "Replenishment permits constant nondepleting interval work"
lean = "ReplenishedUniform"
paraphrase = "At every natural interval the explicit ledger (2,2,1,1,0) is admissible and its unit work meets unit demand. This is a replenished ledger control, not physical dynamics."

