[[statement]]
id = "Closed stock bounds the number of intervals meeting a uniform energy demand"
lean = "UniformBudget"
paraphrase = "For nonnegative real stock and stock(t+1)+output(t)=stock(t), a common lower bound epsilon on output implies n*epsilon <= stock(0) for every natural n. Epsilon need not be positive for this finite bound."

[[argument]]
id = "d84fc44b-a0a6-422b-bde9-267d2819b0bd"
theorem = "uniformBudget"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Closed stock bounds the number of intervals meeting a uniform energy demand"
rule = "Finite summation and real Archimedean order"
meaning = "For nonnegative real stock and stock(t+1)+output(t)=stock(t), a common lower bound epsilon on output implies n*epsilon <= stock(0) for every natural n. Epsilon need not be positive for this finite bound. Analyst conditional energy accounting only; no causal or bearer bridge."

[[statement]]
id = "Closed finite stock excludes a uniform positive interval energy demand forever"
lean = "NoUniformDischarge"
paraphrase = "Nonnegative real stock and the zero-input recurrence exclude a common strictly positive lower bound on output at all natural intervals."

