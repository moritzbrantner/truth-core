[[statement]]
id = "Grounding stability bridge"
lean = "GroundingStability"
paraphrase = "OPEN analyst bridge: in this profile absence of attitude ancestors entails truth-status invariance under the explicitly admissible interventions."
definitions = ["9568ff20-a21e-4320-945d-4f73415be3d9"]

[[statement]]
id = "Grounding candidate entails intervention candidate"
lean = "GroundingImpliesIntervention"
paraphrase = "For every sentence in this profile, the actual-truth-bearing grounding candidate implies the actual-truth-bearing intervention candidate."
definitions = ["9568ff20-a21e-4320-945d-4f73415be3d9"]

[[statement]]
id = "Ancestral attitude exclusion implies direct exclusion"
lean = "AncestralImpliesDirect"
paraphrase = "For every arbitrary profile and sentence, absence of attitude ancestors entails absence of immediate attitude grounds. No converse is certified."
definitions = ["9568ff20-a21e-4320-945d-4f73415be3d9"]

[[statement]]
id = "Moral candidate calibration supplies actual truth"
lean = "CalibrationTruth"
paraphrase = "For every arbitrary profile, calibration of the independent objective classifier to either candidate supplies the existing HasTruthComponent required by the external POE bridge. Moral facthood and existence alone do not supply that component."
definitions = ["9568ff20-a21e-4320-945d-4f73415be3d9"]

[[statement]]
id = "Moral attitude profile separation controls"
lean = "Controls"
paraphrase = "Same-domain finite separators: stable truth with an attitude ground satisfies only the intervention candidate; variable truth with no ground satisfies only the grounding candidate; stable actual truth with no grounds jointly satisfies both; stable falsity satisfies invariance and no attitude ancestors but fails the intervention candidate. Restricted interventions can hide truth variation at an excluded profile. Formal profiles only, not metaphysical possibility or causal overdetermination."
definitions = ["9568ff20-a21e-4320-945d-4f73415be3d9"]

[[argument]]
id = "Grounding candidate bridge under stability"
theorem = "groundingBridge"
premises = ["Grounding stability bridge"]
conclusion = "Grounding candidate entails intervention candidate"
rule = "Explicit construction and projection"
meaning = "Retains moral facthood, existence and actual truth and applies the explicit grounding-to-invariance premise. No unconditional relation follows."

[[argument]]
