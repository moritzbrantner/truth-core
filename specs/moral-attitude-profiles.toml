theorem = "ancestralDirect"
premises = []
conclusion = "Ancestral attitude exclusion implies direct exclusion"
rule = "Explicit construction and projection"
meaning = "Every immediate edge is a nonempty ancestry path. Constitutive-support interpretation remains stipulated."

[[argument]]
