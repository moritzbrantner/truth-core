[[statement]]
id = "Quantitative transfer finitePath"
lean = "FinitePath"
paraphrase = "For a countable weighted network with nonnegative weights, nonnegative input s and power P bounded above by a common finite M, summable weight rows and weighted-power rows, and every row sum at most a common 0 ≤ q < 1, P ≤ s + weighted transfer implies: every node with positive power has a finite positive-weight contributor path to a node with positive input, including a zero-length path. No well-foundedness or independent bearer follows."

[[argument]]
id = "Quantitative transfer derivation finitePath"
theorem = "finitePath"
axioms = ["propext", "Classical.choice", "Quot.sound"]
premises = []
conclusion = "Quantitative transfer finitePath"
rule = "Ordered sums, recurrence and geometric limits"
meaning = "Conditional quantitative network deduction; see the exact Lean definition and the applicability walk. No actual-world premise is supplied."

[[statement]]
id = "Quantitative transfer vanishingTail"
lean = "VanishingTail"
paraphrase = "For any real successor-chain assignment P uniformly bounded in absolute value and nonnegative factors q, if P(n)=q(n)P(n+1) and every upstream cumulative product tends to zero, then every P(n) is zero. No common strict factor bound is assumed."

