# Stage two of the modal spine: the weakest versions of the self-operation
# premises that the root-reaching living route needs. The route to the restated
# sufficiency (5fbea2f5, result 08bf7a13) applies STMT-PURE-ACT-LIVES, and through
# result PURE-ACT-LIVES-FROM-SELF-OPERATION STMT-PURE-ACT-OPERATES, only at a being
# with the nine stage-two attributes. This batch registers the nine-restricted
# versions as weak siblings (strength order, #1017), derives the weak life premise
# from the weak operation premise, and re-derives both living routes from the weak
# life premise. Analyst formulations, attribution deferred.

[batch]
vocab = "TruthCore.Causality.DeiFiliusLivingNineScope"
results = "TruthCore.Results.Causality.DeiFiliusLivingNineScope"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes operates from itself"
lean = "NineOperate"
paraphrase = "Open premise, analyst formulation, unattributed; the weak version of STMT-PURE-ACT-OPERATES. Whatever is simple, universally perfect, supremely good, such that whatever is GOD_4 is it (IsTheOneGod: uniqueness only; it does not say the being is GOD_4), infinite, altogether immutable (in potency in no respect, PURE_ACT), eternal, and has intellect and will has an immanent operation (the primitive Operates of SelfOperationLife, definition 7acc985a: an operation that remains in the agent, actio quae manet in agente, q.18 a.3 ad 1; not motion, and not including being unmoved). Scoped exactly to what the restated sufficiency NineSufficeForDeiFilius quantifies over. Since altogether immutability is pure act, it is STMT-PURE-ACT-OPERATES restricted to the beings that also have the other eight; it is strictly weaker (Control.Controls part 1: a pure act with no intellect and no immanent operation satisfies it and falsifies the strong version). It says nothing of a pure act without the nine. A causally inert abstract object, if the Being domain has one, is outside its scope by the worry's own premise: being inert it causes nothing, so in any domain with another being in act it fails the CausesEveryPerfectionOfOthers conjunct of supreme goodness (that it also lacks intellect is an analyst judgment, since HasIntellect is primitive). Because the nine include HAS_INTELLECT_1, it speaks only of beings with intellect. Near-definitional, stated plainly: with the unmovedness a pure act has, an immanent operation is close to the q.18 a.3 definiens of living (DEF-LIVING), so this premise carries most of the content of the living conjunct the route derives. q.18 a.3 ad 2 says of God that he is his own understanding and his own living; that is the nearest source support, and no claim states this premise."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-PURE-ACT", "7acc985a-ea60-4538-9c9e-6b18ddecf3a9"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "DISAMB-MOTION"]

[[statement]]
id = "Whatever has the nine SIMPLE_4, PERFECT_2, INFINITE_1 attributes is LIVING_2"
lean = "NineLiveSomeTime"
paraphrase = "Open premise, analyst formulation, unattributed; the weak version of STMT-PURE-ACT-LIVES. Whatever is simple, universally perfect, supremely good, such that whatever is GOD_4 is it (IsTheOneGod: uniqueness only), infinite, altogether immutable (pure act), eternal, and has intellect and will lives at some time of the duration frame (LIVING_2, LivesSomeTime: its life is present at some time). Not LIVING_1: the passage to the timeless primitive Primitives.Lives is the separate restricted sense bridge 'Whatever is in POTENCY_1 in no respect and is LIVING_2 is LIVING_1'. Scoped exactly to what the restated sufficiency NineSufficeForDeiFilius quantifies over; strictly weaker than STMT-PURE-ACT-LIVES (Control.Controls part 2). Derived (nineLiveFromSelfOperation) from the weak operation premise, STMT-SELF-OPERATING-UNMOVED-LIVES and the Prima Via premise that nothing is moved except as in potency."
definitions = ["DEF-SIMPLE", "DEF-UNIVERSALLY-PERFECT", "DEF-SUPREMELY-GOOD", "DEF-ONE-GOD", "DEF-INFINITE", "DEF-IMMUTABLE", "DEF-ETERNAL", "DEF-HAS-INTELLECT", "DEF-HAS-WILL", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-PURE-ACT", "885a98f3-cd54-41c5-89bc-25c341415890", "DEF-LIFE-PRESENT-AT"]
disambiguations = ["DISAMB-GOD", "DISAMB-IN-ACT", "DISAMB-INFINITY", "DISAMB-ETERNITY-AND-TEMPORAL-PERPETUITY", "DISAMB-IMMUTABLE-AND-CURRENTLY-UNCHANGING", "DISAMB-INTELLECT-AND-SENSE-COGNITION", "DISAMB-POTENCY", "1f2d3b9b-0b6b-459c-8871-3f136ad6d78a"]

[[statement]]
id = "Controls for the nine-restricted self-operation premises"
lean = "Control.Controls"
paraphrase = "Closed controls on one interpretation family with two beings (Bool), one respect and one time, where nothing is in potency, everything is in act and causes everything, nothing is composite and only true is GOD_4: (1) true has the nine and operates, false is a pure act with no intellect and no immanent operation (it lacks the nine through intellect and through uniqueness of GOD_4); the nine-restricted operation premise holds and STMT-PURE-ACT-OPERATES fails; (2) with life only at true, the nine-restricted life premise holds and STMT-PURE-ACT-LIVES fails; (3) some being has the nine and lives at some time (nonvacuity); (4) with both beings intellectual and only true LIVING_1, the nine-restricted life premise and the restricted sense bridge hold while false is an intellectual pure act that is not LIVING_1, so 'Whatever HAS_INTELLECT_1 lives' fails, as does its restriction to pure acts (only these two premises of the route are checked in this model, not the rest of its bundle); (5) sense-mixing control: with nothing LIVING_1, the nine-restricted life premise holds and true has the nine and is LIVING_2 without being LIVING_1. Statements about these interpretations only."
definitions = ["f91f5056-8a32-416b-b234-d0e78cd16ce8", "885a98f3-cd54-41c5-89bc-25c341415890", "DEF-PURE-ACT", "DEF-HAS-INTELLECT"]
disambiguations = ["1f2d3b9b-0b6b-459c-8871-3f136ad6d78a"]

