disambiguations = ["7507d645-874d-5434-add8-2f49c2801d36"]

[[argument]]
id = "A2 actual source endpoint obstruction certificate"
theorem = "endpointObstruction"
premises = []
conclusion = "A2 actual source endpoint obstruction"
rule = "Explicit finite interpretation"
meaning = "The only individual exists in the only world, making contingency impossible and local causality vacuous. Its empty full ancestor graph fails headless coverage, and it is a necessary isolated graph source with no outgoing actual edge. The obstruction to the necessary-concrete node is that the supplied Profile's concrete predicate is unconstrained by Ontic: abstractProfile sets concrete to fun _ => False. Any Profile with an empty concrete predicate refutes NecessaryConcreteAt, and hence the bridge from actual source necessity to the necessary-concrete root-route node, regardless of the A2 inputs; those inputs are realized jointly here only to show they do not themselves fix concreteness. The missing piece is an explicit calibration of concreteness to the causal source, not a defect of the source-composition inputs. No capability-to-exercise direction or original sense completion is asserted."
