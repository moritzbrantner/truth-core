premises = []
axioms = ["propext", "Classical.choice", "Quot.sound"]
conclusion = "The marked Bool object has a name-free description"
rule = "Direct construction or Mathlib first-order interpretation transport"
meaning = "PHYSICAL_OF_A_GROUND_3: in the explicit one-unary-marker Bool interpretation marking true, the formula marking its object variable describes exactly true, with no parameters."
senses = { PHYSICAL_OF_A_GROUND = "PHYSICAL_OF_A_GROUND_3" }

