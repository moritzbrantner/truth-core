[[statement]]
id = "Essential existence and intrinsic explanation separate in typed finite controls"
lean = "SeparationControls"
paraphrase = "Two actual necessarily existing individuals witness each direction of non-entailment between own-essence membership of an existence fact and assignment of a sound candidate intrinsic reason for that fact. In a third all-existing two-being profile, the modal existence-requirement relation holds both ways while the nature of false requires true's existence but the nature of true does not require false's; the causal edges in both directions are absent. Own-essence membership is sense NECESSARY_EXISTENCE_BY_OWN_NATURE_3 and the candidate intrinsic reason is sense NECESSARY_EXISTENCE_BY_OWN_NATURE_4; the sourced sense _1 is not formalized here. The first control assigns no explanation to any existence fact, so it does not satisfy the existence PSR. These finite analyst interpretations distinguish three explicit meanings, not the metaphysical possibility of the models, the adequacy of intrinsic explanation, or the truth of a necessary-being thesis."
definitions = ["0b1d99d6-f96b-4a07-90d1-c3fc5c5946bb", "72a1e556-042a-4358-a8a0-a2a87cc036d6", "388b7ed8-ae8e-4ae2-8ba6-0e50b9bb27c3", "38b92bb6-33ae-5817-85c6-b5a1afa63bd1", "d7f66ca4-38c0-4cbb-ac5c-b2237ec3645c", "fcb346d7-ddd2-50bb-a7c2-3d79d41b8eae", "d513fb8a-64ee-5d49-ae56-4d695f93ca71", "70fccbe6-be10-5709-9d73-53a436b97f25"]
disambiguations = ["13843b8b-4ef3-500e-949d-27e78b9dfaf9"]

[[argument]]
id = "Finite separation of own-essence membership and intrinsic explanation"
theorem = "checks"
premises = []
axioms = []
sense_mixing_control = true
conclusion = "Essential existence and intrinsic explanation separate in typed finite controls"
rule = "Explicit finite same-domain models with sound candidate explanations and essence-indexed existence facts"
meaning = "A verified finite-model distinction of essential existence, explanation of existence by an intrinsic reason token, and modal co-requirement. The controls identify which bridge hypotheses the God-existence program needs; they do not refute their metaphysical applicability or claim intrinsic adequacy. It is a premise-free sense-mixing control: senses NECESSARY_EXISTENCE_BY_OWN_NATURE_2, _3 and _4 are shown not to coincide, and no bridge between them is assumed. Root-facing next step for STMT-NECESSARY-GROUND-HAS-INTRINSIC-REASON in #1595: under its existence-PSR context the candidate token already follows from PSR plus exclusion of other reasons (candidate_intrinsic_of_psr_without_other_reasons, without the essence sense), so the live gap is the adequacy of that token, to be compared with the existing underived essence-esse route #319."
