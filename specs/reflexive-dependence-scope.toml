[[relation]]
id = "Unrestricted dependence-to-grounding bridge strengthens its distinct-relata restriction"
subject_kind = "statement"
subject_id = "STMT-ACTUAL-DEPENDENCE-IS-GROUNDING"
predicate = "strengthens"
object_kind = "statement"
object_id = "If an actual CONCRETE_6 individual depends for its being on a different one, that one grounds it"
