[[relation]]
id = "A sincere assertion witness refutes the denial of belief"
subject_kind = "argument"
subject_id = "Belief from a sincere assertion of the universal denial of belief"
predicate = "refutes"
object_kind = "statement"
object_id = "Nobody believes any supplied content"
note = "The assertion witness believes the denial under the explicit sincerity bridge in the same belief relation."
