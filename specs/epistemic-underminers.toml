subject_kind = "argument"
subject_id = "Eligible uptake yields a warranted actual belief"
predicate = "refutes"
object_kind = "statement"
object_id = "No actual belief meets the supplied warrant standard"
note = "The eligible case supplies an actual belief that meets the very warrant standard in the denial."

[[relation]]
