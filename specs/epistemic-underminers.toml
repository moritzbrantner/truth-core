[[relation]]
id = "Opposite correct answers refute blanket output invariance"
subject_kind = "argument"
subject_id = "Correct answers to opposite truths exclude blanket insensitivity"
predicate = "refutes"
object_kind = "statement"
object_id = "All supplied formation methods are insensitive to opposite truths"
note = "The paired outputs vary in the same supplied method class and state profile used by the denial."
