[[argument]]
id = "Sincere individuated assertions with scoped accuracy are true"
theorem = "contentRouteA"
premises = ["Individuated veracity ContentSincere", "Individuated veracity ScopedAccuracy", "Individuated veracity AssertionsInDomain"]
conclusion = "Individuated veracity ContentAssertionTruth"
axioms = []
rule = "Content-preserving conditional composition and interpreted negation"
meaning = "Same bearer and identical content; scoped accuracy applies only through the explicit assertion-domain premise."

[[argument]]
id = "Selected individuated countertruth assent excludes false assertion"
theorem = "contentRouteB"
premises = ["Individuated veracity CounterComplete", "Individuated veracity NoContraryAssertion"]
conclusion = "Individuated veracity ContentAssertionTruth"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Content-preserving conditional composition and interpreted negation"
meaning = "Classical contradiction using the reused interpreted-negation law. No content identity is collapsed into a truth value; no sincerity or global completeness is assumed."

[[argument]]
id = "Selected-domain cognition covers asserted countercontents"
theorem = "counterCompleteFromDomain"
premises = ["Individuated veracity DomainComplete", "Individuated veracity AssertionsInDomain", "Individuated veracity NegationClosed"]
conclusion = "Individuated veracity CounterComplete"
axioms = []
rule = "Content-preserving conditional composition and interpreted negation"
meaning = "Domain completeness plus actual assertion coverage and closure under interpreted negation supply exactly the minimal countercontent scope. None of these coverage bridges follows merely from naming a domain."

[[argument]]
id = "Individuated assertion truth reconnects the legacy assertion route"
theorem = "legacyAssertionFromContent"
premises = ["Individuated veracity ContentAssertionTruth", "Individuated veracity AssertionRepresentation"]
conclusion = "5a035a1e-e668-4327-b989-2f0aff4aece2"
axioms = []
rule = "Content-preserving conditional composition and interpreted negation"
meaning = "One-way represented asserted content plus the existing Disquotes bridge yields the exact existing legacy assertion-truth target; then the checked confirmation/authority route applies. Arbitrary legacy attitude translation is not assumed."

[[argument]]
id = "Existential attitude erasure has one-way assertion representation"
theorem = "erasureRepresented"
premises = []
conclusion = "Individuated veracity ErasureRepresentation"
axioms = []
rule = "Content-preserving conditional composition and interpreted negation"
meaning = "A diagnostic of the defined existential erasure only; this does not establish the representation premise for an arbitrary legacy Veracity or preserve all content attitudes."

[[argument]]
id = "Individuated veracity representation and scope controls"
theorem = "controls"
premises = []
conclusion = "Individuated veracity structural controls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Content-preserving conditional composition and interpreted negation"
meaning = "Restored content identities preserve both conditional routes and a standing cognitive rival. Tagged co-truth across all modeled worlds permits selective assent and precludes any exact Prop-attitude factorization. Domain gaps expose missing coverage or negation closure. Utility, moral permission and full theism are not modeled."
