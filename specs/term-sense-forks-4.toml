lean = "NominalGodIsClassicalGod"
paraphrase = "OPEN sense bridge GOD_1 to GOD_4 (attribution deferred): whatever meets the full nominal description (the only being maximal in being, causing the being and every perfection of every other being, entering into the composition of nothing) is the God of classical theism (IsGod). Proved equivalent to STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE."
definitions = ["DEF-GOD-NOMINAL-Q13", "DEF-GOD-OF-CLASSICAL-THEISM", "DEF-MAXIME-ENS", "DEF-CAUSE-OF-PERFECTION", "DEF-REMOTE-FROM-ALL"]
