disambiguations = ["DISAMB-GOD"]

[[statement]]
id = "STMT-ROUTE-NAMES-DESCRIBED-PRINCIPLE"
label = "The fully described principle is God in the route's reading of the naming use"
lean = "RouteNamesDescribedPrinciple"
paraphrase = "OPEN analyst premise (attribution deferred): whatever meets the full nominal description (the only being maximal in being, causing the being and every perfection of every other being, entering into the composition of nothing) is God in the route's reading of the naming use."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-GOD-NOMINAL-Q13", "DEF-MAXIME-ENS", "DEF-CAUSE-OF-PERFECTION", "DEF-REMOTE-FROM-ALL"]
disambiguations = ["DISAMB-GOD", "DISAMB-MAXIME-ENS"]

[[statement]]
id = "STMT-ROUTE-GOD-HAS-CLASSICAL-ATTRIBUTES"
label = "Whatever is God in the route's reading of the attribute use has the classical attributes"
lean = "RouteGodHasClassicalAttributes"
paraphrase = "OPEN analyst premise (attribution deferred): whatever is God in the route's reading of the attribute use satisfies the signature's HasClassicalAttributes field."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE"]
disambiguations = ["DISAMB-GOD"]

[[statement]]
id = "STMT-DESCRIBED-PRINCIPLE-HAS-CLASSICAL-ATTRIBUTES"
label = "The fully described principle (GOD_1 description) has the classical attributes"
lean = "DescribedPrincipleHasClassicalAttributes"
paraphrase = "Whatever meets the full nominal description (the only being maximal in being, causing the being and every perfection of every other being, entering into the composition of nothing) satisfies the signature's HasClassicalAttributes field. It does not say that anything meets the description."
definitions = ["DEF-GOD-NOMINAL-Q13", "DEF-CLASSICAL-ATTRIBUTES-BUNDLE", "DEF-MAXIME-ENS", "DEF-CAUSE-OF-PERFECTION", "DEF-REMOTE-FROM-ALL"]
disambiguations = ["DISAMB-GOD", "DISAMB-MAXIME-ENS"]

[[statement]]
id = "STMT-NOMINAL-GOD-NAMES-DESCRIBED-PRINCIPLE"
label = "GOD_1: whatever meets the full description is God in what the name signifies (analytic)"
lean = "NominalGodNamesDescribedPrinciple"
paraphrase = "GOD_1 reading of the naming premise (attribution deferred): whatever is the only being maximal in being, causes the being and every perfection of every other being and enters into the composition of nothing meets everything the name 'God' signifies under the adopted fuller profile. Analytic in this reading; a distinct statement from STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE, which reads God as GOD_4."
definitions = ["DEF-GOD-NOMINAL-Q13", "DEF-NOMINAL-DEFINITION", "DEF-MAXIME-ENS", "DEF-CAUSE-OF-PERFECTION", "DEF-REMOTE-FROM-ALL"]
disambiguations = ["DISAMB-GOD", "DISAMB-MAXIME-ENS"]

[[statement]]
id = "STMT-NOMINAL-GOD-IS-MAXIMAL-IN-BEING"
label = "GOD_1: whatever is God in what the name signifies is maximal in being (analytic)"
lean = "NominalGodIsMaximalInBeing"
paraphrase = "GOD_1 reading of the converse premise (attribution deferred): whatever meets the full nominal description is maximal in being. Analytic in this reading; a distinct statement from STMT-GOD-IS-MAXIMAL-IN-BEING, which reads God as GOD_4."
definitions = ["DEF-GOD-NOMINAL-Q13", "DEF-MAXIME-ENS", "DEF-ESSE"]
disambiguations = ["DISAMB-GOD", "DISAMB-MAXIME-ENS"]

[[statement]]
