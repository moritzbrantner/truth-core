# Sense forks, batch 4: "mutable / in potency in some way" (DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER,
# with its duplicate DISAMB-MUTABILITY-CHANNEL) and "God" (DISAMB-GOD).
# Owner rules (#1233 B): each sense its own Lean declaration, one argument per sense,
# coverage and exclusivity as explicit OPEN premises, per-sense arguments conclude root-route nodes.
# (docs/notes/load-bearing-terms.md; explorations/term-sense-forks-4-*.toml). Analyst formulations,
# attribution deferred.

[batch]
vocab = "TruthCore.Causality.TermSenseForks"
results = "TruthCore.Results.Causality.TermSenseForks4"

# ---- "mutable" ----

[[statement]]
id = "STMT-MUTABILITY-SENSES-EXHAUSTIVE"
label = "Each use of 'in potency in some respect' in the eternity step is MUTABLE_1, MUTABLE_2 or MUTABLE_3"
lean = "MutabilitySensesExhaustive"
paraphrase = "OPEN frontier premise (coverage, attribution deferred): each of the two uses of 'in potency in some respect' in the root argument IMMUTABLE-IS-PRIMITIVE-ETERNAL-FROM-TYPED-BOETHIAN (what has succession in its life is in potency; what begins or ceases to live is in potency) is read as mutable in itself (MUTABLE_1, MutableInSubject: in potency in some respect), mutable through another (MUTABLE_2, MutableThroughAnother: some other being has power to change it) or mutable in some way (MUTABLE_3, MutableInSomeWay: either), selected by the route's reading, and the use's predicate is exactly that sense's predicate."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-POTENCY", "DEF-MUTABLE-THROUGH-ANOTHER", "DEF-MUTABLE-IN-SOME-WAY"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-MUTABILITY-SENSE-UNIQUE"
label = "The eternity step reads 'in potency in some respect' in one MUTABLE sense only"
lean = "MutabilitySenseUnique"
paraphrase = "OPEN frontier premise (exclusivity, attribution deferred): the route's reading of 'in potency in some respect' in the eternity step selects at most one sense, so both uses take the same one. Not a disjointness claim: MUTABLE_1 and MUTABLE_2 each imply MUTABLE_3."
definitions = ["DEF-ROUTE-SENSE-SELECTION"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-LIFE-BOUNDARY-REQUIRES-POWER-IN-ANOTHER"
label = "Whatever begins or ceases to live is MUTABLE_2: another being has power over it"
lean = "LifeBoundaryRequiresPowerInAnother"
paraphrase = "MUTABLE_2, OPEN analyst premise (attribution deferred): whatever begins or ceases to live, between an earlier and a later time of the duration frame, is mutable through another: some other being has the power to change it in some respect (navigation: ST I q.9 a.2, creatures depend on the creator giving esse). It says nothing about potency in the thing itself."
definitions = ["DEF-MUTABLE-THROUGH-ANOTHER", "DEF-LIFE-PRESENT-AT"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-LIFE-BOUNDARY-REQUIRES-SOME-MUTABILITY"
label = "Whatever begins or ceases to live is MUTABLE_3: mutable in itself or through another"
lean = "LifeBoundaryRequiresSomeMutability"
paraphrase = "MUTABLE_3, OPEN analyst premise (attribution deferred): whatever begins or ceases to live is mutable in some way, in potency in itself in some respect or in another being's power. The contrapositive of q.10 a.1 ('what is altogether immutable can have neither beginning nor end') with 'altogether immutable' read as immutable through both of q.9 a.2's channels; the weakest of the three boundary readings."
definitions = ["DEF-MUTABLE-IN-SOME-WAY", "DEF-LIFE-PRESENT-AT"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-SUBJECT-OF-ANOTHERS-POWER-HAS-POTENCY"
label = "Sense bridge MUTABLE_2 to MUTABLE_1: what another can change is in potency in itself"
lean = "SubjectOfAnothersPowerHasPotency"
paraphrase = "OPEN sense bridge MUTABLE_2 to MUTABLE_1 (attribution deferred): whatever some other being has power to change is in potency in itself in some respect. Q.9 a.2 keeps the two channels apart; a dependent being with no potency in itself (an emanated pure intelligence) would deny this bridge."
definitions = ["DEF-POTENCY", "DEF-MUTABLE-THROUGH-ANOTHER"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-ROUTE-SUCCESSION-IS-MUTABILITY"
label = "Whatever has succession in its life is mutable in the route's reading of that use"
lean = "RouteSuccessionIsMutability"
paraphrase = "OPEN analyst premise (attribution deferred): whatever has succession in its life (its life-state differs between two times at which it lives) is mutable in the route's reading of the succession use."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-LIFE-PRESENT-AT"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-ROUTE-BOUNDARY-IS-MUTABILITY"
label = "Whatever begins or ceases to live is mutable in the route's reading of that use"
lean = "RouteBoundaryIsMutability"
paraphrase = "OPEN analyst premise (attribution deferred): whatever begins or ceases to live is mutable in the route's reading of the boundary use."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-LIFE-PRESENT-AT"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

[[statement]]
id = "STMT-ROUTE-IMMUTABLE-HAS-UNCHANGING-LIFE"
label = "Immutable in the route's succession-use reading: no beginning, end or succession of life"
lean = "RouteImmutableHasUnchangingLife"
paraphrase = "Whatever is not mutable in the route's reading of the succession use has a life that is interminable (neither begins nor ends) and tota simul (without succession). It does not say that it lives."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-BOETHIAN-ETERNAL", "DEF-LIFE-PRESENT-AT"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER"]

# ---- "God" ----

[[statement]]
id = "STMT-GOD-SENSES-EXHAUSTIVE"
label = "Each use of 'God' on the designated root route is GOD_1, GOD_2, GOD_3 or GOD_4"
lean = "GodSensesExhaustive"
paraphrase = "OPEN frontier premise (coverage, attribution deferred): each of the two uses of 'God' on the designated root route (the fully described principle is God; whatever is God has the classical attributes) is read as what the name signifies (GOD_1, NominalGod: the full q.13 a.8 ad 2 description with the quarta via's cause of every perfection), the Summa's God parameter of the older stage-1 routes (GOD_2), what is called God in usage (GOD_3, CalledGod) or the God of classical theism (GOD_4, Signature.IsGod), selected by the route's reading, and the use's predicate is exactly that sense's predicate. Scott's and Goedel's GodLike are not listed: they are world-indexed predicates over a positivity constant, and a rival who reads the route's God that way denies this premise."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-GOD-NOMINAL-Q13", "DEF-GOD-AS-NAMED-IN-THE-SUMMA", "DEF-GOD-WHAT-ALL-UNDERSTAND", "DEF-GOD-OF-CLASSICAL-THEISM"]
disambiguations = ["DISAMB-GOD"]

[[statement]]
id = "STMT-GOD-SENSE-UNIQUE"
label = "The designated root route reads 'God' in one GOD sense only"
lean = "GodSenseUnique"
paraphrase = "OPEN frontier premise (exclusivity, attribution deferred): the route's reading of 'God' selects at most one sense, so the naming use and the attribute use take the same one. A constraint on the reading, not a claim that the senses pick out different beings."
