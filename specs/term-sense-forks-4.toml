[[statement]]
id = "STMT-SUMMA-GOD-IS-CLASSICAL-GOD"
label = "Sense bridge GOD_2 to GOD_4: what the Summa's stage-1 routes call God is the classical God"
lean = "SummaGodIsClassicalGod"
paraphrase = "OPEN sense bridge GOD_2 to GOD_4 (attribution deferred): whatever falls under the Summa's God parameter of the older stage-1 maxime ens routes is the God of classical theism (IsGod)."
definitions = ["DEF-GOD-AS-NAMED-IN-THE-SUMMA", "DEF-GOD-OF-CLASSICAL-THEISM"]
disambiguations = ["DISAMB-GOD"]

[[statement]]
id = "STMT-DESCRIBED-PRINCIPLE-IS-CALLED-GOD"
label = "GOD_3: whatever meets the full description is called God in usage"
lean = "DescribedPrincipleIsCalledGod"
paraphrase = "GOD_3 reading of the naming premise, OPEN analyst premise (attribution deferred): whatever meets the full nominal description is called 'God' by the speech community ('et hoc dicimus Deum', extended from the quarta via's maximal being to the fuller profile). Usage only: it says how the name is applied, not what its bearer is."
definitions = ["DEF-GOD-WHAT-ALL-UNDERSTAND", "DEF-MAXIME-ENS", "DEF-CAUSE-OF-PERFECTION", "DEF-REMOTE-FROM-ALL"]
disambiguations = ["DISAMB-GOD", "DISAMB-MAXIME-ENS"]

[[statement]]
id = "STMT-CALLED-GOD-IS-CLASSICAL-GOD"
label = "Sense bridge GOD_3 to GOD_4: whatever is called God is the God of classical theism"
lean = "CalledGodIsClassicalGod"
paraphrase = "OPEN sense bridge GOD_3 to GOD_4 (attribution deferred): whatever the speech community calls 'God' is the God of classical theism (IsGod). The 'but is it God?' objection to the five ways denies it."
definitions = ["DEF-GOD-WHAT-ALL-UNDERSTAND", "DEF-GOD-OF-CLASSICAL-THEISM"]
disambiguations = ["DISAMB-GOD"]

[[statement]]
id = "STMT-TERM-SENSE-FORKS-4-CONTROLS"
label = "Finite models for the MUTABLE and GOD sense forks (mixed readings, omissions, nonvacuity)"
lean = "TermSenseForks4Controls"
paraphrase = "Finite interpretations for the mutability and God forks: per term, a model in which coverage holds, exclusivity fails, the two uses are read in different senses (succession MUTABLE_1 and boundary MUTABLE_2; naming GOD_1 and attributes GOD_4), every other premise of the joint theorem holds and its conclusion fails; a nonvacuity witness per joint theorem; a model in which both the MUTABLE_2 and MUTABLE_3 boundary statements hold, the sense bridge fails and STMT-LIFE-BOUNDARY-REQUIRES-POTENCY fails; a model in which the bridge holds without a boundary premise and the root node fails; a model in which the GOD_1 naming (analytic), the GOD_2 reduced naming and the GOD_3 usage naming hold, something meets the full description, and STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE fails; a model in which the GOD_3 bridge holds without the usage premise and the root premise fails; and a model in which every premise of GOD-EXISTS-FROM-MAXIME-ENS-CAUSING-ALL except the quarta via conclusion and excluded middle holds and nothing is God. Satisfiability and omission only; no model describes reality."
definitions = ["DEF-ROUTE-SENSE-SELECTION", "DEF-POTENCY", "DEF-MUTABLE-THROUGH-ANOTHER", "DEF-MUTABLE-IN-SOME-WAY", "DEF-GOD-NOMINAL-Q13", "DEF-GOD-AS-NAMED-IN-THE-SUMMA", "DEF-GOD-WHAT-ALL-UNDERSTAND", "DEF-GOD-OF-CLASSICAL-THEISM"]
disambiguations = ["DISAMB-POTENCY-IN-SUBJECT-VS-IN-ANOTHER", "DISAMB-GOD"]

# ---- Arguments: "mutable" ----

[[argument]]
id = "LIFE-BOUNDARY-POTENCY-THROUGH-ANOTHER"
label = "MUTABLE_2: a life boundary requires potency, through another's power and a sense bridge"
theorem = "lifeBoundaryPotencyThroughAnother"
premises = ["STMT-LIFE-BOUNDARY-REQUIRES-POWER-IN-ANOTHER", "STMT-SUBJECT-OF-ANOTHERS-POWER-HAS-POTENCY"]
conclusion = "STMT-LIFE-BOUNDARY-REQUIRES-POTENCY"
strong_version_needed = { "STMT-LIFE-BOUNDARY-REQUIRES-POWER-IN-ANOTHER" = "This is the MUTABLE_2 branch of the fork and keeps its own boundary reading by design; the weaker MUTABLE_3 reading also suffices with the same bridge (LIFE-BOUNDARY-POTENCY-FROM-SOME-MUTABILITY)." }
rule = "Hypothetical syllogism through the sense bridge"
meaning = "MUTABLE_2 (THROUGH_ANOTHER) branch of the boundary use: whatever begins or ceases to live is in another being's power, and (explicit sense bridge) whatever is in another's power is in potency in itself; so whatever begins or ceases to live is in potency in itself in some respect, the root-route node. The controls give a model in which the MUTABLE_2 premise holds, the bridge fails and the node fails."

[[argument]]
id = "LIFE-BOUNDARY-POTENCY-FROM-SOME-MUTABILITY"
label = "MUTABLE_3: a life boundary requires potency, from mutability in some way and a sense bridge"
theorem = "lifeBoundaryPotencyFromSomeMutability"
premises = ["STMT-LIFE-BOUNDARY-REQUIRES-SOME-MUTABILITY", "STMT-SUBJECT-OF-ANOTHERS-POWER-HAS-POTENCY"]
conclusion = "STMT-LIFE-BOUNDARY-REQUIRES-POTENCY"
rule = "Disjunction elimination; the second case through the sense bridge"
meaning = "MUTABLE_3 (IN_SOME_WAY) branch of the boundary use, the reading closest to q.10 a.1: whatever begins or ceases to live is mutable in itself or through another. In the first case it is in potency in itself; in the second the explicit sense bridge gives potency in itself. So whatever begins or ceases to live is in potency in itself in some respect. The same omission model shows the bridge is needed."

[[argument]]
id = "LIFE-BOUNDARY-SOME-MUTABILITY-FROM-SUBJECT"
label = "Strength order: the MUTABLE_1 boundary statement implies the MUTABLE_3 one"
theorem = "lifeBoundarySomeMutabilityFromSubject"
premises = ["STMT-LIFE-BOUNDARY-REQUIRES-POTENCY"]
conclusion = "STMT-LIFE-BOUNDARY-REQUIRES-SOME-MUTABILITY"
rule = "Disjunction introduction (left)"
meaning = "Strength order between MUTABLE_1 and MUTABLE_3 in the boundary use: if whatever begins or ceases to live is in potency in itself, it is mutable in some way."

[[argument]]
id = "LIFE-BOUNDARY-SOME-MUTABILITY-FROM-ANOTHER"
label = "Strength order: the MUTABLE_2 boundary statement implies the MUTABLE_3 one"
theorem = "lifeBoundarySomeMutabilityFromAnother"
premises = ["STMT-LIFE-BOUNDARY-REQUIRES-POWER-IN-ANOTHER"]
conclusion = "STMT-LIFE-BOUNDARY-REQUIRES-SOME-MUTABILITY"
rule = "Disjunction introduction (right)"
meaning = "Strength order between MUTABLE_2 and MUTABLE_3 in the boundary use: if whatever begins or ceases to live is in another's power, it is mutable in some way."

[[argument]]
id = "MUTABILITY-SENSE-FORK-UNCHANGING-LIFE"
label = "MUTABLE fork summary: immutable in one sense means no beginning, end or succession of life"
theorem = "unchangingLifeByMutabilitySenseFork"
premises = ["STMT-MUTABILITY-SENSES-EXHAUSTIVE", "STMT-MUTABILITY-SENSE-UNIQUE", "STMT-ROUTE-SUCCESSION-IS-MUTABILITY", "STMT-ROUTE-BOUNDARY-IS-MUTABILITY"]
conclusion = "STMT-ROUTE-IMMUTABLE-HAS-UNCHANGING-LIFE"
rule = "Uses agree from coverage and exclusivity; modus tollens on each use"
meaning = "Optional summary over MUTABLE_1-3. Coverage reads both uses of 'in potency in some respect' in the eternity step (succession, boundary) in selected senses; exclusivity makes them one sense. So whatever is not mutable in that one sense has neither succession nor a beginning or end of life. The controls give the mixed reading (succession MUTABLE_1, boundary MUTABLE_2): a being with no potency in itself, in another's power, begins to live, and the conclusion fails."

# ---- Arguments: "God" ----

[[argument]]
id = "NOMINAL-GOD-NAMING-IS-ANALYTIC"
label = "GOD_1: the naming premise read nominally is analytic"
theorem = "nominalGodNamesDescribedPrinciple"
premises = []
conclusion = "STMT-NOMINAL-GOD-NAMES-DESCRIBED-PRINCIPLE"
rule = "Conjunction introduction"
meaning = "GOD_1 (NOMINAL) branch of the naming use: read as what the name signifies, 'the fully described principle is God' needs no premise. Recorded as its own statement so that it cannot be taken for the GOD_4 root premise STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE, whose Lean declaration is generic in the God predicate."

[[argument]]
id = "NOMINAL-GOD-MAXIMALITY-IS-ANALYTIC"
label = "GOD_1: 'God is maximal in being' read nominally is analytic"
theorem = "nominalGodIsMaximalInBeing"
premises = []
conclusion = "STMT-NOMINAL-GOD-IS-MAXIMAL-IN-BEING"
rule = "Conjunction elimination"
meaning = "GOD_1 (NOMINAL) branch of the converse premise: read as what the name signifies, whatever is God is maximal in being, with no premise. Recorded as its own statement, distinct from the GOD_4 premise STMT-GOD-IS-MAXIMAL-IN-BEING."

[[argument]]
id = "GOD-NAMES-DESCRIBED-FROM-NOMINAL"
label = "GOD_1 to root: the GOD_1-to-GOD_4 bridge gives the naming premise (transcription)"
theorem = "godNamesDescribedFromNominal"
premises = ["STMT-NOMINAL-GOD-IS-CLASSICAL-GOD"]
conclusion = "STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE"
rule = "Modus ponens after conjunction introduction"
meaning = "Transcription (single application): GOD_1 branch to the root premise. The naming premise in the NOMINAL sense is analytic, so all the content of the GOD_4 premise sits in the sense bridge: whatever meets the full nominal description is the God of classical theism. With NOMINAL-BRIDGE-FROM-GOD-NAMES the two are equivalent; the nominal reading adds no warrant."
transcription = "single_application"

[[argument]]
id = "NOMINAL-BRIDGE-FROM-GOD-NAMES"
label = "Converse: the GOD_4 naming premise gives the GOD_1-to-GOD_4 bridge (transcription)"
theorem = "nominalBridgeFromGodNames"
premises = ["STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE"]
conclusion = "STMT-NOMINAL-GOD-IS-CLASSICAL-GOD"
rule = "Conjunction elimination and modus ponens"
meaning = "Transcription (single application): the converse of GOD-NAMES-DESCRIBED-FROM-NOMINAL. The GOD_4 naming premise gives the GOD_1 to GOD_4 bridge, so the two statements are equivalent."
transcription = "single_application"

[[argument]]
id = "GOD-NAMES-DESCRIBED-FROM-SUMMA"
label = "GOD_2: the reduced naming for the Summa's God and a GOD_2-to-GOD_4 bridge give the naming premise"
theorem = "godNamesDescribedFromSumma"
premises = ["STMT-GOD-NAMES-THE-UNIQUE-MAXIME-ENS", "STMT-SUMMA-GOD-IS-CLASSICAL-GOD"]
conclusion = "STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE"
strong_version_needed = { "STMT-GOD-NAMES-THE-UNIQUE-MAXIME-ENS" = "The GOD_2 branch starts from the Summa's own naming premise, which exists only in the reduced form; the fuller naming instantiated at the Summa's God would suffice but no route records it for that parameter." }
rule = "Weakening of the antecedent, then the sense bridge"
meaning = "GOD_2 (SUMMA) branch of the naming use: the only maximum in being that causes the being of every other being is God in the Summa's sense (the reduced naming premise for the God parameter of the older stage-1 routes), and (explicit sense bridge) what the Summa calls God is the God of classical theism. So the fully described principle, which meets the reduced description, is the God of classical theism. The controls give a model with the reduced Summa naming and no classical God."

[[argument]]
id = "GOD-NAMES-DESCRIBED-FROM-USAGE"
label = "GOD_3: usage naming and a GOD_3-to-GOD_4 bridge give the naming premise"
theorem = "godNamesDescribedFromUsage"
premises = ["STMT-DESCRIBED-PRINCIPLE-IS-CALLED-GOD", "STMT-CALLED-GOD-IS-CLASSICAL-GOD"]
conclusion = "STMT-GOD-NAMES-THE-FULLY-DESCRIBED-PRINCIPLE"
rule = "Hypothetical syllogism through the sense bridge"
meaning = "GOD_3 (USAGE) branch of the naming use: whatever meets the full description is called God, and (explicit sense bridge) whatever is called God is the God of classical theism. So the fully described principle is the God of classical theism. The controls give a model with usage naming and no classical God (bridge omitted) and one with the bridge and no usage (naming premise omitted)."

[[argument]]
id = "GOD-SENSE-FORK-DESCRIBED-PRINCIPLE-ATTRIBUTES"
label = "GOD fork summary: the fully described principle has the classical attributes"
theorem = "describedPrincipleAttributesByGodSenseFork"
premises = ["STMT-GOD-SENSES-EXHAUSTIVE", "STMT-GOD-SENSE-UNIQUE", "STMT-ROUTE-NAMES-DESCRIBED-PRINCIPLE", "STMT-ROUTE-GOD-HAS-CLASSICAL-ATTRIBUTES"]
conclusion = "STMT-DESCRIBED-PRINCIPLE-HAS-CLASSICAL-ATTRIBUTES"
rule = "Uses agree from coverage and exclusivity; hypothetical syllogism"
meaning = "Optional summary over GOD_1-4. Coverage reads both uses of 'God' on the designated root route (naming, attributes) in selected senses; exclusivity makes them one sense. So whatever meets the full description is God in that sense and has the classical attributes. The controls give the mixed reading (naming GOD_1, attributes GOD_4): the naming holds analytically, the described principle is not the classical God and lacks the attributes."

[[argument]]
id = "TERM-SENSE-FORKS-4-CONTROLS"
label = "Controls for the MUTABLE and GOD sense forks"
theorem = "termSenseForks4Controls"
premises = []
conclusion = "STMT-TERM-SENSE-FORKS-4-CONTROLS"
rule = "Explicit finite interpretations"
meaning = "Finite interpretations for the mutability and God forks: the mixed reading of each term with coverage and without exclusivity, with the joint conclusion failing; a nonvacuity witness per joint theorem; an omission model for the MUTABLE_2/MUTABLE_3 sense bridge and for the boundary premise; an omission model for the GOD_1, GOD_2 and GOD_3 sense bridges at once (their namings hold, the root premise fails) and for the GOD_3 usage premise; an omission model for the quarta via conclusion in GOD-EXISTS-FROM-MAXIME-ENS-CAUSING-ALL. Satisfiability and omission only; no model describes reality."

# ---- The quarta via's own conclusion on the root route (#1237 connection plan) ----

[[argument]]
id = "GOD-EXISTS-FROM-MAXIME-ENS-CAUSING-ALL"
