[[statement]]
id = "Along every populated descent, adjacent Grim Reaper pieces are co-possible"
lean = "ReaperPiecesPossible"
paraphrase = "OPEN analyst premise, attribution deferred (Grim Reaper style, the analogue of a possible Placer trio placed in the slots of a past): for the supplied station-register frame, in every history v accessible from the selected world, along every strictly descending sequence of moments c whose first moment has a contingent concrete individual present in v, for every n some world accessible from v realizes both the local piece of station n and that of station n + 1. A local piece is a station at c n obeying positive trigger, emission, forwarding and admissibility relative to the station at c (n + 1); admissibility constrains only the register at c n but refers to every upstream slot of the whole descent. Registers are not tied to existence or presence in the history, so a piece has no existential import, and the bridge from recombining concrete stations to this typed premise is not built. It ranges over every descent, including t, t/2, t/4, ... in dense time. It says nothing about gluing the pieces together. 'Concrete' is the supplied Concrete parameter, read under the adopted esse criterion; the Lean type does not enforce that reading."
definitions = ["Local Reaper pieces co-possible along every populated descent", "Local Reaper piece at a station of a descent of moments", "Reaper station registers of a history's worlds", "DEF-INDEXED-SIGNAL-POSITIVE-TRIGGER", "DEF-INDEXED-SIGNAL-EMISSION", "DEF-INDEXED-SIGNAL-FORWARDING", "DEF-INDEXED-SIGNAL-INDEX-ADMISSIBILITY", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Co-possible Grim Reaper pieces along a populated descent glue into one possible world"
lean = "ReaperPatchwork"
paraphrase = "OPEN analyst gluing premise, attribution deferred (Grim Reaper patchwork style): for the supplied station-register frame, in every history v accessible from the selected world, along every strictly descending sequence of moments c whose first moment has a contingent concrete individual present in v, if for every n some world accessible from v realizes the local pieces of stations n and n + 1 together, then some single world accessible from v realizes the local pieces of all stations along c. It asserts no piece is possible: in a beginningless history whose registers never host a piece it holds while pasts are neither founded nor begun. Because no world realizes every piece along a descent (a theorem), this typed premise for a given frame is equivalent to 'along every populated descent, adjacent pieces are not all co-possible', and founded populated pasts are equivalent to it together with the local-pieces premise; control 1 holds only because its antecedent fails. Its warrant must come from the general recombination principle it instantiates. 'Concrete' is the supplied Concrete parameter; the Lean type does not enforce the esse reading."
definitions = ["Reaper patchwork along every populated descent", "Local Reaper piece at a station of a descent of moments", "Reaper station registers of a history's worlds", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "Along every coinitial populated descent, adjacent Grim Reaper pieces are co-possible"
lean = "CoinitialReaperPiecesPossible"
paraphrase = "OPEN analyst premise, attribution deferred: the local-pieces premise restricted to coinitial descents, those that run below every moment earlier than their populated first moment (e.g. one station per past day where the past is metrically infinite). Such a descent exists only below a moment whose past has no beginning, so the premise says nothing about a past with a beginning, dense or not. Coinitiality is order-theoretic: a coinitial descent may accumulate metrically, as t/2^n does in the open-below past (0, t], so the premise also places pieces in shrinking slots of a metrically finite past with no first moment. 'Concrete' is the supplied Concrete parameter; the Lean type does not enforce the esse reading."
definitions = ["Local Reaper pieces co-possible along every coinitial populated descent", "Coinitial descent of moments", "Local Reaper piece at a station of a descent of moments", "Reaper station registers of a history's worlds", "DEF-INDEXED-SIGNAL-POSITIVE-TRIGGER", "DEF-INDEXED-SIGNAL-EMISSION", "DEF-INDEXED-SIGNAL-FORWARDING", "DEF-INDEXED-SIGNAL-INDEX-ADMISSIBILITY", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

