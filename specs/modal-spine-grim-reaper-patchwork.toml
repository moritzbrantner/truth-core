[[statement]]
id = "In every possible history, each beginningless populated past has a coinitial descent"
lean = "BeginninglessPastsCountablyCoinitial"
paraphrase = "OPEN analyst structural premise about the order of time, attribution deferred: in every history accessible from the selected world, every moment at which a contingent concrete individual is present and whose past has no beginning starts a strictly descending sequence of moments that runs below every earlier moment. Integer times satisfy it (checked in control 2); the full rational or real line by t - n, and an open-below half-line such as (0, infinity) by t/2^n, not separately checked. In linear time it fails only where a beginningless past has uncountable coinitiality. 'Concrete' is the supplied Concrete parameter."
definitions = ["Beginningless populated pasts have a coinitial descent", "Coinitial descent of moments", "Past of a moment with a beginning", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE", "008cb21a-256c-5a90-822c-acd4591d699a"]

[[statement]]
id = "In every possible history, each moment with a contingent concrete thing present has a begun past"
lean = "PopulatedPastsBegun"
paraphrase = "OPEN analyst premise, attribution deferred: in every history accessible from the selected world, every moment at which some contingent concrete individual is present has a past with a beginning (some moment at or before it has no earlier moment). It denies the begun version of horn H2 (a beginningless past at a populated moment) wherever a contingent concrete thing is present; histories with no contingent concrete thing present are unconstrained. Unlike founded populated pasts it allows continuous time with a first moment. Its cost: it excludes, in every accessible history, contingent presence in a past with no first moment even when that past is metrically finite. Standard FLRW Big Bang cosmology has such a past (time open below; the initial singularity is not a moment), so this premise denies that such a cosmology, populated, is possible. Because the beginning is a first moment of the shared time order, not of events, it also excludes empty beginningless time before a first event (creation in an absolute time with no first moment). In a branching order one minimal moment at or below a populated moment suffices, so other branches below it may be beginningless. It mentions no cause. 'Concrete' is the supplied Concrete parameter."
definitions = ["Begun populated pasts in every accessible history", "Past of a moment with a beginning", "DEF-KANT-MODAL-CONTINGENCY", "DEF-TEMPORAL-HISTORY-NOW-SLICE"]

[[statement]]
id = "Independence and nonvacuity controls for the Grim Reaper patchwork premises"
lean = "Control.Certificate"
paraphrase = "Closed mathematical controls, every individual counted concrete. (1) Integer worlds, individuals and times, every world accessible, every individual existing at every world but 0 and individual n present from time n on, with registers that are always empty and never issue: both patchwork premises hold, neither local-pieces premise holds, and populated pasts are neither founded nor begun. (2) The same history with pivot registers (world k: empty before k, issuing at k, code k from k on): both local-pieces premises hold, both patchwork premises fail, populated pasts are not begun, and beginningless populated pasts have coinitial descents. (3) The WithBot Int history of BegunComingToBe.Control.zeno (a first moment followed by moments with no earliest one) with empty registers: the coinitial local-pieces and patchwork premises, countable coinitiality, begun populated pasts and the earlier-grounded possibility premise all hold; begun coming-to-be is possible; no concrete individual is necessary at either world; populated pasts are not founded; and for every register frame the unrestricted local-pieces and patchwork premises do not both hold. These are statements about these interpretations only."
definitions = ["Reaper patchwork along every populated descent", "Local Reaper pieces co-possible along every populated descent", "Reaper patchwork along every coinitial populated descent", "Local Reaper pieces co-possible along every coinitial populated descent", "Beginningless populated pasts have a coinitial descent", "Begun populated pasts in every accessible history", "Founded populated pasts in every accessible history", "Possibly, a populated history whose contingent things have earlier grounds", "History of begun coming-to-be", "DEF-KANT-MODAL-CONTINGENCY"]

[[argument]]
id = "Founded populated pasts from Grim Reaper pieces and patchwork"
theorem = "populatedPastsFoundedOfPatchwork"
premises = ["Along every populated descent, adjacent Grim Reaper pieces are co-possible", "Co-possible Grim Reaper pieces along a populated descent glue into one possible world"]
conclusion = "In every possible history, each moment with a contingent concrete thing present has a founded past"
axioms = ["propext", "Classical.choice", "Quot.sound"]
strong_version_needed = {"Along every populated descent, adjacent Grim Reaper pieces are co-possible" = "Founded populated pasts must also exclude descents that accumulate above a first moment, which no coinitial descent reaches (GrimReaperPatchwork control 3: the coinitial premises hold in a begun but unfounded history).", "Co-possible Grim Reaper pieces along a populated descent glue into one possible world" = "Founded populated pasts must also exclude descents that accumulate above a first moment (GrimReaperPatchwork control 3)."}
rule = "Extract a descent below an unfounded populated moment; the local premise gives co-possible adjacent pieces, patchwork glues them into one world; read that world's registers as a Nat-indexed signal and refute it with IndexedSignalReaper.impossible"
meaning = "Non-transcription conditional support option for A3 prime a (founded populated pasts), replacing the near-transcription Reaper assembly route. Suppose a contingent concrete thing is present at t in an accessible history and t has no founded past; dependent choice gives a strictly descending sequence c from t. The local premise makes every two adjacent Reaper pieces along c co-possible; patchwork gives one accessible world u realizing all of them. Translating u's register codes into the indices of the stations they name (the descent is injective) yields a Nat-indexed signal and issuance satisfying index admissibility, positive trigger, emission and forwarding, which the verified IndexedSignalReaper.impossible refutes. Neither premise mentions foundedness, and each holds without the other in a beginningless integer history (controls 1 and 2). Because both premises range over every descent, they also exclude any populated history with a first moment followed by moments with no earliest one (control 3, on WithBot Int times), and with ComingToBeHorns control 8 contingent presence after the first moment of non-negative rational time: the unrestricted premises carry the same anti-continuum commitment as founded populated pasts. Both premises are OPEN; the arrangement's impossibility is mathematics, the possibility of the pieces and their gluing is the disputed metaphysics. Nothing is attributed to Koons or Pruss. No premise is established."

[[argument]]
id = "Begun populated pasts from coinitial Grim Reaper pieces and patchwork"
theorem = "populatedPastsBegunOfPatchwork"
premises = ["Along every coinitial populated descent, adjacent Grim Reaper pieces are co-possible", "Co-possible Grim Reaper pieces along a coinitial populated descent glue into one world", "In every possible history, each beginningless populated past has a coinitial descent"]
conclusion = "In every possible history, each moment with a contingent concrete thing present has a begun past"
axioms = ["propext", "Classical.choice", "Quot.sound"]
strong_version_needed = {"Along every coinitial populated descent, adjacent Grim Reaper pieces are co-possible" = "The conclusion is begun populated pasts; the spaced (metric) version reaches only metrically finite pasts (MetricGrimReaper control 2: spaced premises hold for every frame in an open-below finite past that is not begun).", "Co-possible Grim Reaper pieces along a coinitial populated descent glue into one world" = "The conclusion is begun populated pasts; the spaced (metric) version reaches only metrically finite pasts (MetricGrimReaper control 2)."}
rule = "A beginningless populated past has a coinitial descent; the coinitial local and patchwork premises put a glued Reaper arrangement along it in one world, which IndexedSignalReaper.impossible refutes"
meaning = "Non-transcription conditional support option for the begun version of A3 prime a, the faithful target of the Grim Reaper argument for a past with a beginning. Suppose a contingent concrete thing is present at t in an accessible history and the past of t has no beginning. Countable coinitiality gives some strictly descending sequence from t running below every earlier moment (e.g. one per past day where the past is metrically infinite; it may also accumulate metrically, as t/2^n in (0, t]). The coinitial local premise makes adjacent pieces co-possible, coinitial patchwork glues them into one accessible world, and the same register-to-signal translation as in the founded argument meets IndexedSignalReaper.impossible. The coinitial premises are implied by the unrestricted ones and are silent about pasts with a beginning, so its premises are satisfiable together with a first moment followed by moments with no earliest one (control 3, on WithBot Int times). Under its premises it does exclude contingent presence in an open-below past such as the positive reals, which is order-theoretically beginningless though metrically finite: in particular a populated standard FLRW cosmology, whose initial singularity is not a moment. That is a cost of these necessity premises (it does not touch the possibility premise A3 prime w). The metric restriction (slots of at least a fixed length) is MetricGrimReaper; it concludes metrically finite, not begun, populated pasts. All three premises are OPEN. Nothing is attributed to Koons or Pruss. No premise is established."

[[argument]]
id = "Possible begun coming-to-be from begun populated pasts and possible earlier grounds"
theorem = "possiblyBegunOfEarlierGrounds"
premises = ["In every possible history, each moment with a contingent concrete thing present has a begun past", "6dd276f0-24f5-459d-aadb-bef9745f297e"]
conclusion = "Possibly, every contingent concrete thing comes to be in a history whose past has a beginning"
axioms = ["propext", "Classical.choice", "Quot.sound"]
strong_version_needed = {"In every possible history, each moment with a contingent concrete thing present has a begun past" = "The derivation needs a moment with nothing earlier at or before the populated one; metrically finite populated pasts do not supply it (MetricGrimReaper control 2: metric finiteness and A3 prime b hold while begun coming-to-be is impossible)."}
rule = "In the earlier-grounded history, a never-generated contingent thing would be present at the first moment of its begun past, where no ground can have been present before it"
meaning = "Non-transcription conditional support option for premise A3 prime w of the modal spine (possible begun coming-to-be), pricing horn H1 with the begun version of A3 prime a. Take the accessible history in which every contingent concrete thing has an existing concrete ground present before each moment of its presence. Suppose a contingent concrete thing x present at t was never absent earlier. The past of t has a beginning m, at or before t, with nothing earlier; x is present at m; its ground must be present strictly before m, which is impossible. So every contingent concrete thing of that history comes to be, and begun coming-to-be is possible. Unlike its founded counterpart possiblyFoundedOfEarlierGrounds, this bundle does not entail that a necessary concrete individual is possible: BegunComingToBe.Control.zeno satisfies both premises (and the coinitial Grim Reaper premises) with no necessary individual at either world (control 3). Both premises are OPEN. No premise is established."

