# Stage two of the modal spine: one route to the restated sufficiency (5fbea2f5)
# and one to the Dei Filius root (c0f4a346) that pass all five Dei Filius
# primitives through their typed senses at once (LIVING_2 from the nine through
# the operation derivation, LORD_2, BLESSED_2, IMMENSE_2, INCOMPREHENSIBLE_2) and
# their five sense bridges, with none of the old living, lord, blessed, immense
# or incomprehensible bridges. The open bridge 'Whatever has its being caused by
# another is not INFINITE_1' (18ca6f9d) is derived from four existing open
# reception-limitation premises. Two finite models witness the joint
# satisfiability of each unified route's whole premise bundle, with the open
# leaves of its nine-statements' registered derivations, together with a being
# that has the nine. Analyst formulations, attribution deferred.

[batch]
vocab = "TruthCore.Causality.DeiFiliusUnifiedRoute"
results = "TruthCore.Results.Causality.DeiFiliusUnifiedRoute"

# ---------------------------------------------------------------- statements

[[statement]]
id = "Whatever has its being caused by another has its esse received in some principle"
lean = "CausedEsseIsReceived"
paraphrase = "Open bridge, analyst formulation, unattributed. For all c and x: if c is distinct from x and c causes x's being (CausesIn c x esse), then x's esse is received in some principle (EsseReceivedIn x z for some z: a principle standing to it as receiving potency to received act, DEF-ESSE-RECEIVED-IN). After ST I q.7 a.2 (the esse of a subsistent created form is received and contracted) and De ente c.4 (what has esse from another receives it), generalized to everything caused as to being; the generalization is the analyst's. It joins, as one explicit premise, the two notions DISAMB-ESSE-RECEPTION keeps apart: origin from another and reception in a principle. It does not use Creature, so it does not depend on whether DEF-CREATURE (ordered to God as principle and cause) is read narrowly or broadly. It does not say the principle is the thing's own essence (that is STMT-ESSE-RECEIVED-IN-OWN-ESSENCE), nor what the principle really is. SCOPE CONDITION (definition 80dea550): elements of Being are individuated by their act of being, so the divine processions are no instances of CausesIn c x esse with c distinct from x; read with them as instances, the bridge would give the Son received, and with STMT-RECEIVED-ESSE-IS-LIMITED limited, esse, contrary to the case's Nicene commitment. Unread lead, no evidential weight: the tradition denying a real distinction of esse and essence in creatures (Scotus, Ockham, later metaphysics; lead text Suarez, Disputationes metaphysicae 31) would target this bridge if the receiving principle must be really distinct; it would reject this route to finitude, not the finitude of caused things."
definitions = ["DEF-ESSE-RECEIVED-IN", "DEF-CAUSE-OF-PERFECTION", "DEF-ESSE", "80dea550-60c1-447a-83bf-d3f27ea0b2a8"]
disambiguations = ["DISAMB-ESSE-RECEPTION", "DISAMB-CAUSE"]

[[statement]]
id = "Joint-satisfiability models for the unified Dei Filius route"
lean = "Control.Controls"
paraphrase = "Closed controls on two explicit interpretations; statements about these interpretations only. (1) Sufficiency model, two beings: true has the nine; false is a caused intellect, composite (its esse is not its essence), in potency to understanding and moved in that respect, not INFINITE_1, caused, with received and limited esse; only true is LIVING_1, LORD_1, IMMENSE_1, INCOMPREHENSIBLE_1 and BLESSED_1. Every premise of the unified sufficiency route holds, as do the open leaves of the registered derivations of its nine-statements (intellect is the capacity to understand; that capacity is exercised or in potency; exercised understanding is an immanent operation; the self-operating unmoved lives; nothing is moved except as in potency; the directing bridge; directing is governing; the caused-esse-is-received bridge and the two reception premises; the finite-intellect bridge) and 'Whatever has its being caused by another is not INFINITE_1'. true has every Dei Filius attribute, and the old bridge 'Whatever HAS_INTELLECT_1 lives' fails (false has intellect and is not LIVING_1). (2) Root model, given excluded middle: the four roles of the full25 fixture of the spine root with its act, cause, grade, modal, part, priority, cognitive, potency and eternity dictionaries unchanged and one change, every essence is source, so every role other than source has esse distinct from essence, is composite and is not INFINITE_1. All twenty-two spine-root premises, the eleven Dei Filius premises of the unified root route and the same leaves hold, and the selected root source has every Dei Filius attribute. On the all-true act dictionary every role is pure act and universally perfect, so the recipient is also BLESSED_2 and LIVING_1; the model witnesses joint satisfiability only. In it every caused role's esse is received in the divine essence (every essence is source), and the roles with limited esse are universally perfect, so EsseLimited is not tied to perfection there. (3) In the unchanged full25 fixture, whose INFINITE_1 is esse equal to essence, 'Whatever has its being caused by another is not INFINITE_1' fails: supporter is caused by source and has esse equal to essence. That is why model (2) changes the essence map."
definitions = ["DEF-INFINITE", "80dea550-60c1-447a-83bf-d3f27ea0b2a8", "4433942e-aaf6-55a9-b777-66e55638103d", "6ced5205-e6a4-585e-950e-3b22e7c9ef01", "641c767b-4289-4d92-b900-da7ad603d282", "94ebe0d2-7cf9-4360-87ce-61c598b4e666", "4afe4ab4-f8cc-4120-b284-f1f0140e76c1"]
disambiguations = ["DISAMB-INFINITY", "3fc3ee02-c3cc-4a61-9724-914d9d07b0dd", "d63d0696-e5fb-4c85-932e-812989c83b29", "aa1de96a-e0d2-4739-a34f-9b98f1034a34", "70f4f510-d488-445f-86cf-03b889507372", "1f2d3b9b-0b6b-459c-8871-3f136ad6d78a"]

# ---------------------------------------------------------------- arguments

[[argument]]
id = "What is caused by another is not INFINITE_1, from reception limitation"
theorem = "causedIsNotInfiniteFromReception"
premises = ["Whatever has its being caused by another has its esse received in some principle", "STMT-RECEIVED-ESSE-IS-LIMITED", "STMT-INFINITE-ESSE-IS-UNLIMITED"]
conclusion = "18ca6f9d-b443-441c-8554-58d75eb021f2"
axioms = []
rule = "Chain: caused by another, so its esse is received in some principle; received esse is limited; an INFINITE_1 being's esse is not limited"
meaning = "Let x have its being caused by some c other than x. By the first premise x's esse is received in some principle z; by the second its esse is limited; by the third an INFINITE_1 being's esse is not limited, so x is not INFINITE_1. The step from having an external cause of esse to having received esse (kept apart in DISAMB-ESSE-RECEPTION) is the one explicit bridge premise, not an identification of the two senses, and the derivation does not pass through Creature (an earlier draft of this PR did, through STMT-CAUSED-IN-BEING-BY-ANOTHER-IS-CREATURE and STMT-CREATURE-ESSE-IS-RECEIVED; it was replaced because those two premises read Creature in different extensions, broad and DEF-CREATURE's narrow one). The scope condition of the conclusion binds the first premise in the same way (definition 80dea550). Conditional consequence; the three premises stay open (the bridge bare, the other two supported by q.7 a.1-2 readings)."

