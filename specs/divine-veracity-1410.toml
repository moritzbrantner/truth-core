disambiguations = []

[[argument]]
id = "Divine assertion route structural controls certificate"
theorem = "controls"
premises = []
conclusion = "Veracity route structural controls"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Construction of explicit interpretations"
meaning = "Skeleton interpretations only: real classified bearer and actual assertion in joint sample; every A/B premise omission permits false assertion; noncontradiction does not give sincerity; cognitive perfection plus permission needs an independent contrary-sign norm. No utility, counterfactual necessity, or metaphysical possibility claim."
