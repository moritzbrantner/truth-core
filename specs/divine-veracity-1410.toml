[[statement]]
id = "Veracity route structural controls"
lean = "Control.Certificate"
paraphrase = "Structural controls for divine assertion truth: joint lower-branch sample, four route-premise omission samples, suspension without contrary assent, and accurate complete cognition with permitted false assertion when the contrary-sign norm is absent. Not a possible-world witness of classical theism."
