[[argument]]
id = "Sincerity and accurate assent yield assertion truth"
theorem = "assertionTruthA"
premises = ["Veracity GodSincere", "Veracity GodAssentAccurate"]
conclusion = "Veracity GodAssertsOnlyTruth"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Introduce one speaker and proposition; specialize sincerity and then accuracy. No factivity of Knows."

[[argument]]
id = "Actual completeness and no contrary assertion yield assertion truth"
theorem = "assertionTruthB"
premises = ["Veracity GodCounterAssertionComplete", "Veracity GodNoContraryAssertion"]
conclusion = "Veracity GodAssertsOnlyTruth"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Universal specialization and implication composition"
meaning = "Classically assume not-p; truth-completeness gives assent to not-p, contradicting no contrary assertion. No sincerity or general consistency is assumed."

[[argument]]
id = "Actual completeness and consistent assent yield accuracy"
theorem = "accuracyFromCompleteConsistent"
premises = ["Veracity GodTruthComplete", "Veracity GodAssentConsistent"]
conclusion = "Veracity GodAssentAccurate"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Universal specialization and implication composition"
meaning = "Classically a false assent to p would pair with assent to true not-p. This stronger cognitive branch is separate from minimal Route B."

[[argument]]
id = "Permission and positive endorsement yield sincerity"
theorem = "sincerityFromNorms"
premises = ["Veracity GodAssertionsPermitted", "Veracity PermittedAssertionEndorsed"]
conclusion = "Veracity GodSincere"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Apply the OPEN permission applicability and OPEN positive endorsement norm. Forbidding lies alone is insufficient."

[[argument]]
id = "Permission and contrary-sign norm exclude contrary assertion"
theorem = "noContraryFromNorms"
premises = ["Veracity GodAssertionsPermitted", "Veracity ContraryAssertionImpermissible"]
conclusion = "Veracity GodNoContraryAssertion"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "A genuinely asserted proposition is permitted; opposed assent would make that assertion impermissible. Beneficial-deception rivals contest the second premise."

[[argument]]
id = "False assent defect and divine defect exclusion yield accuracy"
theorem = "accuracyFromDefects"
premises = ["Veracity FalseAssentDefective", "Veracity GodDefectFree"]
conclusion = "Veracity GodAssentAccurate"
axioms = ["propext", "Classical.choice", "Quot.sound"]
rule = "Universal specialization and implication composition"
meaning = "Classically a false actual assent would instantiate the forbidden cognitive defect. Non-discursiveness alone is not a premise."

[[argument]]
id = "Actual truth presence and apprehension yield complete assent"
theorem = "completenessFromActualCognition"
premises = ["Veracity GodTruthPresent", "Veracity PresenceApprehended", "Veracity ApprehensionAssented"]
conclusion = "Veracity GodTruthComplete"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Every truth is actually present to the same intellect; actual access and propositional assent bridges yield completeness. No capacity-to-actuality inference."

[[argument]]
id = "Sincere assent and held-known bridge recover old assertion leaf"
theorem = "oldKnowingFromAssent"
premises = ["Veracity GodSincere", "Veracity GodAssentHeldKnown"]
conclusion = "4d47d4ae-7aa9-5bba-8aa7-68f79ff8dfa9"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Compose actual assent with the separate OPEN assent-to-held-known bridge; no new factivity."

[[argument]]
id = "Separate assent leaves recover old bundled attribute bridge"
theorem = "oldAttributeFromAssent"
premises = ["Veracity GodSincere", "Veracity GodAssentHeldKnown"]
conclusion = "7cffee54-a87d-504e-80d1-81ada7387696"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Pair sincerity and assent-to-held-known for the same speaker. This is an alternative support of the existing bridge, not its discharge."

[[argument]]
id = "Assertion truth reconnects divine confirmation to authority"
theorem = "confirmsFromAssertion"
premises = ["b426b086-1b1c-5137-94e6-a2f17402481f", "Veracity GodAssertsOnlyTruth"]
conclusion = "c1deb2ee-770d-5030-9e5c-302e33028811"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Confirmation counts as genuine assertion by the existing OPEN universal bridge; assertion truth then yields the exact existing GodConfirmsOnlyTruth endpoint."


[[argument]]
id = "Unrestricted actual truth completeness supplies asserted-countertruth scope"
theorem = "completenessWeakens"
premises = ["Veracity GodTruthComplete"]
conclusion = "Veracity GodCounterAssertionComplete"
axioms = []
rule = "Universal specialization and implication composition"
meaning = "Restrict actual completeness to true negations of actual asserted contents. Route B uses this weaker version; full completeness remains useful for the separate general accuracy branch."

